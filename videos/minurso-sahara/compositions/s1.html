<template>
  <style>
    @font-face { font-family: "Plex Arabic"; src: url("assets/fonts/IBMPlexSansArabic-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: "Plex Arabic"; src: url("assets/fonts/IBMPlexSansArabic-SemiBold.ttf"); font-weight: 600; }
    @font-face { font-family: "Plex Arabic"; src: url("assets/fonts/IBMPlexSansArabic-Bold.ttf"); font-weight: 700; }
    @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2"); font-weight: 700; }
    #root { position: absolute; inset: 0; direction: rtl; font-family: "Plex Arabic", sans-serif; color: #E8EEEC; pointer-events: none; }
    .hdr { position: absolute; top: 196px; right: 64px; left: 64px; }
    .eb-row { display: flex; align-items: center; justify-content: space-between; height: 46px; }
    .eb { display: flex; align-items: center; gap: 18px; color: #F4A62A; font-weight: 600; font-size: 30px; }
    .eb::before { content: ""; width: 60px; height: 4px; border-radius: 2px; background: #F4A62A; }
    .pill { background: rgba(244, 166, 42, 0.12); color: #F4A62A; border-radius: 100px; padding: 4px 22px 8px; font-size: 26px; font-weight: 600; }
    .ttl { margin-top: 14px; font-size: 68px; line-height: 1.15; font-weight: 700; }
    .num { font-family: "Space Grotesk", sans-serif; font-weight: 700; }
    .w { display: inline-block; }
    .card { background: #141D21; border: 1.5px solid #26343B; border-radius: 14px; }
    .years { display: flex; align-items: center; gap: 22px; margin-top: 26px; font-size: 40px; }
    .years .y0 { color: #93A4A7; }
    .years .bar { width: 380px; height: 4px; background: #26343B; border-radius: 2px; overflow: hidden; }
    .years .bar i { display: block; height: 100%; background: #F4A62A; transform-origin: 100% 50%; }

  </style>
  <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
    <div class="hdr" id="s1-hdr">
      <div class="eb-row"><div class="eb">ما بعد المينورسو</div></div>
      <h1 class="ttl">بعد <span class="num">35</span> سنة… المينورسو تغادر</h1>
      <div class="years" id="s1-years"><span class="num y0">1991</span><span class="bar"><i id="s1-bar"></i></span><span class="num" id="s1-y1">1991</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s1";
      const tl = gsap.timeline({ paused: true });
      const C = window.CUES, SC = C.scenes[ID];
      const DUR = SC.end - SC.start;
      const P = (id) => ({ start: C.phrases[id].start - SC.start, end: C.phrases[id].end - SC.start });
      const wordAt = (pid, needle, fb = 0) => {
        const w = C.phrases[pid].words.find((x) => x.text.includes(needle));
        return (w ? w.start : C.phrases[pid].start + fb) - SC.start;
      };
      const wordsIn = (sel, t0) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, t0);
      const blurIn = (sel, t0, d = 0.2) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out" }, t0);
      const blurOut = (sel, t0, d = 0.18) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: d, ease: "power2.in" }, t0);
      // frame 0 is the hook: title and map already on screen
      const tYears = wordAt("s1p1", "وثلاثين", 0.5) - 0.15;
      blurIn("#s1-years", tYears, 0.2);
      tl.fromTo("#s1-bar", { scaleX: 0 }, { scaleX: 1, duration: 1.3, ease: "power2.out" }, tYears + 0.1);
      const yr = { v: 1991 };
      tl.fromTo(yr, { v: 1991 }, { v: 2026, duration: 1.3, ease: "power2.out",
        onUpdate: () => (document.getElementById("s1-y1").textContent = Math.round(yr.v)) }, tYears + 0.1);
      blurOut("#s1-hdr", DUR - 0.24);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
