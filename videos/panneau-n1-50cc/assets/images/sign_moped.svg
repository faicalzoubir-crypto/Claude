<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- "No mopeds" sign of the N1, redrawn flat. Pictogram traced on the clean render
       the user sent (assets/images/source/sign_reference.jpg), measured in this
       600-unit box; red and ring proportions from their photo of the real sign. -->
  <circle cx="300" cy="300" r="298" fill="#F5F5F2" />
  <circle cx="300" cy="300" r="290" fill="#E43223" />
  <circle cx="300" cy="300" r="205" fill="#F5F5F2" />
  <g fill="#141414" stroke="#141414" stroke-linejoin="round">
    <!-- front wheel: tyre, hub, mudguard -->
    <circle cx="182.5" cy="355" r="50.5" fill="none" stroke-width="11" />
    <circle cx="182.5" cy="355" r="9" stroke="none" />
    <path d="M 146.9 304.2 A 62 62 0 0 1 236.7 385.1" fill="none" stroke-width="12" />
    <!-- fork, headlamp block, handlebar -->
    <path d="M 180 352 L 209 284" fill="none" stroke-width="11" stroke-linecap="round" />
    <rect x="182.5" y="236.5" width="50" height="32.5" rx="2" stroke="none" />
    <path d="M 229 238 L 231 222 L 220 211 L 248 195" fill="none" stroke-width="11" />
    <!-- step-through frame down to the engine -->
    <path d="M 213 266 L 236 255 L 282 285 L 280 331 L 214 292 Z" stroke="none" />
    <!-- engine and body, rear rack -->
    <path d="M 277.5 285 L 450 285 L 450 300 L 360 300 L 360 352 Q 360 365 347 365 L 292 365 Q 277.5 365 277.5 350 Z" stroke="none" />
    <rect x="390" y="279" width="60" height="13.5" rx="2" stroke="none" />
    <!-- seat on its sloping post -->
    <path d="M 322.5 249 L 386 249 Q 392 249 391 256 L 389 263 Q 388 268 381 268 L 333 268 Z" stroke="none" />
    <path d="M 340 266 L 360 266 L 362 288 L 344 288 Z" stroke="none" />
    <!-- rear wheel: tyre, mudguard, swingarm and hub -->
    <circle cx="407.5" cy="355" r="50.5" fill="none" stroke-width="11" />
    <path d="M 396.7 293.9 A 62 62 0 0 1 469.2 348.5" fill="none" stroke-width="12" />
    <path d="M 340 330 L 407.5 330 L 407.5 372 L 340 372 Z" stroke="none" />
    <circle cx="407.5" cy="351" r="22.5" stroke="none" />
  </g>
</svg>
