<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="f3-batterie-template">
      <style>
        @font-face { font-family: "Saira"; src: url("../assets/fonts/Saira-Italic.ttf") format("truetype"); font-weight: 100 900; font-stretch: 50% 125%; font-style: italic; }
        @font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/JetBrainsMono.ttf") format("truetype"); font-weight: 100 800; }

        #f3-root { position: absolute; inset: 0; overflow: hidden; background: #080b0f; color: #f2f5f0; }
        #f3-root .layer { position: absolute; inset: 0; }
        #f3-wall { background: radial-gradient(ellipse 80% 45% at 50% 28%, #16201a 0%, #0b100e 50%, #06080b 100%); }
        #f3-grid { opacity: 0.5; background-image: linear-gradient(rgba(166, 242, 28, 0.07) 2px, transparent 2px), linear-gradient(90deg, rgba(166, 242, 28, 0.07) 2px, transparent 2px); background-size: 90px 90px;
          -webkit-mask-image: radial-gradient(ellipse 70% 40% at 50% 30%, #000 0%, transparent 100%); mask-image: radial-gradient(ellipse 70% 40% at 50% 30%, #000 0%, transparent 100%); }
        #f3-floorglow { position: absolute; left: 90px; right: 90px; top: 1760px; height: 140px; border-radius: 50%; background: radial-gradient(ellipse, rgba(166, 242, 28, 0.16), rgba(166, 242, 28, 0) 70%); }

        #f3-stage { position: absolute; left: 230px; top: 1430px; width: 620px; height: 476px; transform-origin: 0 0; }
        #f3-stage > img { position: absolute; inset: 0; width: 100%; height: 100%; }
        #f3-scan { position: absolute; top: -20px; bottom: -20px; left: 0; width: 10px; background: #e9ffc4; box-shadow: 0 0 26px 10px #a6f21c; opacity: 0; }
        #f3-ghost { position: absolute; left: 25%; top: 46%; width: 15.5%; height: 16.5%; border: 4px solid #b8ff3a; border-radius: 10px; background: rgba(166, 242, 28, 0.22); box-shadow: 0 0 30px rgba(166, 242, 28, 0.8); opacity: 0; }
        #f3-lock { position: absolute; left: calc(32.75% - 90px); top: calc(54.25% - 90px); width: 180px; height: 180px; border-radius: 50%; border: 6px solid #b8ff3a; opacity: 0; }

        #f3-kicker { position: absolute; left: 0; right: 0; top: 124px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.16em; color: #a6f21c; opacity: 0; }

        #f3-scene { position: absolute; left: 0; right: 0; top: 210px; height: 490px; perspective: 1700px; }
        #f3-fly { position: absolute; left: 280px; top: 95px; width: 520px; height: 300px; transform-style: preserve-3d; opacity: 0; }
        #f3-bat { position: absolute; inset: 0; transform-style: preserve-3d; }
        .f3-face { position: absolute; background: linear-gradient(160deg, #262d36 0%, #161b22 55%, #0e1217 100%); border: 3px solid rgba(166, 242, 28, 0.55); box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.55); }
        #f3-front { left: 0; top: 0; width: 520px; height: 300px; transform: translateZ(100px); }
        #f3-back { left: 0; top: 0; width: 520px; height: 300px; transform: rotateY(180deg) translateZ(100px); }
        #f3-right { left: 160px; top: 0; width: 200px; height: 300px; transform: rotateY(90deg) translateZ(260px); background: linear-gradient(160deg, #1d232b, #0c0f13); }
        #f3-left { left: 160px; top: 0; width: 200px; height: 300px; transform: rotateY(-90deg) translateZ(260px); }
        #f3-top { left: 0; top: 50px; width: 520px; height: 200px; transform: rotateX(90deg) translateZ(150px); background: linear-gradient(180deg, #343c47, #1d232b); }
        #f3-bottom { left: 0; top: 50px; width: 520px; height: 200px; transform: rotateX(-90deg) translateZ(150px); }
        #f3-handle { position: absolute; left: 170px; top: 70px; width: 180px; height: 56px; border-radius: 28px; background: #0b0e12; border: 3px solid rgba(166, 242, 28, 0.6); }
        #f3-label { position: absolute; left: 26px; top: 20px; right: 26px; display: flex; justify-content: space-between; align-items: baseline; }
        #f3-label span { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.12em; color: #a6f21c; }
        #f3-label b { font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 80%; font-size: 38px; color: #f2f5f0; }
        #f3-cells { position: absolute; left: 26px; right: 26px; top: 78px; bottom: 22px; border-radius: 10px; background: #07090c; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; padding: 12px; }
        .f3-cell { border-radius: 50%; background: #1f262e; border: 2px solid #39434d; }
        .f3-row1, .f3-row2, .f3-row3, .f3-row4 { }

        #f3-eq { position: absolute; left: 0; right: 0; top: 728px; text-align: center; font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 75%; }
        #f3-eq1 { display: block; font-size: 104px; line-height: 1.05; opacity: 0; }
        #f3-eq2 { display: block; font-size: 64px; line-height: 1.1; color: #c9d2c2; opacity: 0; }
        #f3-eq3 { display: block; font-size: 156px; line-height: 1.02; color: #a6f21c; text-shadow: 0 0 40px rgba(166, 242, 28, 0.45); opacity: 0; }

        #f3-auto { position: absolute; left: 70px; right: 70px; top: 1104px; opacity: 0; }
        #f3-auto-head { display: flex; justify-content: space-between; align-items: baseline; }
        #f3-auto-head span { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 28px; letter-spacing: 0.12em; color: #c9d2c2; }
        #f3-auto-head b { font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 75%; font-size: 72px; color: #f2f5f0; }
        #f3-bar { position: relative; margin-top: 10px; width: 940px; height: 30px; border-radius: 15px; background: #1a2026; overflow: hidden; }
        #f3-bar-solid { position: absolute; left: 0; top: 0; width: 783px; height: 30px; background: #a6f21c; transform-origin: 0 50%; box-shadow: 0 0 20px rgba(166, 242, 28, 0.6); }
        #f3-bar-range { position: absolute; left: 783px; top: 0; width: 157px; height: 30px; transform-origin: 0 50%;
          background: repeating-linear-gradient(135deg, rgba(166, 242, 28, 0.85) 0 10px, rgba(166, 242, 28, 0.25) 10px 20px); }
        #f3-ticks { position: relative; width: 940px; height: 34px; margin-top: 6px; font-family: "JetBrains Mono", monospace; font-size: 24px; color: #98a392; }
        #f3-ticks span { position: absolute; top: 0; transform: translateX(-50%); }
        #f3-charge { position: absolute; left: 70px; right: 70px; top: 1290px; display: flex; align-items: center; gap: 22px; font-family: "Saira", sans-serif; font-style: italic; font-weight: 700; font-stretch: 85%; font-size: 48px; opacity: 0; }
        #f3-charge svg { width: 64px; height: 64px; flex: none; }
        #f3-note { position: absolute; left: 70px; right: 70px; top: 1366px; font-family: "JetBrains Mono", monospace; font-size: 24px; line-height: 1.35; color: #98a392; opacity: 0; }
        #f3-flash { background: #f4ffe6; opacity: 0; }
      </style>

      <div data-hf-id="hf-rd6y" id="f3-root" data-composition-id="f3-batterie" data-width="1080" data-height="1920" data-duration="7">
        <div data-hf-id="hf-mtn9" id="f3-wall" class="layer"></div>
        <div data-hf-id="hf-do6l" id="f3-grid" class="layer"></div>
        <div data-hf-id="hf-px3u" id="f3-floorglow"></div>

        <div data-hf-id="hf-ke0c" id="f3-stage" data-layout-allow-overflow="">
          <img data-hf-id="hf-y5zd" src="../assets/m26/profil.webp" alt="M26 de profil, logement de batterie sous la selle">
          <div data-hf-id="hf-1ptq" id="f3-ghost"></div>
          <div data-hf-id="hf-ymg8" id="f3-lock"></div>
          <div data-hf-id="hf-fiia" id="f3-scan"></div>
        </div>

        <div data-hf-id="hf-t72b" id="f3-kicker">BATTERIE LITHIUM-ION · AMOVIBLE</div>
        <div data-hf-id="hf-spv3" id="f3-scene">
          <div data-hf-id="hf-qq0s" id="f3-fly">
            <div data-hf-id="hf-m97q" id="f3-bat">
              <div data-hf-id="hf-945y" id="f3-back" class="f3-face"></div>
              <div data-hf-id="hf-52za" id="f3-bottom" class="f3-face"></div>
              <div data-hf-id="hf-uvcg" id="f3-left" class="f3-face"></div>
              <div data-hf-id="hf-qr4v" id="f3-right" class="f3-face"></div>
              <div data-hf-id="hf-c4pw" id="f3-top" class="f3-face"><div data-hf-id="hf-1jar" id="f3-handle"></div></div>
              <div data-hf-id="hf-bclc" id="f3-front" class="f3-face">
                <div data-hf-id="hf-sd65" id="f3-label"><span data-hf-id="hf-v5oo">LITHIUM-ION</span><b data-hf-id="hf-7m1v">72V · 45Ah</b></div>
                <div data-hf-id="hf-ew5c" id="f3-cells"></div>
              </div>
            </div>
          </div>
        </div>

        <div data-hf-id="hf-lkmf" id="f3-eq"><span data-hf-id="hf-b6kl" id="f3-eq1">72 V × 45 Ah</span><span data-hf-id="hf-1jdr" id="f3-eq2">= 3 240 Wh</span><span data-hf-id="hf-ghu2" id="f3-eq3">= <span data-hf-id="hf-wd2e" id="f3-kwh">0,00</span> kWh</span></div>

        <div data-hf-id="hf-72w4" id="f3-auto">
          <div data-hf-id="hf-fvxv" id="f3-auto-head"><span data-hf-id="hf-gxwr">AUTONOMIE ANNONCÉE*</span><b data-hf-id="hf-n8wy">≈ 100–120 km</b></div>
          <div data-hf-id="hf-wd1k" id="f3-bar"><div data-hf-id="hf-h7fy" id="f3-bar-solid"></div><div data-hf-id="hf-anf8" id="f3-bar-range"></div></div>
          <div data-hf-id="hf-fbwt" id="f3-ticks"><span data-hf-id="hf-ccao" style="left: 12px">0</span><span data-hf-id="hf-j2zg" style="left: 392px">50 km</span><span data-hf-id="hf-mtj2" style="left: 783px">100</span><span data-hf-id="hf-6054" style="left: 916px">120</span></div>
        </div>
        <div data-hf-id="hf-ckhh" id="f3-charge">
          <svg data-hf-id="hf-ha7k" viewBox="0 0 64 64" aria-hidden="true"><rect data-hf-id="hf-p4gh" x="18" y="6" width="6" height="16" rx="2" fill="#a6f21c" /><rect data-hf-id="hf-df9u" x="40" y="6" width="6" height="16" rx="2" fill="#a6f21c" /><path data-hf-id="hf-i754" d="M12,22 h40 v10 a20,20 0 0 1 -40,0 z" fill="#a6f21c" /><rect data-hf-id="hf-whm6" x="28" y="50" width="8" height="12" rx="3" fill="#a6f21c" /></svg>
          <span data-hf-id="hf-d7g9">Charge 5–6 h · prise domestique</span>
        </div>
        <div data-hf-id="hf-oo18" id="f3-note">*Valeurs annoncées : varient selon la vitesse, le poids, le relief, la température et l'état de la batterie.</div>
        <div data-hf-id="hf-bcwp" id="f3-flash" class="layer"></div>
      </div>

      <script>
        (() => {
          const cells = document.getElementById("f3-cells");
          for (let i = 0; i < 40; i++) {
            const c = document.createElement("div");
            c.className = "f3-cell f3-row" + (Math.floor(i / 10) + 1);
            cells.appendChild(c);
          }
          const tl = gsap.timeline({ paused: true });

          // the scooter arrives big, a scan line finds the battery bay, then it settles low in frame
          tl.fromTo("#f3-stage", { x: -270, y: -730, scale: 1.871, filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 0);
          tl.fromTo("#f3-scan", { opacity: 1, x: 0 }, { opacity: 1, x: 610, duration: 0.6, ease: "power1.inOut", immediateRender: false }, 0.1);
          tl.to("#f3-scan", { opacity: 0, duration: 0.1 }, 0.7);
          tl.fromTo("#f3-ghost", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.4);
          tl.to("#f3-stage", { x: 0, y: 0, scale: 1, duration: 0.65, ease: "power3.inOut" }, 0.75);
          tl.fromTo("#f3-kicker", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.45);

          // the removable battery lifts out and turns in 3D
          tl.fromTo("#f3-fly", { x: -105, y: 1235, scale: 0.16, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.85, ease: "power3.inOut" }, 1.0);
          tl.fromTo("#f3-bat", { rotationY: -48, rotationX: -8 }, { rotationY: -24, rotationX: -18, duration: 1.4, ease: "power2.out" }, 1.0);
          tl.to("#f3-bat", { rotationY: -14, duration: 4.0, ease: "sine.inOut" }, 2.4);
          tl.to("#f3-ghost", { opacity: 0.35, duration: 0.4 }, 1.4);
          [1, 2, 3, 4].forEach((r, i) => {
            tl.fromTo(`#f3-root .f3-row${r}`, { backgroundColor: "#1f262e", borderColor: "#39434d" },
              { backgroundColor: "#b8ff3a", borderColor: "#e9ffc4", duration: 0.2, stagger: 0.02, ease: "power1.out" }, 2.2 + i * 0.28);
          });

          // the energy equation
          tl.fromTo("#f3-eq1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.2);
          tl.fromTo("#f3-eq2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.85);
          tl.fromTo("#f3-eq3", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 3.3);
          const kwh = { v: 0 };
          tl.fromTo(kwh, { v: 0 }, { v: 3.24, duration: 0.7, ease: "power2.out", onUpdate: () => {
            document.getElementById("f3-kwh").textContent = kwh.v.toFixed(2).replace(".", ",");
          } }, 3.3);

          // announced range and charge time
          tl.fromTo("#f3-auto", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.55);
          tl.fromTo("#f3-bar-solid", { scaleX: 0 }, { scaleX: 1, duration: 0.85, ease: "power2.inOut" }, 4.7);
          tl.fromTo("#f3-bar-range", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 5.55);
          tl.fromTo("#f3-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.0);
          tl.fromTo("#f3-charge", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 5.55);

          // the battery drops back into its bay and locks
          tl.to("#f3-fly", { x: -105, y: 1235, scale: 0.16, duration: 0.55, ease: "power3.in" }, 6.05);
          tl.to("#f3-fly", { opacity: 0, duration: 0.08 }, 6.55);
          tl.to("#f3-ghost", { opacity: 1, duration: 0.1 }, 6.55);
          tl.fromTo("#f3-lock", { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.45, ease: "power2.out", immediateRender: false }, 6.6);
          tl.to("#f3-ghost", { opacity: 0, duration: 0.3 }, 6.75);

          // exit: lateral whip toward the charging garage
          tl.to("#f3-root .layer, #f3-stage, #f3-kicker, #f3-scene, #f3-eq, #f3-auto, #f3-charge, #f3-note", { x: -260, opacity: 0, duration: 0.22, ease: "power2.in" }, 6.78);

          window.__timelines["f3-batterie"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
