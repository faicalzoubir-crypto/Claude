<!DOCTYPE html>

    <template id="f2-moteur-template">
      <style>
        @font-face { font-family: "Saira"; src: url("../assets/fonts/Saira-Italic.ttf") format("truetype"); font-weight: 100 900; font-stretch: 50% 125%; font-style: italic; }
        @font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/JetBrainsMono.ttf") format("truetype"); font-weight: 100 800; }

        #f2-root { position: absolute; inset: 0; overflow: hidden; background: #080b0f; color: #f2f5f0; }
        #f2-root .layer { position: absolute; inset: 0; }
        #f2-wall { background: radial-gradient(ellipse 90% 60% at 50% 45%, #131925 0%, #0a0e15 55%, #06080b 100%); }
        #f2-glow-b { position: absolute; left: -300px; top: 700px; width: 900px; height: 900px; border-radius: 50%; filter: blur(70px); background: radial-gradient(circle, rgba(47, 107, 255, 0.4), rgba(47, 107, 255, 0) 70%); }
        #f2-glow-r { position: absolute; right: -300px; top: 700px; width: 900px; height: 900px; border-radius: 50%; filter: blur(70px); background: radial-gradient(circle, rgba(255, 58, 58, 0.35), rgba(255, 58, 58, 0) 70%); }

        /* phase A: zoom into the rear wheel */
        #f2-zoom { position: absolute; inset: 0; }
        #f2-stage { position: absolute; left: 40px; top: 760px; width: 1000px; height: 767px; transform-origin: 0 0; }
        #f2-stage img { width: 100%; height: 100%; display: block; }
        #f2-shade-top { background: linear-gradient(180deg, rgba(6, 8, 11, 0.94) 0%, rgba(6, 8, 11, 0.75) 26%, rgba(6, 8, 11, 0) 40%); opacity: 0; }
        #f2-shade-bot { background: linear-gradient(0deg, rgba(6, 8, 11, 0.95) 0%, rgba(6, 8, 11, 0.7) 22%, rgba(6, 8, 11, 0) 36%); opacity: 0; }
        #f2-xray { position: absolute; left: 200px; top: 620px; width: 680px; height: 680px; opacity: 0; }
        #f2-xray-disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(4, 10, 7, 0.9) 0%, rgba(4, 10, 7, 0.86) 62%, rgba(4, 10, 7, 0.55) 80%, rgba(4, 10, 7, 0) 100%);
          box-shadow: inset 0 0 0 4px rgba(166, 242, 28, 0.85), 0 0 60px rgba(166, 242, 28, 0.35); }
        #f2-motor { position: absolute; inset: 0; width: 100%; height: 100%; }
        #f2-current { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: visible; }
        #f2-current path { fill: none; stroke: #b8ff3a; stroke-width: 10; stroke-linecap: round; filter: drop-shadow(0 0 12px #a6f21c); }

        #f2-kicker { position: absolute; left: 70px; top: 190px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.16em; color: #a6f21c; opacity: 0; }
        #f2-power { position: absolute; left: 62px; top: 228px; font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 75%; font-size: 230px; line-height: 1; letter-spacing: -0.02em; opacity: 0; white-space: nowrap; }
        #f2-power small { font-size: 120px; color: #a6f21c; margin-left: 10px; }
        .f2-chip { position: absolute; left: 70px; display: inline-flex; align-items: center; gap: 18px; padding: 16px 30px; border: 3px solid rgba(166, 242, 28, 0.8); border-radius: 60px; background: rgba(8, 12, 9, 0.82);
          font-family: "Saira", sans-serif; font-style: italic; font-weight: 700; font-stretch: 85%; font-size: 52px; line-height: 1.1; opacity: 0; white-space: nowrap; }
        .f2-chip i { width: 18px; height: 18px; border-radius: 50%; background: #a6f21c; box-shadow: 0 0 14px #a6f21c; }
        #f2-chip-speed { top: 1390px; }
        #f2-chip-auto { top: 1500px; }
        #f2-note { position: absolute; left: 70px; right: 70px; bottom: 70px; font-family: "JetBrains Mono", monospace; font-size: 24px; line-height: 1.4; color: #aab4a4; opacity: 0; }

        /* phase B: riding through a Moroccan avenue at night */
        #f2-street { position: absolute; inset: 0; opacity: 0; }
        #f2-sky { background: radial-gradient(ellipse 120% 45% at 50% 66%, #3a2a3c 0%, #1b1d33 45%, #0a0f1d 100%); }
        #f2-far { position: absolute; left: 0; top: 500px; width: 3600px; height: 700px; opacity: 0.9; filter: blur(3px); }
        #f2-mid { position: absolute; left: 0; top: 340px; width: 4200px; height: 1100px; filter: blur(1.6px) brightness(0.82); }
        #f2-road { position: absolute; left: 0; right: 0; top: 1440px; bottom: 0;
          background:
            radial-gradient(ellipse 30% 16% at 20% 30%, rgba(255, 190, 110, 0.18), rgba(255, 190, 110, 0) 70%),
            radial-gradient(ellipse 30% 16% at 80% 34%, rgba(255, 190, 110, 0.14), rgba(255, 190, 110, 0) 70%),
            linear-gradient(180deg, #151820 0%, #0b0d12 100%); }
        #f2-lane { position: absolute; left: 0; right: 0; top: 1790px; height: 14px; background: repeating-linear-gradient(90deg, rgba(236, 232, 220, 0.75) 0 150px, rgba(0, 0, 0, 0) 150px 300px); }
        #f2-ride { position: absolute; left: 110px; top: 1093px; width: 860px; height: 660px; }
        #f2-ride > img { position: absolute; inset: 0; width: 100%; height: 100%; }
        .f2-wheel { position: absolute; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
        .f2-wheel img { width: 100%; height: 100%; display: block; }
        #f2-wheel-rear { left: 2.773%; top: 61.327%; width: 25.828%; height: 33.657%; -webkit-mask-image: url("../assets/m26/roue-rear-masque.png"); mask-image: url("../assets/m26/roue-rear-masque.png"); }
        #f2-wheel-front { left: 75.538%; top: 65.912%; width: 24.172%; height: 31.499%; -webkit-mask-image: url("../assets/m26/roue-front-masque.png"); mask-image: url("../assets/m26/roue-front-masque.png"); }
        #f2-shadow { position: absolute; left: 150px; top: 1690px; width: 800px; height: 70px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0) 70%); }
        .f2-trail { position: absolute; height: 12px; border-radius: 6px; background: linear-gradient(90deg, rgba(166, 242, 28, 0), rgba(184, 255, 58, 0.95)); filter: blur(2px); box-shadow: 0 0 22px rgba(166, 242, 28, 0.6); transform-origin: 100% 50%; }
        #f2-trail-a { left: -400px; width: 560px; top: 1570px; }
        #f2-trail-b { left: -300px; width: 470px; top: 1380px; height: 8px; }
        #f2-hud { position: absolute; left: 70px; right: 70px; top: 190px; opacity: 0; }
        #f2-hud-k { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.16em; color: #a6f21c; }
        #f2-hud-t { margin-top: 12px; font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 75%; font-size: 96px; line-height: 1; }
        #f2-hud-t b { color: #a6f21c; font-weight: 800; }
        #f2-throttle { position: absolute; right: 70px; top: 420px; width: 220px; height: 220px; opacity: 0; }
        #f2-throttle-arrow { transform-origin: 110px 110px; }
        #f2-throttle-l { position: absolute; right: 70px; top: 650px; width: 300px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 28px; letter-spacing: 0.08em; color: #dfe7d8; opacity: 0; }
        #f2-flash { background: #f4ffe6; opacity: 0; }
      </style>

      <div data-hf-id="hf-j790" id="f2-root" data-composition-id="f2-moteur" data-width="1080" data-height="1920" data-duration="6.5">
        <div data-hf-id="hf-nsoy" id="f2-wall" class="layer"></div>
        <div data-hf-id="hf-urt0" id="f2-glow-b"></div>
        <div data-hf-id="hf-bwlw" id="f2-glow-r"></div>

        <div data-hf-id="hf-g3z7" id="f2-zoom">
          <div data-hf-id="hf-de2p" id="f2-stage" data-layout-allow-overflow=""><img data-hf-id="hf-3wdn" src="../assets/m26/profil.webp" alt="M26 de profil, roue arrière à moteur intégré"></div>
          <div data-hf-id="hf-dpzf" id="f2-shade-top" class="layer"></div>
          <div data-hf-id="hf-gbol" id="f2-shade-bot" class="layer"></div>
          <svg data-hf-id="hf-k86b" id="f2-current" viewBox="0 0 1080 1920" aria-hidden="true">
            <path data-hf-id="hf-y1no" id="f2-current-path" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M1120,700 C980,700 860,760 760,840 C680,900 620,930 560,955" />
            <path data-hf-id="hf-2g7b" id="f2-current-flow" pathLength="1" stroke-dasharray="0.05 0.07" stroke-dashoffset="0" d="M1120,700 C980,700 860,760 760,840 C680,900 620,930 560,955" style="stroke: #f2ffd9; stroke-width: 6; opacity: 0" />
          </svg>
          <div data-hf-id="hf-973q" id="f2-xray">
            <div data-hf-id="hf-lnng" id="f2-xray-disc"></div>
            <svg data-hf-id="hf-tcv2" id="f2-motor" viewBox="-340 -340 680 680" aria-hidden="true">
              <g data-hf-id="hf-8u3x" id="f2-magnets" />
              <circle data-hf-id="hf-hzcg" r="208" fill="none" stroke="#3b4752" stroke-width="4" />
              <g data-hf-id="hf-rba6" id="f2-teeth" />
              <circle data-hf-id="hf-3t87" r="112" fill="#141a20" stroke="#56636e" stroke-width="5" />
              <circle data-hf-id="hf-cshv" r="112" fill="none" stroke="#a6f21c" stroke-width="3" stroke-dasharray="6 10" opacity="0.6" />
              <circle data-hf-id="hf-eymr" r="40" fill="#8c98a2" />
              <circle data-hf-id="hf-n3wr" r="16" fill="#2a3138" />
            </svg>
          </div>
          <div data-hf-id="hf-ilj4" id="f2-kicker">MOTEUR-ROUE · HUB ARRIÈRE</div>
          <div data-hf-id="hf-eti1" id="f2-power"><span data-hf-id="hf-u7dh" id="f2-power-n">0</span><small data-hf-id="hf-9w15">W</small></div>
          <div data-hf-id="hf-cnos" id="f2-chip-speed" class="f2-chip"><i data-hf-id="hf-wt6k"></i>≈ 50–70 km/h*</div>
          <div data-hf-id="hf-ltri" id="f2-chip-auto" class="f2-chip"><i data-hf-id="hf-zeb8"></i>Automatique · sans embrayage</div>
          <div data-hf-id="hf-dn6v" id="f2-note">*Vitesse maximale annoncée, variable selon la configuration et les conditions d'utilisation.</div>
        </div>

        <div data-hf-id="hf-r4wz" id="f2-street">
          <div data-hf-id="hf-rcp9" id="f2-sky" class="layer"></div>
          <img data-hf-id="hf-stx1" id="f2-far" data-layout-allow-overflow="" src="../assets/decor/ville-loin.svg" alt="">
          <img data-hf-id="hf-jypw" id="f2-mid" data-layout-allow-overflow="" src="../assets/decor/ville-rue.svg" alt="">
          <div data-hf-id="hf-rrjz" id="f2-road" data-layout-allow-overflow=""></div>
          <div data-hf-id="hf-uy1r" id="f2-lane" data-layout-allow-overflow=""></div>
          <div data-hf-id="hf-irue" id="f2-shadow"></div>
          <div data-hf-id="hf-4qu0" id="f2-ride">
            <div data-hf-id="hf-stiu" id="f2-trail-b" data-layout-allow-overflow="" class="f2-trail"></div>
            <div data-hf-id="hf-mnt1" id="f2-trail-a" data-layout-allow-overflow="" class="f2-trail"></div>

            <div data-hf-id="hf-omdp" id="f2-wheel-rear" class="f2-wheel"><img data-hf-id="hf-jar4" src="../assets/m26/roue-rear-flou.webp" alt=""></div>
            <div data-hf-id="hf-bhcc" id="f2-wheel-front" class="f2-wheel"><img data-hf-id="hf-ignh" src="../assets/m26/roue-front-flou.webp" alt=""></div>
          </div>
          <div data-hf-id="hf-konx" id="f2-hud">
            <div data-hf-id="hf-2b03" id="f2-hud-k">MOTEUR-ROUE · 2000 W</div>
            <div data-hf-id="hf-nd0g" id="f2-hud-t">Sans embrayage. <b data-hf-id="hf-ogsm">Vous tournez, il avance.</b></div>
          </div>
          <svg data-hf-id="hf-9z0x" id="f2-throttle" viewBox="0 0 220 220" aria-hidden="true">
            <circle data-hf-id="hf-xjxr" cx="110" cy="110" r="104" fill="rgba(8,12,9,0.8)" stroke="rgba(166,242,28,0.8)" stroke-width="4" />
            <rect data-hf-id="hf-jycy" x="52" y="92" width="116" height="36" rx="18" fill="#2b3138" stroke="#9aa6af" stroke-width="3" />
            <rect data-hf-id="hf-cwji" x="140" y="92" width="28" height="36" rx="10" fill="#d03a3a" />
            <g data-hf-id="hf-jpr8" id="f2-throttle-arrow">
              <path data-hf-id="hf-f7oa" d="M70,62 A58,58 0 0 1 160,70" fill="none" stroke="#a6f21c" stroke-width="9" stroke-linecap="round" />
              <path data-hf-id="hf-65nc" d="M160,70 l-26,-6 l14,22 z" fill="#a6f21c" />
            </g>
          </svg>
          <div data-hf-id="hf-39ou" id="f2-throttle-l">TOURNEZ · ROULEZ</div>
        </div>
        <div data-hf-id="hf-hjx8" id="f2-flash" class="layer"></div>
      </div>

      <script>
        (() => {
          // build the hub motor drawing (deterministic geometry)
          const NS = "http://www.w3.org/2000/svg";
          const teeth = document.getElementById("f2-teeth");
          for (let i = 0; i < 24; i++) {
            const g = document.createElementNS(NS, "g");
            g.setAttribute("transform", `rotate(${i * 15})`);
            const r = document.createElementNS(NS, "rect");
            r.setAttribute("x", "-13"); r.setAttribute("y", "-200"); r.setAttribute("width", "26"); r.setAttribute("height", "84"); r.setAttribute("rx", "7");
            r.setAttribute("class", "f2-tooth"); r.setAttribute("fill", "#b87533"); r.setAttribute("stroke", "#e0a15c"); r.setAttribute("stroke-width", "2");
            g.appendChild(r); teeth.appendChild(g);
          }
          const mags = document.getElementById("f2-magnets");
          for (let i = 0; i < 28; i++) {
            const a0 = (i * 360) / 28, a1 = a0 + 360 / 28 - 2;
            const p = (a, rad) => [rad * Math.cos((a * Math.PI) / 180), rad * Math.sin((a * Math.PI) / 180)];
            const [x0, y0] = p(a0, 222), [x1, y1] = p(a1, 222), [x2, y2] = p(a1, 254), [x3, y3] = p(a0, 254);
            const path = document.createElementNS(NS, "path");
            path.setAttribute("d", `M${x0},${y0} A222,222 0 0 1 ${x1},${y1} L${x2},${y2} A254,254 0 0 0 ${x3},${y3} Z`);
            path.setAttribute("fill", i % 2 ? "#253226" : "#8fc23d");
            path.setAttribute("opacity", i % 2 ? "1" : "0.85");
            mags.appendChild(path);
          }

          const tl = gsap.timeline({ paused: true });
          // blur-in on the whole side profile, then the camera dives to the rear wheel
          tl.fromTo("#f2-stage", { x: 0, y: 0, scale: 1, filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 0);
          tl.to("#f2-stage", { x: 92, y: -1360, scale: 2.6, duration: 1.25, ease: "power3.inOut" }, 0.15);
          tl.fromTo(["#f2-shade-top", "#f2-shade-bot"], { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.9);
          tl.fromTo("#f2-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.55);
          tl.fromTo("#f2-power", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.75);
          const pw = { v: 0 };
          tl.fromTo(pw, { v: 0 }, { v: 2000, duration: 0.75, ease: "power2.out", onUpdate: () => {
            document.getElementById("f2-power-n").textContent = Math.round(pw.v / 10) * 10;
          } }, 0.95);

          // X-ray: the rim turns translucent and reveals the hub motor
          tl.fromTo("#f2-xray", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, 1.3);
          tl.fromTo("#f2-current-path", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 1.55);
          tl.fromTo("#f2-current-flow", { opacity: 0, strokeDashoffset: 0 }, { opacity: 1, strokeDashoffset: -1.2, duration: 1.9, ease: "none" }, 1.9);
          tl.fromTo("#f2-root .f2-tooth", { fill: "#b87533" }, { fill: "#b8ff3a", duration: 0.12, stagger: 0.025, ease: "power1.out" }, 1.95);
          tl.fromTo("#f2-magnets", { rotation: 0, svgOrigin: "0 0" }, { rotation: 200, svgOrigin: "0 0", duration: 2.1, ease: "power2.in" }, 1.6);
          tl.fromTo("#f2-chip-speed", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.4);
          tl.fromTo("#f2-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.5);
          tl.fromTo("#f2-chip-auto", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.0);

          // cut on motion to the street: the M26 rides through the avenue
          tl.to("#f2-zoom", { opacity: 0, scale: 1.15, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 3.45);
          tl.fromTo("#f2-street", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.5);
          const RIDE = 3.0;
          tl.fromTo("#f2-far", { x: 0 }, { x: -380, duration: RIDE, ease: "none" }, 3.5);
          tl.fromTo("#f2-mid", { x: 0 }, { x: -1900, duration: RIDE, ease: "none" }, 3.5);
          tl.fromTo("#f2-lane", { backgroundPositionX: "0px" }, { backgroundPositionX: "-3600px", duration: RIDE, ease: "none" }, 3.5);
          tl.fromTo(["#f2-wheel-rear img", "#f2-wheel-front img"], { rotation: 0 }, { rotation: 1860, duration: RIDE, ease: "none" }, 3.5);
          tl.fromTo("#f2-ride", { y: 0 }, { y: -4, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 9 }, 3.5);
          tl.fromTo("#f2-root .f2-trail", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 3.6);
          tl.fromTo("#f2-hud", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.75);
          tl.fromTo(["#f2-throttle", "#f2-throttle-l"], { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 4.4);
          tl.fromTo("#f2-throttle-arrow", { rotation: -40 }, { rotation: 20, duration: 0.6, ease: "power2.inOut", yoyo: true, repeat: 1 }, 4.5);

          // exit: dive toward the battery panel
          tl.to("#f2-ride", { scale: 1.5, x: 40, y: -120, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 6.2);
          tl.fromTo("#f2-flash", { opacity: 0 }, { opacity: 0.25, duration: 0.25, ease: "power2.in" }, 6.25);

          window.__timelines["f2-moteur"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
