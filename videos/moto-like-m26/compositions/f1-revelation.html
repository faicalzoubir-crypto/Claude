      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);

          // neon tubes flicker on (deterministic keyframes)
          ["#f1-neon-b", "#f1-neon-r"].forEach((id, k) => {
            const o = k * 0.12;
            tl.fromTo(id, { opacity: 0 }, { opacity: 0.85, duration: 0.05 }, 0.12 + o)
              .to(id, { opacity: 0.1, duration: 0.05 }, 0.2 + o)
              .to(id, { opacity: 1, duration: 0.05 }, 0.3 + o)
              .to(id, { opacity: 0.35, duration: 0.04 }, 0.42 + o)
              .to(id, { opacity: 1, duration: 0.08 }, 0.5 + o);
          });
          tl.fromTo(["#f1-wash-b", "#f1-wash-r"], { opacity: 0 }, { opacity: 0.55, duration: 0.8, ease: "power2.out" }, 0.4);

          // the question and the rial coin
          tl.fromTo("#f1-coin-wrap", { opacity: 0, scale: 0.55, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.7)" }, 0.25);
          tl.fromTo("#f1-coin", { rotationY: 0 }, { rotationY: 1080, duration: 2.2, ease: "power3.out" }, 0.25);
          tl.fromTo("#f1-q1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.45);
          tl.fromTo("#f1-q2", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 1.75);
          tl.to(["#f1-coin-wrap", "#f1-question"], { opacity: 0, y: -60, duration: 0.35, ease: "power2.in" }, 2.65);

          // the green current draws the silhouette, then the real photo lights up inside it
          tl.fromTo("#f1-outline-path", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.95, ease: "power1.inOut" }, 1.0);
          tl.fromTo("#f1-flash", { opacity: 0 }, { opacity: 0.32, duration: 0.06 }, 2.95).to("#f1-flash", { opacity: 0, duration: 0.4, ease: "power2.out" }, 3.02);
          tl.fromTo("#f1-prof-photo", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power2.inOut" }, 2.95);
          tl.fromTo("#f1-sweep", { opacity: 1, x: 0 }, { opacity: 1, x: 1000, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 2.95).to("#f1-sweep", { opacity: 0, duration: 0.12 }, 3.5);
          tl.to("#f1-outline-path", { opacity: 0.25, duration: 0.5 }, 3.3);
          tl.fromTo("#f1-prof-refl", { opacity: 0 }, { opacity: 0.6, duration: 0.5 }, 3.1);
          tl.to(["#f1-wash-b", "#f1-wash-r"], { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.95);
          tl.fromTo("#f1-prof", { scale: 1 }, { scale: 1.05, duration: 1.25, ease: "none" }, 2.95);

          // whip pan to the 3/4 front view
          tl.to(["#f1-prof", "#f1-prof-refl"], { x: -1100, filter: "blur(18px)", duration: 0.22, ease: "power3.in" }, 4.12);
          tl.fromTo(["#f1-tq", "#f1-tq-refl"], { opacity: 1, x: 1100, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, 4.26);
          tl.set("#f1-tq-refl", { opacity: 0.55 }, 4.26);
          tl.fromTo("#f1-flare", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.25, duration: 0.25, ease: "power2.out" }, 4.5)
            .to("#f1-flare", { opacity: 0.75, scale: 1, duration: 0.6, ease: "power2.out" }, 4.75);
          tl.fromTo("#f1-flare-bar", { opacity: 0, scaleX: 0.2 }, { opacity: 0.9, scaleX: 1, duration: 0.3, ease: "power2.out" }, 4.5)
            .to("#f1-flare-bar", { opacity: 0.35, duration: 0.6 }, 4.8);
          tl.fromTo("#f1-tq", { scale: 1 }, { scale: 1.04, duration: 2.0, ease: "none", immediateRender: false }, 4.5);

          tl.fromTo("#f1-brand", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.42);
          gsap.utils.toArray("#f1-root .f1-spec").forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.28, ease: "expo.out" }, 4.66 + i * 0.3);
          });
          tl.fromTo("#f1-root .f1-div", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.out", stagger: 0.3 }, 4.8);

          // Arabic hook, written right to left
          tl.fromTo("#f1-ar", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power2.out" }, 5.4);
          tl.fromTo("#f1-ar-line", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 5.85);

          // exit: push into the next shot
          tl.to("#f1-cam", { scale: 1.12, filter: "blur(10px)", duration: 0.28, ease: "power2.in" }, 6.22);

          window.__timelines["f1-revelation"] = tl;
        })();
      </script>
