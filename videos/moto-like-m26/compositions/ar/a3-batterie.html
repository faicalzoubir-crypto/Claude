<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="a3-batterie-template">
      <style>
        @font-face { font-family: "Baloo Bhaijaan 2"; src: url("../../assets/fonts/BalooBhaijaan2.ttf") format("truetype"); font-weight: 400 800; }
        @font-face { font-family: "IBM Plex Sans Arabic"; src: url("../../assets/fonts/IBMPlexSansArabic-SemiBold.ttf") format("truetype"); font-weight: 600; }
        @font-face { font-family: "IBM Plex Sans Arabic"; src: url("../../assets/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype"); font-weight: 700; }
        @font-face { font-family: "Saira"; src: url("../../assets/fonts/Saira-Italic.ttf") format("truetype"); font-weight: 100 900; font-stretch: 50% 125%; font-style: italic; }
        @font-face { font-family: "JetBrains Mono"; src: url("../../assets/fonts/JetBrainsMono.ttf") format("truetype"); font-weight: 100 800; }

        #a3-root { position: absolute; inset: 0; overflow: hidden; background: #080b0f; color: #f2f5f0; }
        #a3-root .layer { position: absolute; inset: 0; }
        #a3-wall { background: radial-gradient(ellipse 80% 45% at 50% 28%, #16201a 0%, #0b100e 50%, #06080b 100%); }
        #a3-grid { opacity: 0.5; background-image: linear-gradient(rgba(166, 242, 28, 0.07) 2px, transparent 2px), linear-gradient(90deg, rgba(166, 242, 28, 0.07) 2px, transparent 2px); background-size: 90px 90px;
          -webkit-mask-image: radial-gradient(ellipse 70% 40% at 50% 30%, #000 0%, transparent 100%); mask-image: radial-gradient(ellipse 70% 40% at 50% 30%, #000 0%, transparent 100%); }
        #a3-floorglow { position: absolute; left: 90px; right: 90px; top: 1760px; height: 140px; border-radius: 50%; background: radial-gradient(ellipse, rgba(166, 242, 28, 0.16), rgba(166, 242, 28, 0) 70%); }

        #a3-stage { position: absolute; left: 230px; top: 1400px; width: 620px; height: 505px; transform-origin: 0 0; }
        #a3-stage > img { position: absolute; inset: 0; width: 100%; height: 100%; }
        #a3-scan { position: absolute; top: -20px; bottom: -20px; left: 0; width: 10px; background: #e9ffc4; box-shadow: 0 0 26px 10px #a6f21c; opacity: 0; }
        #a3-ghost { position: absolute; left: 60.5%; top: 55%; width: 13%; height: 14%; border: 4px solid #b8ff3a; border-radius: 10px; background: rgba(166, 242, 28, 0.22); box-shadow: 0 0 30px rgba(166, 242, 28, 0.8); opacity: 0; }
        #a3-lock { position: absolute; left: calc(67% - 90px); top: calc(62% - 90px); width: 180px; height: 180px; border-radius: 50%; border: 6px solid #b8ff3a; opacity: 0; }

        #a3-kicker { position: absolute; left: 0; right: 0; top: 110px; text-align: center; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 38px; color: #a6f21c; opacity: 0; }

        #a3-scene { position: absolute; left: 0; right: 0; top: 210px; height: 490px; perspective: 1700px; }
        #a3-fly { position: absolute; left: 280px; top: 95px; width: 520px; height: 300px; transform-style: preserve-3d; opacity: 0; }
        #a3-bat { position: absolute; inset: 0; transform-style: preserve-3d; }
        .a3-face { position: absolute; background: linear-gradient(160deg, #262d36 0%, #161b22 55%, #0e1217 100%); border: 3px solid rgba(166, 242, 28, 0.55); box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.55); }
        #a3-front { left: 0; top: 0; width: 520px; height: 300px; transform: translateZ(100px); }
        #a3-back { left: 0; top: 0; width: 520px; height: 300px; transform: rotateY(180deg) translateZ(100px); }
        #a3-right { left: 160px; top: 0; width: 200px; height: 300px; transform: rotateY(90deg) translateZ(260px); background: linear-gradient(160deg, #1d232b, #0c0f13); }
        #a3-left { left: 160px; top: 0; width: 200px; height: 300px; transform: rotateY(-90deg) translateZ(260px); }
        #a3-top { left: 0; top: 50px; width: 520px; height: 200px; transform: rotateX(90deg) translateZ(150px); background: linear-gradient(180deg, #343c47, #1d232b); }
        #a3-bottom { left: 0; top: 50px; width: 520px; height: 200px; transform: rotateX(-90deg) translateZ(150px); }
        #a3-handle { position: absolute; left: 170px; top: 70px; width: 180px; height: 56px; border-radius: 28px; background: #0b0e12; border: 3px solid rgba(166, 242, 28, 0.6); }
        #a3-label { position: absolute; left: 26px; top: 20px; right: 26px; display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: baseline; direction: ltr; }
        #a3-label span { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.12em; color: #a6f21c; }
        #a3-label b { font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 80%; font-size: 38px; color: #f2f5f0; }
        #a3-cells { position: absolute; left: 26px; right: 26px; top: 78px; bottom: 22px; border-radius: 10px; background: #07090c; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; padding: 12px; }
        .a3-cell { border-radius: 50%; background: #1f262e; border: 2px solid #39434d; }

        #a3-eq { position: absolute; left: 0; right: 0; top: 728px; text-align: center; direction: ltr; font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 75%; }
        #a3-eq1 { display: block; font-size: 104px; line-height: 1.05; opacity: 0; }
        #a3-eq2 { display: block; font-size: 64px; line-height: 1.1; color: #c9d2c2; opacity: 0; }
        #a3-eq3 { display: block; font-size: 156px; line-height: 1.02; color: #a6f21c; text-shadow: 0 0 40px rgba(166, 242, 28, 0.45); opacity: 0; }

        #a3-auto { position: absolute; left: 70px; right: 70px; top: 1100px; opacity: 0; }
        #a3-auto-head { display: flex; justify-content: space-between; align-items: baseline; }
        #a3-auto-head span { font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 34px; color: #c9d2c2; }
        #a3-auto-head b { font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 72px; line-height: 1.1; color: #f2f5f0; }
        #a3-bar { position: relative; margin-top: 6px; width: 940px; height: 30px; border-radius: 15px; background: #1a2026; overflow: hidden; }
        #a3-bar-solid { position: absolute; right: 0; top: 0; width: 783px; height: 30px; background: #a6f21c; transform-origin: 100% 50%; box-shadow: 0 0 20px rgba(166, 242, 28, 0.6); }
        #a3-bar-range { position: absolute; right: 783px; top: 0; width: 157px; height: 30px; transform-origin: 100% 50%;
          background: repeating-linear-gradient(45deg, rgba(166, 242, 28, 0.85) 0 10px, rgba(166, 242, 28, 0.25) 10px 20px); }
        #a3-ticks { position: relative; width: 940px; height: 38px; margin-top: 6px; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 600; font-size: 26px; color: #98a392; }
        #a3-ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
        #a3-charge { position: absolute; left: 70px; right: 70px; top: 1290px; display: flex; align-items: center; gap: 22px; font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 50px; opacity: 0; }
        #a3-charge svg { width: 64px; height: 64px; flex: none; }
        #a3-note { position: absolute; left: 70px; right: 70px; top: 1366px; text-align: right; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 600; font-size: 26px; line-height: 1.45; color: #98a392; opacity: 0; }
      </style>

      <div id="a3-root" dir="rtl" data-composition-id="a3-batterie" data-width="1080" data-height="1920" data-duration="7">
        <div id="a3-wall" class="layer"></div>
        <div id="a3-grid" class="layer"></div>
        <div id="a3-floorglow"></div>

        <div id="a3-stage" data-layout-allow-overflow>
          <img src="../../assets/m26-ar/profil-vert.webp" alt="M26 من الجانب، مكان البطارية تحت المقعد" />
          <div id="a3-ghost"></div>
          <div id="a3-lock"></div>
          <div id="a3-scan"></div>
        </div>

        <div id="a3-kicker">بطارية ليثيوم أيون · قابلة للنزع</div>
        <div id="a3-scene">
          <div id="a3-fly">
            <div id="a3-bat">
              <div id="a3-back" class="a3-face"></div>
              <div id="a3-bottom" class="a3-face"></div>
              <div id="a3-left" class="a3-face"></div>
              <div id="a3-right" class="a3-face"></div>
              <div id="a3-top" class="a3-face"><div id="a3-handle"></div></div>
              <div id="a3-front" class="a3-face">
                <div id="a3-label"><span>LITHIUM-ION</span><b>72V · 45Ah</b></div>
                <div id="a3-cells"></div>
              </div>
            </div>
          </div>
        </div>

        <div id="a3-eq"><span id="a3-eq1">72 V × 45 Ah</span><span id="a3-eq2">= 3 240 Wh</span><span id="a3-eq3">= <span id="a3-kwh">0,00</span> kWh</span></div>

        <div id="a3-auto">
          <div id="a3-auto-head"><span>الاستقلالية المعلنة*</span><b>من 100 إلى 120 كم</b></div>
          <div id="a3-bar"><div id="a3-bar-solid"></div><div id="a3-bar-range"></div></div>
          <div id="a3-ticks"><span style="left: 926px">0</span><span style="left: 548px">50 كم</span><span style="left: 157px">100</span><span style="left: 26px">120</span></div>
        </div>
        <div id="a3-charge">
          <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="18" y="6" width="6" height="16" rx="2" fill="#a6f21c" /><rect x="40" y="6" width="6" height="16" rx="2" fill="#a6f21c" /><path d="M12,22 h40 v10 a20,20 0 0 1 -40,0 z" fill="#a6f21c" /><rect x="28" y="50" width="8" height="12" rx="3" fill="#a6f21c" /></svg>
          <span>الشحن من 5 إلى 6 ساعات · مقبس منزلي</span>
        </div>
        <div id="a3-note">*قيم معلنة: تختلف حسب السرعة والحمولة والتضاريس والحرارة وحالة البطارية.</div>
      </div>

      <script>
        (() => {
          const cells = document.getElementById("a3-cells");
          for (let i = 0; i < 40; i++) {
            const c = document.createElement("div");
            c.className = "a3-cell a3-row" + (Math.floor(i / 10) + 1);
            cells.appendChild(c);
          }
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#a3-stage", { x: -270, y: -700, scale: 1.871, filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 0);
          tl.fromTo("#a3-scan", { opacity: 1, x: 610 }, { opacity: 1, x: 0, duration: 0.6, ease: "power1.inOut", immediateRender: false }, 0.1);
          tl.to("#a3-scan", { opacity: 0, duration: 0.1 }, 0.7);
          tl.fromTo("#a3-ghost", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.4);
          tl.to("#a3-stage", { x: 0, y: 0, scale: 1, duration: 0.65, ease: "power3.inOut" }, 0.75);
          tl.fromTo("#a3-kicker", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.45);

          tl.fromTo("#a3-fly", { x: 105, y: 1258, scale: 0.16, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.85, ease: "power3.inOut" }, 1.0);
          tl.fromTo("#a3-bat", { rotationY: 48, rotationX: -8 }, { rotationY: 24, rotationX: -18, duration: 1.4, ease: "power2.out" }, 1.0);
          tl.to("#a3-bat", { rotationY: 14, duration: 4.0, ease: "sine.inOut" }, 2.4);
          tl.to("#a3-ghost", { opacity: 0.35, duration: 0.4 }, 1.4);
          [1, 2, 3, 4].forEach((r, i) => {
            tl.fromTo(`#a3-root .a3-row${r}`, { backgroundColor: "#1f262e", borderColor: "#39434d" },
              { backgroundColor: "#b8ff3a", borderColor: "#e9ffc4", duration: 0.2, stagger: 0.02, ease: "power1.out" }, 2.2 + i * 0.28);
          });

          tl.fromTo("#a3-eq1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.2);
          tl.fromTo("#a3-eq2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.85);
          tl.fromTo("#a3-eq3", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 3.3);
          const kwh = { v: 0 };
          tl.fromTo(kwh, { v: 0 }, { v: 3.24, duration: 0.7, ease: "power2.out", onUpdate: () => {
            document.getElementById("a3-kwh").textContent = kwh.v.toFixed(2).replace(".", ",");
          } }, 3.3);

          tl.fromTo("#a3-auto", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.55);
          tl.fromTo("#a3-bar-solid", { scaleX: 0 }, { scaleX: 1, duration: 0.85, ease: "power2.inOut" }, 4.7);
          tl.fromTo("#a3-bar-range", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 5.55);
          tl.fromTo("#a3-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.0);
          tl.fromTo("#a3-charge", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 5.55);

          tl.to("#a3-fly", { x: 105, y: 1258, scale: 0.16, duration: 0.55, ease: "power3.in" }, 6.05);
          tl.to("#a3-fly", { opacity: 0, duration: 0.08 }, 6.55);
          tl.to("#a3-ghost", { opacity: 1, duration: 0.1 }, 6.55);
          tl.fromTo("#a3-lock", { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.45, ease: "power2.out", immediateRender: false }, 6.6);
          tl.to("#a3-ghost", { opacity: 0, duration: 0.3 }, 6.75);

          // exit: lateral whip toward the charging garage (right to left reading: content leaves to the right)
          tl.to("#a3-root .layer, #a3-stage, #a3-kicker, #a3-scene, #a3-eq, #a3-auto, #a3-charge, #a3-note", { x: 260, opacity: 0, duration: 0.22, ease: "power2.in" }, 6.78);

          window.__timelines["a3-batterie"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
