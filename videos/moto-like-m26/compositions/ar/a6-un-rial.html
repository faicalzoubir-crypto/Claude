<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="a6-un-rial-template">
      <style>
        @font-face { font-family: "Baloo Bhaijaan 2"; src: url("../../assets/fonts/BalooBhaijaan2.ttf") format("truetype"); font-weight: 400 800; }
        @font-face { font-family: "Saira"; src: url("../../assets/fonts/Saira-Italic.ttf") format("truetype"); font-weight: 100 900; font-stretch: 50% 125%; font-style: italic; }
        @font-face { font-family: "IBM Plex Sans Arabic"; src: url("../../assets/fonts/IBMPlexSansArabic-SemiBold.ttf") format("truetype"); font-weight: 600; }
        @font-face { font-family: "IBM Plex Sans Arabic"; src: url("../../assets/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype"); font-weight: 700; }

        #a6-root .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
        #a6-root { position: absolute; inset: 0; overflow: hidden; background: #080b0f; color: #f2f5f0; }
        #a6-root .layer { position: absolute; inset: 0; }

        /* ride */
        #a6-street { position: absolute; inset: 0; transform-origin: 50% 72%; }
        #a6-sky { background: radial-gradient(ellipse 120% 45% at 50% 66%, #3a2a3c 0%, #1b1d33 45%, #0a0f1d 100%); }
        #a6-far { position: absolute; left: 0; top: 500px; width: 3600px; height: 700px; opacity: 0.9; filter: blur(3px); }
        #a6-mid { position: absolute; left: 0; top: 340px; width: 4200px; height: 1100px; filter: blur(2px) brightness(0.8); }
        #a6-road { position: absolute; left: 0; right: 0; top: 1440px; bottom: 0; background: radial-gradient(ellipse 30% 16% at 20% 30%, rgba(255, 190, 110, 0.18), rgba(255, 190, 110, 0) 70%), linear-gradient(180deg, #151820 0%, #0b0d12 100%); }
        #a6-lane { position: absolute; left: 0; right: 0; top: 1790px; height: 14px; background: repeating-linear-gradient(90deg, rgba(236, 232, 220, 0.75) 0 150px, rgba(0, 0, 0, 0) 150px 300px); }
        #a6-shadow { position: absolute; left: 150px; top: 1690px; width: 800px; height: 70px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0) 70%); }
        #a6-ride { position: absolute; left: 110px; top: 1063px; width: 860px; height: 700px; }
        #a6-ride > img { position: absolute; inset: 0; width: 100%; height: 100%; }
        .a6-wheel { position: absolute; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
        .a6-wheel img { width: 100%; height: 100%; display: block; }
        #a6-wheel-rear { left: 71.727%; top: 63.428%; width: 25.612%; height: 31.449%; -webkit-mask-image: url("../../assets/m26-ar/roue-rear-masque.png"); mask-image: url("../../assets/m26-ar/roue-rear-masque.png"); }
        #a6-wheel-front { left: 0.647%; top: 60.954%; width: 26.763%; height: 32.862%; -webkit-mask-image: url("../../assets/m26-ar/roue-front-masque.png"); mask-image: url("../../assets/m26-ar/roue-front-masque.png"); }
        .a6-trail { position: absolute; height: 14px; border-radius: 7px; background: linear-gradient(90deg, rgba(184, 255, 58, 0.95), rgba(166, 242, 28, 0)); filter: blur(2px); box-shadow: 0 0 26px rgba(166, 242, 28, 0.7); transform-origin: 0% 50%; }
        #a6-trail-a { left: 720px; width: 1060px; top: 556px; }
        #a6-trail-b { left: 640px; width: 860px; top: 330px; height: 9px; }
        #a6-hud { position: absolute; left: 70px; right: 70px; top: 220px; text-align: center; }
        #a6-hud-big { font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 120px; line-height: 1.15; color: #a6f21c; text-shadow: 0 0 40px rgba(166, 242, 28, 0.5), 0 6px 30px rgba(0, 0, 0, 0.7); }
        #a6-hud-big .ltr { font-family: "Saira", sans-serif; font-style: italic; font-stretch: 75%; font-size: 150px; line-height: 1; }
        #a6-hud-row { margin-top: 20px; display: flex; justify-content: center; gap: 60px; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 38px; text-shadow: 0 3px 14px rgba(0, 0, 0, 0.8); }
        #a6-hud-row span b { color: #a6f21c; }

        /* the held line */
        #a6-clean { background: radial-gradient(ellipse 80% 50% at 50% 45%, #121a12 0%, #090c0a 60%, #050706 100%); opacity: 0; }
        #a6-splash-a { position: absolute; left: -60px; top: 620px; width: 1200px; height: 700px; opacity: 0; }
        #a6-splash-b { position: absolute; left: 160px; top: 190px; width: 760px; height: 444px; opacity: 0; }
        #a6-head { position: absolute; left: 30px; right: 30px; top: 560px; text-align: center; font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; line-height: 1.12; }
        #a6-head span { display: block; }
        #a6-h1, #a6-h3 { font-size: 156px; color: #f2f5f0; text-shadow: 0 0 2px #050706, 0 8px 0 #050706, 0 14px 40px rgba(0, 0, 0, 0.85); }
        #a6-h2 { font-size: 190px; color: #b8ff3a; text-shadow: 0 0 3px #050706, 0 10px 0 #050706, 0 0 60px rgba(166, 242, 28, 0.45); }
        #a6-coin { position: absolute; left: 430px; top: 300px; width: 220px; height: 220px; opacity: 0; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 30px rgba(232, 178, 60, 0.5)); }
        #a6-sub { position: absolute; left: 40px; right: 40px; top: 1340px; text-align: center; font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 100px; line-height: 1.2; opacity: 0; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.8); }
        #a6-sub-line { position: absolute; left: 320px; right: 320px; top: 1486px; height: 10px; border-radius: 5px; background: #a6f21c; box-shadow: 0 0 24px rgba(166, 242, 28, 0.7); transform-origin: 100% 50%; }
        #a6-note { position: absolute; left: 70px; right: 70px; top: 1770px; text-align: center; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 600; font-size: 26px; line-height: 1.45; color: #98a392; opacity: 0; }
        #a6-flash { background: #f4ffe6; opacity: 0; }
        #a6-warm { background: radial-gradient(ellipse 90% 60% at 60% 30%, #ffc46b 0%, #ff8a3d 55%, #a8475a 100%); opacity: 0; }
      </style>

      <div id="a6-root" dir="rtl" data-composition-id="a6-un-rial" data-width="1080" data-height="1920" data-duration="6.5">
        <div id="a6-street" data-layout-allow-overflow="">
          <div id="a6-sky" class="layer"></div>
          <img id="a6-far" data-layout-allow-overflow="" src="../../assets/decor/ville-loin.svg" alt="">
          <img id="a6-mid" data-layout-allow-overflow="" src="../../assets/decor/ville-rue.svg" alt="">
          <div id="a6-road" data-layout-allow-overflow=""></div>
          <div id="a6-lane" data-layout-allow-overflow=""></div>
          <div id="a6-shadow"></div>
          <div id="a6-ride">
            <div id="a6-trail-b" data-layout-allow-overflow="" class="a6-trail"></div>
            <div id="a6-trail-a" data-layout-allow-overflow="" class="a6-trail"></div>
            <img src="../../assets/m26-ar/profil-vert-roule.webp" alt="M26 يسير ليلاً مع أثره الأخضر" />
            <div id="a6-wheel-rear" class="a6-wheel"><img src="../../assets/m26-ar/roue-rear-flou.webp" alt=""></div>
            <div id="a6-wheel-front" class="a6-wheel"><img src="../../assets/m26-ar/roue-front-flou.webp" alt=""></div>
          </div>
          <div id="a6-hud" data-layout-allow-occlusion="">
            <div id="a6-hud-big"><span class="ltr">0,045</span> درهم/كم</div>
            <div id="a6-hud-row"><span>المسافة <b id="a6-km" class="ltr">0</b> كم</span><span>التكلفة <b id="a6-dh" class="ltr">0,00</b> درهم</span></div>
          </div>
        </div>

        <div id="a6-clean" class="layer"></div>
        <img id="a6-splash-a" data-layout-allow-overflow="" src="../../assets/decor/eclaboussure-a.svg" alt="">
        <img id="a6-splash-b" data-layout-allow-overflow="" src="../../assets/decor/eclaboussure-b.svg" alt="">
        <div id="a6-head" dir="rtl" lang="ar"><span id="a6-h1">بأقل من</span><span id="a6-h2">رِيَال واحد</span><span id="a6-h3">للكيلومتر</span></div>
        <img id="a6-coin" src="../../assets/decor/piece-5-centimes.svg" alt="قطعة 5 سنتيمات، أي ريال واحد">
        <div id="a6-sub" dir="rtl" lang="ar">تنقّل أكثر، وصرف أقل</div>
        <div id="a6-sub-line"></div>
        <div id="a6-note">*حسب الحساب: 3,8 kWh × 1,17 درهم ÷ 100 كم ≈ 0,045 درهم للكيلومتر، استقلالية معلنة.</div>
        <div id="a6-flash" class="layer"></div>
        <div id="a6-warm" class="layer"></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const RIDE = 2.0;
          // whip in, the M26 rides and the cost counter runs with it
          tl.fromTo("#a6-street", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 0);
          tl.fromTo("#a6-far", { x: -2420 }, { x: -2100, duration: RIDE, ease: "none" }, 0);
          tl.fromTo("#a6-mid", { x: -3000 }, { x: -1300, duration: RIDE, ease: "none" }, 0);
          tl.fromTo("#a6-lane", { backgroundPositionX: "0px" }, { backgroundPositionX: "3400px", duration: RIDE, ease: "none" }, 0);
          tl.fromTo(["#a6-wheel-rear img", "#a6-wheel-front img"], { rotation: 0 }, { rotation: -1700, duration: RIDE, ease: "none" }, 0);
          tl.fromTo("#a6-root .a6-trail", { scaleX: 0.3, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#a6-hud", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.2);
          const run = { km: 0 };
          tl.fromTo(run, { km: 0 }, { km: 100, duration: 1.7, ease: "power1.in", onUpdate: () => {
            document.getElementById("a6-km").textContent = Math.round(run.km);
            document.getElementById("a6-dh").textContent = (run.km * 0.0446).toFixed(2).replace(".", ",");
          } }, 0.25);
          tl.fromTo("#a6-street", { scale: 1 }, { scale: 1.22, duration: 0.75, ease: "power2.in", immediateRender: false }, 1.25);

          // freeze: the set falls away, the line lands
          tl.fromTo("#a6-flash", { opacity: 0 }, { opacity: 0.45, duration: 0.05 }, 2.0);
          tl.to("#a6-flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, 2.06);
          tl.fromTo("#a6-clean", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.02);
          tl.fromTo("#a6-splash-a", { opacity: 0, scale: 0.5 }, { opacity: 0.22, scale: 1, duration: 0.3, ease: "expo.out" }, 2.08);
          tl.fromTo("#a6-splash-b", { opacity: 0, scale: 0.4 }, { opacity: 0.55, scale: 0.85, duration: 0.3, ease: "expo.out" }, 2.62);
          tl.fromTo("#a6-h1", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out" }, 2.08);
          tl.fromTo("#a6-h2", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, 2.22);
          tl.fromTo("#a6-h3", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out" }, 2.38);
          tl.fromTo("#a6-coin", { y: -600, rotation: -40 }, { y: 0, rotation: 0, duration: 0.7, ease: "bounce.out" }, 2.1);
          tl.set("#a6-coin", { opacity: 1 }, 2.1);
          tl.fromTo("#a6-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.8);
          // held frame 2.8–4.4: nothing moves while the line lands in the voice-over
          tl.fromTo("#a6-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.42);
          tl.fromTo("#a6-sub-line", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 4.6);

          // exit: the green turns into the warm sunset of the last shot
          tl.fromTo("#a6-warm", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.in" }, 6.15);

          window.__timelines["a6-un-rial"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
