<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="a1-revelation-template">
      <style>
        @font-face { font-family: "Baloo Bhaijaan 2"; src: url("../../assets/fonts/BalooBhaijaan2.ttf") format("truetype"); font-weight: 400 800; }
        @font-face { font-family: "IBM Plex Sans Arabic"; src: url("../../assets/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype"); font-weight: 700; }
        @font-face { font-family: "Saira"; src: url("../../assets/fonts/Saira-Italic.ttf") format("truetype"); font-weight: 100 900; font-stretch: 50% 125%; font-style: italic; }

        #a1-root { position: absolute; inset: 0; overflow: hidden; background: #080b0f; color: #f2f5f0; }
        #a1-root .layer { position: absolute; inset: 0; }
        #a1-cam { position: absolute; inset: 0; transform-origin: 50% 55%; }
        #a1-wall { background: radial-gradient(ellipse 90% 60% at 50% 42%, #141a26 0%, #0b0f16 55%, #07090c 100%); }
        #a1-grain { opacity: 0.22; mix-blend-mode: overlay; }
        .a1-neon { position: absolute; top: 84px; width: 400px; height: 14px; border-radius: 7px; opacity: 0; }
        #a1-neon-b { left: 64px; background: #d7e4ff; box-shadow: 0 0 16px 5px #2f6bff, 0 0 90px 26px rgba(47, 107, 255, 0.55); }
        #a1-neon-r { right: 64px; background: #ffe0e0; box-shadow: 0 0 16px 5px #ff3a3a, 0 0 90px 26px rgba(255, 58, 58, 0.5); }
        .a1-wash { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(60px); opacity: 0; }
        #a1-wash-b { left: -330px; top: 640px; background: radial-gradient(circle, rgba(47, 107, 255, 0.55), rgba(47, 107, 255, 0) 70%); }
        #a1-wash-r { right: -330px; top: 640px; background: radial-gradient(circle, rgba(255, 58, 58, 0.5), rgba(255, 58, 58, 0) 70%); }
        #a1-floor { top: 1470px; height: 450px; background:
            radial-gradient(ellipse 45% 40% at 22% 10%, rgba(47, 107, 255, 0.28), rgba(47, 107, 255, 0) 70%),
            radial-gradient(ellipse 45% 40% at 78% 10%, rgba(255, 58, 58, 0.24), rgba(255, 58, 58, 0) 70%),
            #06080b; border-top: 2px solid rgba(166, 242, 28, 0.18); }

        #a1-coin-wrap { position: absolute; left: 400px; top: 330px; width: 280px; height: 280px; perspective: 900px; opacity: 0; }
        #a1-coin { display: block; width: 280px; height: 280px; filter: drop-shadow(0 0 40px rgba(232, 178, 60, 0.55)); }
        #a1-question { position: absolute; left: 50px; right: 50px; top: 630px; text-align: center; font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; line-height: 1.2; }
        #a1-q1 { display: block; font-size: 76px; opacity: 0; }
        #a1-q2 { display: block; font-size: 124px; color: #a6f21c; opacity: 0; }

        /* side profile (faces left) + its light-line outline; three colourways stacked in the same box */
        #a1-prof { position: absolute; left: 40px; top: 690px; width: 1000px; height: 814px; }
        #a1-prof img { position: absolute; left: 0; bottom: 0; width: 100%; height: auto; }
        #a1-prof svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        #a1-vert { clip-path: inset(0 0 0 100%); }
        #a1-blanc, #a1-noir, #a1-vert2 { clip-path: inset(0 0 0 100%); }
        #a1-outline path { fill: none; stroke: #b8ff3a; stroke-width: 7; stroke-linejoin: round; filter: drop-shadow(0 0 10px #a6f21c) drop-shadow(0 0 26px rgba(166, 242, 28, 0.7)); }
        .a1-sweep { position: absolute; top: -40px; bottom: -40px; width: 16px; left: 0; background: #e9ffc4; box-shadow: 0 0 30px 12px #a6f21c; opacity: 0; }
        #a1-headlight { position: absolute; left: calc(23.74% - 120px); top: calc(28.8% - 120px); width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(210, 235, 255, 0.5) 20%, rgba(140, 190, 255, 0) 62%); mix-blend-mode: screen; opacity: 0; }
        #a1-beam { position: absolute; left: calc(23.74% - 340px); top: calc(28.8% - 4px); width: 680px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(160, 200, 255, 0), rgba(220, 238, 255, 0.85), rgba(160, 200, 255, 0)); mix-blend-mode: screen; opacity: 0; }
        #a1-refl { position: absolute; left: 40px; top: 1460px; width: 1000px; height: 814px; opacity: 0;
          -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0) 40%); mask-image: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0) 40%); }
        #a1-refl img { width: 100%; height: auto; transform: scaleY(-1); filter: blur(3px); }

        #a1-brand { position: absolute; left: 0; right: 0; top: 470px; text-align: center; direction: ltr; font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 80%; font-size: 58px; letter-spacing: 0.02em; opacity: 0; }
        #a1-brand b { color: #a6f21c; font-weight: 800; }
        #a1-colors { position: absolute; left: 290px; right: 290px; top: 560px; height: 92px; display: flex; align-items: center; justify-content: center; gap: 22px; border: 3px solid rgba(166, 242, 28, 0.75); border-radius: 46px; background: rgba(8, 12, 9, 0.8); opacity: 0; }
        #a1-colors b { font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 50px; line-height: 1; }
        .a1-dot { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.8); }
        #a1-dot-blanc { background: linear-gradient(135deg, #f4f4f2 50%, #2a4fe0 50%); }
        #a1-dot-vert { background: linear-gradient(135deg, #9a9d9c 50%, #7fe12b 50%); }
        #a1-dot-noir { background: linear-gradient(135deg, #1a1c1e 50%, #b59a4e 50%); }

        #a1-specs { position: absolute; left: 60px; right: 60px; top: 1640px; display: flex; justify-content: space-between; align-items: flex-start; }
        .a1-spec { width: 300px; text-align: center; opacity: 0; }
        .a1-spec .v { display: block; direction: ltr; font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 75%; font-size: 128px; line-height: 1; color: #a6f21c; text-shadow: 0 0 34px rgba(166, 242, 28, 0.45); }
        .a1-spec .l { display: block; margin-top: 8px; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 34px; color: #c9d2c2; }
        .a1-div { width: 3px; height: 150px; margin-top: 10px; background: rgba(166, 242, 28, 0.35); transform-origin: 50% 0; }

        #a1-ar { position: absolute; left: 24px; right: 24px; top: 168px; text-align: center; white-space: nowrap; font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 92px; line-height: 1.25; clip-path: inset(0 0 0 100%); text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6); }
        #a1-ar-line { position: absolute; left: 300px; right: 300px; top: 318px; height: 8px; border-radius: 4px; background: #a6f21c; box-shadow: 0 0 22px rgba(166, 242, 28, 0.7); transform-origin: 100% 50%; }
        #a1-flash { background: #f4ffe6; opacity: 0; }
      </style>

      <div id="a1-root" dir="rtl" data-composition-id="a1-revelation" data-width="1080" data-height="1920" data-duration="6.5">
        <div id="a1-cam">
          <div id="a1-wall" class="layer"></div>
          <svg id="a1-grain" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920" aria-hidden="true">
            <filter id="a1-noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" /><feColorMatrix type="saturate" values="0" /></filter>
            <rect width="1080" height="1920" filter="url(#a1-noise)" />
          </svg>
          <div id="a1-wash-b" class="a1-wash" data-layout-allow-overflow></div>
          <div id="a1-wash-r" class="a1-wash" data-layout-allow-overflow></div>
          <div id="a1-neon-b" class="a1-neon"></div>
          <div id="a1-neon-r" class="a1-neon"></div>
          <div id="a1-floor" class="layer"></div>

          <div id="a1-coin-wrap"><img id="a1-coin" src="../../assets/decor/piece-5-centimes.svg" alt="" /></div>
          <div id="a1-question"><span id="a1-q1">ماذا لو كلّفك الكيلومتر</span><span id="a1-q2">أقل من ريال؟</span></div>

          <div id="a1-refl" data-layout-allow-overflow><img src="../../assets/m26-ar/profil-vert.webp" alt="" /></div>
          <div id="a1-prof">
            <img id="a1-vert" src="../../assets/m26-ar/profil-vert.webp" alt="دراجة M26 الكهربائية من موطو لايك، اللون الرمادي والأخضر" />
            <img id="a1-blanc" src="../../assets/m26-ar/profil-blanc.webp" alt="M26 باللون الأبيض والأزرق" />
            <img id="a1-noir" src="../../assets/m26-ar/profil-noir.webp" alt="M26 باللون الأسود والذهبي" />
            <img id="a1-vert2" src="../../assets/m26-ar/profil-vert.webp" alt="" />
            <svg id="a1-outline" viewBox="0 0 1390 1132" preserveAspectRatio="none" aria-hidden="true">
              <path id="a1-outline-path" data-outline="profil-ar" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M965,1122 L947,1108 L898,1104 L881,1098 L854,1084 L848,1086 L846,1098 L843,1102 L827,1102 L823,1100 L818,1094 L818,1078 L842,1053 L860,999 L860,981 L858,973 L853,970 L848,978 L826,1029 L824,1043 L819,1046 L808,1044 L802,1039 L800,1034 L800,1017 L820,1003 L840,951 L833,948 L769,948 L761,944 L739,940 L736,938 L738,936 L747,936 L752,932 L754,924 L750,920 L640,922 L575,928 L485,930 L467,928 L444,920 L415,904 L394,884 L380,866 L380,902 L374,932 L360,969 L340,997 L317,1018 L290,1036 L260,1050 L230,1058 L214,1060 L181,1060 L165,1058 L124,1044 L96,1030 L75,1014 L50,989 L34,966 L20,937 L12,912 L10,875 L12,853 L20,820 L34,793 L48,774 L75,748 L110,725 L97,726 L81,730 L76,730 L76,728 L119,698 L143,686 L176,676 L202,670 L265,672 L270,662 L270,645 L274,632 L288,628 L298,619 L294,607 L284,598 L271,592 L250,590 L240,581 L232,570 L230,549 L246,511 L308,405 L308,326 L314,288 L318,284 L327,282 L345,284 L352,290 L358,321 L358,349 L366,356 L376,358 L413,354 L410,335 L410,316 L412,303 L418,298 L418,293 L416,290 L416,269 L407,266 L404,261 L408,251 L400,228 L400,211 L404,206 L413,204 L445,222 L448,220 L452,209 L455,206 L465,206 L484,214 L482,193 L485,188 L492,186 L501,192 L506,186 L516,186 L520,183 L534,143 L536,131 L546,116 L554,94 L552,79 L556,63 L574,33 L593,12 L606,12 L610,17 L608,39 L586,119 L594,132 L596,141 L594,176 L588,193 L581,204 L573,206 L549,202 L542,208 L536,221 L542,250 L560,264 L554,282 L544,293 L544,299 L554,313 L554,322 L546,328 L538,328 L526,318 L512,314 L499,314 L494,320 L488,342 L482,346 L473,344 L470,347 L472,352 L485,356 L496,369 L500,374 L500,388 L496,402 L476,414 L478,426 L462,466 L460,489 L464,492 L476,494 L482,499 L482,508 L476,523 L484,535 L488,547 L494,554 L507,552 L510,540 L518,534 L526,541 L532,553 L532,559 L535,562 L574,578 L609,584 L639,586 L690,576 L705,576 L715,584 L731,590 L736,564 L762,523 L787,498 L811,490 L830,488 L916,500 L95             </svg>
            <div id="a1-sweep" class="a1-sweep"></div>
            <div id="a1-sweep2" class="a1-sweep"></div>
            <div id="a1-beam"></div>
            <div id="a1-headlight"></div>
          </div>

          <div id="a1-brand">M26 <b>·</b> MOTO LIKE</div>
          <div id="a1-colors"><b>3 ألوان</b><i id="a1-dot-blanc" class="a1-dot"></i><i id="a1-dot-noir" class="a1-dot"></i><i id="a1-dot-vert" class="a1-dot"></i></div>
          <div id="a1-specs">
            <div class="a1-spec"><span class="v">72V</span><span class="l">الجهد</span></div>
            <div class="a1-div"></div>
            <div class="a1-spec"><span class="v">45Ah</span><span class="l">السعة</span></div>
            <div class="a1-div"></div>
            <div class="a1-spec"><span class="v">2000W</span><span class="l">القوة</span></div>
          </div>
          <div id="a1-ar" lang="ar">التنقل الذكي يبدأ من هنا</div>
          <div id="a1-ar-line"></div>
        </div>
        <div id="a1-flash" class="layer"></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });

          // neon tubes flicker on (deterministic keyframes)
          ["#a1-neon-r", "#a1-neon-b"].forEach((id, k) => {
            const o = k * 0.12;
            tl.fromTo(id, { opacity: 0 }, { opacity: 0.85, duration: 0.05 }, 0.12 + o)
              .to(id, { opacity: 0.1, duration: 0.05 }, 0.2 + o)
              .to(id, { opacity: 1, duration: 0.05 }, 0.3 + o)
              .to(id, { opacity: 0.35, duration: 0.04 }, 0.42 + o)
              .to(id, { opacity: 1, duration: 0.08 }, 0.5 + o);
          });
          tl.fromTo(["#a1-wash-b", "#a1-wash-r"], { opacity: 0 }, { opacity: 0.55, duration: 0.8, ease: "power2.out" }, 0.4);

          // the question and the rial coin
          tl.fromTo("#a1-coin-wrap", { opacity: 0, scale: 0.55, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.7)" }, 0.25);
          tl.fromTo("#a1-coin", { rotationY: 0 }, { rotationY: -1080, duration: 2.2, ease: "power3.out" }, 0.25);
          tl.fromTo("#a1-q1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.45);
          tl.fromTo("#a1-q2", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 1.6);
          tl.to(["#a1-coin-wrap", "#a1-question"], { opacity: 0, y: -60, duration: 0.35, ease: "power2.in" }, 2.65);

          // the green current draws the silhouette, then the scooter lights up inside it, right to left
          tl.fromTo("#a1-outline-path", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.95, ease: "power1.inOut" }, 1.0);
          tl.fromTo("#a1-flash", { opacity: 0 }, { opacity: 0.32, duration: 0.06 }, 2.95).to("#a1-flash", { opacity: 0, duration: 0.4, ease: "power2.out" }, 3.02);
          const wipe = (img, sweep, t, d = 0.55) => {
            tl.fromTo(img, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: d, ease: "power2.inOut" }, t);
            tl.fromTo(sweep, { opacity: 1, x: 1000 }, { opacity: 1, x: 0, duration: d, ease: "power2.inOut", immediateRender: false }, t);
            tl.to(sweep, { opacity: 0, duration: 0.1 }, t + d);
          };
          wipe("#a1-vert", "#a1-sweep", 2.95);
          tl.to("#a1-outline-path", { opacity: 0.25, duration: 0.5 }, 3.3);
          tl.fromTo("#a1-refl", { opacity: 0 }, { opacity: 0.6, duration: 0.5 }, 3.1);
          tl.to(["#a1-wash-b", "#a1-wash-r"], { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.95);
          tl.fromTo("#a1-prof", { scale: 1 }, { scale: 1.04, duration: 3.2, ease: "none" }, 2.95);

          // three colourways on the same silhouette: white/blue, black/gold, back to grey/green
          tl.to("#a1-refl", { opacity: 0, duration: 0.2 }, 4.0);
          tl.fromTo("#a1-colors", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, 4.05);
          wipe("#a1-blanc", "#a1-sweep2", 4.12, 0.3);
          wipe("#a1-noir", "#a1-sweep", 4.62, 0.3);
          wipe("#a1-vert2", "#a1-sweep2", 5.12, 0.3);
          [["#a1-dot-blanc", 4.12], ["#a1-dot-noir", 4.62], ["#a1-dot-vert", 5.12]].forEach(([d, t]) => {
            tl.fromTo(d, { scale: 1 }, { scale: 1.45, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, t);
          });
          tl.to("#a1-refl", { opacity: 0.6, duration: 0.3 }, 5.45);
          tl.fromTo("#a1-headlight", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.2, duration: 0.25, ease: "power2.out" }, 5.45);
          tl.to("#a1-headlight", { opacity: 0.8, scale: 1, duration: 0.5 }, 5.7);
          tl.fromTo("#a1-beam", { opacity: 0, scaleX: 0.2 }, { opacity: 0.85, scaleX: 1, duration: 0.3, ease: "power2.out" }, 5.45);

          tl.fromTo("#a1-brand", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.6);
          gsap.utils.toArray("#a1-root .a1-spec").forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.28, ease: "expo.out" }, 4.66 + i * 0.3);
          });
          tl.fromTo("#a1-root .a1-div", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.out", stagger: 0.3 }, 4.8);

          // Arabic hook, written right to left
          tl.fromTo("#a1-ar", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power2.out" }, 5.4);
          tl.fromTo("#a1-ar-line", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 5.85);

          // exit: push into the next shot
          tl.to("#a1-cam", { scale: 1.12, filter: "blur(10px)", duration: 0.28, ease: "power2.in" }, 6.22);

          window.__timelines["a1-revelation"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
