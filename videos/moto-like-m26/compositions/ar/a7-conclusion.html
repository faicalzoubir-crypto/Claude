<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="a7-conclusion-template">
      <style>
        @font-face { font-family: "Baloo Bhaijaan 2"; src: url("../../assets/fonts/BalooBhaijaan2.ttf") format("truetype"); font-weight: 400 800; }
        @font-face { font-family: "IBM Plex Sans Arabic"; src: url("../../assets/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype"); font-weight: 700; }
        @font-face { font-family: "Saira"; src: url("../../assets/fonts/Saira-Italic.ttf") format("truetype"); font-weight: 100 900; font-stretch: 50% 125%; font-style: italic; }
        @font-face { font-family: "JetBrains Mono"; src: url("../../assets/fonts/JetBrainsMono.ttf") format("truetype"); font-weight: 100 800; }

        #a7-root { position: absolute; inset: 0; overflow: hidden; background: #1a100d; color: #fff8ef; }
        #a7-root .layer { position: absolute; inset: 0; }
        #a7-sky { background: linear-gradient(180deg, #24183a 0%, #5b2f55 16%, #b34f55 26%, #ef7a45 33%, #ffb15e 40%, #3a2418 70%, #120c0a 100%); }
        #a7-grain { opacity: 0.18; mix-blend-mode: overlay; }
        #a7-sun { position: absolute; left: 20px; top: 300px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 236, 170, 0.95) 0%, rgba(255, 196, 107, 0.55) 22%, rgba(255, 138, 61, 0) 70%); }
        #a7-shop { position: absolute; left: 0; top: 560px; width: 1080px; height: 810px;
          -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%); }
        #a7-shop img { width: 100%; height: 100%; display: block; }
        #a7-shop-warm { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 170, 105, 0.6), rgba(214, 110, 90, 0.55)); mix-blend-mode: multiply; }
        #a7-shop-dim { position: absolute; inset: 0; background: rgba(28, 14, 18, 0.32); }
        #a7-backglow { position: absolute; left: 90px; top: 820px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 170, 90, 0.42), rgba(255, 138, 61, 0) 65%); }
        #a7-shadow { position: absolute; left: 60px; top: 1615px; width: 960px; height: 110px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0) 70%); }
        .a7-bike { position: absolute; }
        .a7-bike img { width: 100%; height: 100%; display: block; }
        #a7-blanc { left: 610px; top: 880px; width: 425px; height: 760px; }
        #a7-noir { left: 45px; top: 880px; width: 425px; height: 760px; }
        #a7-vert { left: 288px; top: 790px; width: 504px; height: 900px; }
        .a7-halo { position: absolute; left: calc(50% - 130px); top: calc(23% - 130px); width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(215, 236, 255, 0.5) 20%, rgba(170, 210, 255, 0) 64%); mix-blend-mode: screen; opacity: 0; }

        #a7-ar { position: absolute; left: 20px; right: 20px; top: 118px; text-align: center; white-space: nowrap; font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 94px; line-height: 1.25; clip-path: inset(0 0 0 100%); text-shadow: 0 6px 30px rgba(20, 8, 20, 0.7); }
        #a7-ar-line { position: absolute; left: 330px; right: 330px; top: 268px; height: 8px; border-radius: 4px; background: #a6f21c; box-shadow: 0 0 22px rgba(166, 242, 28, 0.6); transform-origin: 100% 50%; }
        #a7-specs { position: absolute; left: 0; right: 0; top: 318px; text-align: center; opacity: 0; }
        #a7-specs b { display: block; direction: ltr; font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 75%; font-size: 92px; line-height: 1; letter-spacing: 0.01em; text-shadow: 0 6px 26px rgba(20, 8, 20, 0.6); }
        #a7-specs b i { color: #a6f21c; font-style: italic; }
        #a7-specs span { display: block; margin-top: 10px; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 36px; color: #ffe7cf; text-shadow: 0 3px 14px rgba(20, 8, 20, 0.8); }
        #a7-colors { position: absolute; left: 330px; right: 330px; top: 490px; height: 70px; display: flex; align-items: center; justify-content: center; gap: 16px; border-radius: 35px; background: rgba(20, 10, 12, 0.55); border: 2px solid rgba(255, 231, 207, 0.5); opacity: 0; }
        #a7-colors b { font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 40px; line-height: 1; }
        .a7-dot { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.8); }

        #a7-lock { position: absolute; left: 0; right: 0; top: 1660px; bottom: 0; background: linear-gradient(180deg, rgba(14, 9, 8, 0) 0%, rgba(14, 9, 8, 0.88) 30%, rgba(10, 7, 6, 0.96) 100%); }
        #a7-logo { position: absolute; right: 56px; top: 1700px; width: 186px; height: 192px; filter: drop-shadow(0 0 18px rgba(166, 242, 28, 0.45)); opacity: 0; }
        #a7-brand { position: absolute; right: 280px; top: 1712px; direction: ltr; font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 78%; font-size: 64px; line-height: 1; opacity: 0; white-space: nowrap; }
        #a7-brand b { color: #a6f21c; font-weight: 800; }
        #a7-tel { position: absolute; right: 282px; top: 1792px; direction: ltr; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 34px; letter-spacing: 0.02em; opacity: 0; white-space: nowrap; }
        #a7-ig { position: absolute; right: 282px; top: 1842px; direction: ltr; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; color: #a6f21c; opacity: 0; white-space: nowrap; }
        #a7-warm { background: radial-gradient(ellipse 90% 60% at 40% 30%, #ffc46b 0%, #ff8a3d 55%, #a8475a 100%); }
      </style>

      <div id="a7-root" dir="rtl" data-composition-id="a7-conclusion" data-width="1080" data-height="1920" data-duration="6">
        <div id="a7-sky" class="layer"></div>
        <div id="a7-sun"></div>
        <div id="a7-shop" data-layout-allow-overflow>
          <img src="../../assets/m26/magasin.webp" alt="واجهة محل موطو لايك للدراجات الكهربائية" />
          <div id="a7-shop-warm"></div>
          <div id="a7-shop-dim"></div>
        </div>
        <svg id="a7-grain" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920" aria-hidden="true">
          <filter id="a7-noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" /><feColorMatrix type="saturate" values="0" /></filter>
          <rect width="1080" height="1920" filter="url(#a7-noise)" />
        </svg>
        <div id="a7-backglow"></div>
        <div id="a7-shadow"></div>
        <div id="a7-blanc" class="a7-bike"><img src="../../assets/m26-ar/face-blanc.webp" alt="M26 أبيض وأزرق" /><div class="a7-halo"></div></div>
        <div id="a7-noir" class="a7-bike"><img src="../../assets/m26-ar/face-noir.webp" alt="M26 أسود وذهبي" /><div class="a7-halo"></div></div>
        <div id="a7-vert" class="a7-bike"><img src="../../assets/m26-ar/face-vert.webp" alt="M26 رمادي وأخضر أمام محل موطو لايك عند الغروب" /><div class="a7-halo"></div></div>

        <div id="a7-ar" lang="ar">الاقتصاد الذكي يبدأ من هنا</div>
        <div id="a7-ar-line"></div>
        <div id="a7-specs"><b>2000W <i>|</i> 72V <i>|</i> 45Ah</b><span>الاستقلالية المعلنة: من 100 إلى 120 كم</span></div>
        <div id="a7-colors"><b>بثلاثة ألوان</b><i class="a7-dot" style="background: linear-gradient(135deg, #f4f4f2 50%, #2a4fe0 50%)"></i><i class="a7-dot" style="background: linear-gradient(135deg, #9a9d9c 50%, #7fe12b 50%)"></i><i class="a7-dot" style="background: linear-gradient(135deg, #1a1c1e 50%, #b59a4e 50%)"></i></div>

        <div id="a7-lock"></div>
        <img id="a7-logo" src="../../assets/m26/logo.webp" alt="شعار موطو لايك" />
        <div id="a7-brand">M26 <b>·</b> MOTO LIKE</div>
        <div id="a7-tel">0522 500 300 · 0710 302 302</div>
        <div id="a7-ig">@motolike.ma</div>
        <div id="a7-warm" class="layer"></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#a7-warm", { opacity: 1 }, { opacity: 0, duration: 0.55, ease: "power2.out" }, 0);
          tl.fromTo("#a7-shop", { scale: 1.08 }, { scale: 1, duration: 4.2, ease: "power1.out" }, 0);
          tl.fromTo("#a7-sun", { y: 30, opacity: 0.6 }, { y: 0, opacity: 1, duration: 4.2, ease: "power1.out" }, 0);
          // the three colourways roll into line, hero in front, then their LED halos come on
          tl.fromTo("#a7-vert", { y: 120, scale: 0.9, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 1.0, ease: "power3.out" }, 0.15);
          tl.fromTo("#a7-blanc", { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 0.35);
          tl.fromTo("#a7-noir", { x: -160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 0.45);
          tl.fromTo("#a7-shadow", { scaleX: 0.6, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 1.0, ease: "power3.out" }, 0.2);
          tl.fromTo("#a7-root .a7-halo", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.2, duration: 0.25, ease: "power2.out", stagger: 0.12 }, 1.3);
          tl.to("#a7-root .a7-halo", { opacity: 0.85, scale: 1, duration: 0.5, ease: "power2.out" }, 1.75);

          tl.fromTo("#a7-logo", { opacity: 0, scale: 0.6, rotation: 20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.7)" }, 0.5);
          tl.fromTo("#a7-brand", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.65);
          tl.fromTo("#a7-specs", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.5);
          tl.fromTo("#a7-colors", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 1.9);
          tl.fromTo("#a7-ar", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power2.out" }, 2.55);
          tl.fromTo("#a7-ar-line", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 3.0);
          tl.fromTo("#a7-tel", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.35);
          tl.fromTo("#a7-ig", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.5);
          // 4.2–6.0: held end frame

          window.__timelines["a7-conclusion"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
