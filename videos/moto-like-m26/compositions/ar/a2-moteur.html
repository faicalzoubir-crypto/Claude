<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="a2-moteur-template">
      <style>
        @font-face { font-family: "Baloo Bhaijaan 2"; src: url("../../assets/fonts/BalooBhaijaan2.ttf") format("truetype"); font-weight: 400 800; }
        @font-face { font-family: "IBM Plex Sans Arabic"; src: url("../../assets/fonts/IBMPlexSansArabic-SemiBold.ttf") format("truetype"); font-weight: 600; }
        @font-face { font-family: "IBM Plex Sans Arabic"; src: url("../../assets/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype"); font-weight: 700; }
        @font-face { font-family: "Saira"; src: url("../../assets/fonts/Saira-Italic.ttf") format("truetype"); font-weight: 100 900; font-stretch: 50% 125%; font-style: italic; }

        #a2-root { position: absolute; inset: 0; overflow: hidden; background: #080b0f; color: #f2f5f0; }
        #a2-root .layer { position: absolute; inset: 0; }
        #a2-root .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
        #a2-wall { background: radial-gradient(ellipse 90% 60% at 50% 45%, #131925 0%, #0a0e15 55%, #06080b 100%); }
        #a2-glow-b { position: absolute; left: -300px; top: 700px; width: 900px; height: 900px; border-radius: 50%; filter: blur(70px); background: radial-gradient(circle, rgba(47, 107, 255, 0.4), rgba(47, 107, 255, 0) 70%); }
        #a2-glow-r { position: absolute; right: -300px; top: 700px; width: 900px; height: 900px; border-radius: 50%; filter: blur(70px); background: radial-gradient(circle, rgba(255, 58, 58, 0.35), rgba(255, 58, 58, 0) 70%); }

        /* phase A: zoom into the rear wheel (on the right, the scooter faces left) */
        #a2-zoom { position: absolute; inset: 0; }
        #a2-stage { position: absolute; left: 40px; top: 740px; width: 1000px; height: 814px; transform-origin: 0 0; }
        #a2-stage img { width: 100%; height: 100%; display: block; }
        #a2-shade-top { background: linear-gradient(180deg, rgba(6, 8, 11, 0.94) 0%, rgba(6, 8, 11, 0.75) 26%, rgba(6, 8, 11, 0) 40%); opacity: 0; }
        #a2-shade-bot { background: linear-gradient(0deg, rgba(6, 8, 11, 0.95) 0%, rgba(6, 8, 11, 0.7) 22%, rgba(6, 8, 11, 0) 36%); opacity: 0; }
        #a2-xray { position: absolute; left: 230px; top: 650px; width: 620px; height: 620px; opacity: 0; }
        #a2-xray-disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(4, 10, 7, 0.9) 0%, rgba(4, 10, 7, 0.86) 62%, rgba(4, 10, 7, 0.55) 80%, rgba(4, 10, 7, 0) 100%);
          box-shadow: inset 0 0 0 4px rgba(166, 242, 28, 0.85), 0 0 60px rgba(166, 242, 28, 0.35); }
        #a2-motor { position: absolute; inset: 0; width: 100%; height: 100%; }
        #a2-current { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: visible; }
        #a2-current path { fill: none; stroke: #b8ff3a; stroke-width: 10; stroke-linecap: round; filter: drop-shadow(0 0 12px #a6f21c); }

        #a2-kicker { position: absolute; left: 70px; right: 70px; top: 176px; text-align: right; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 38px; color: #a6f21c; opacity: 0; }
        #a2-power { position: absolute; left: 70px; right: 62px; top: 228px; text-align: right; white-space: nowrap; opacity: 0; }
        #a2-power .ltr { font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 75%; font-size: 230px; line-height: 1; letter-spacing: -0.02em; }
        #a2-power small { font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 110px; color: #a6f21c; margin-right: 16px; }
        .a2-chip { position: absolute; right: 70px; display: inline-flex; align-items: center; gap: 18px; padding: 12px 30px; border: 3px solid rgba(166, 242, 28, 0.8); border-radius: 60px; background: rgba(8, 12, 9, 0.82);
          font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 54px; line-height: 1.2; opacity: 0; white-space: nowrap; }
        .a2-chip i { width: 18px; height: 18px; border-radius: 50%; background: #a6f21c; box-shadow: 0 0 14px #a6f21c; }
        #a2-chip-speed { top: 1390px; }
        #a2-chip-auto { top: 1506px; }
        #a2-note { position: absolute; left: 70px; right: 70px; bottom: 70px; text-align: right; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 600; font-size: 26px; line-height: 1.45; color: #aab4a4; opacity: 0; }

        /* phase B: riding right to left through a Moroccan avenue at night */
        #a2-street { position: absolute; inset: 0; opacity: 0; }
        #a2-sky { background: radial-gradient(ellipse 120% 45% at 50% 66%, #3a2a3c 0%, #1b1d33 45%, #0a0f1d 100%); }
        #a2-far { position: absolute; left: 0; top: 500px; width: 3600px; height: 700px; opacity: 0.9; filter: blur(3px); }
        #a2-mid { position: absolute; left: 0; top: 340px; width: 4200px; height: 1100px; filter: blur(1.6px) brightness(0.82); }
        #a2-road { position: absolute; left: 0; right: 0; top: 1440px; bottom: 0;
          background:
            radial-gradient(ellipse 30% 16% at 20% 30%, rgba(255, 190, 110, 0.18), rgba(255, 190, 110, 0) 70%),
            radial-gradient(ellipse 30% 16% at 80% 34%, rgba(255, 190, 110, 0.14), rgba(255, 190, 110, 0) 70%),
            linear-gradient(180deg, #151820 0%, #0b0d12 100%); }
        #a2-lane { position: absolute; left: 0; right: 0; top: 1790px; height: 14px; background: repeating-linear-gradient(90deg, rgba(236, 232, 220, 0.75) 0 150px, rgba(0, 0, 0, 0) 150px 300px); }
        #a2-ride { position: absolute; left: 110px; top: 1063px; width: 860px; height: 700px; }
        #a2-ride > img { position: absolute; inset: 0; width: 100%; height: 100%; }
        .a2-wheel { position: absolute; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
        .a2-wheel img { width: 100%; height: 100%; display: block; }
        #a2-wheel-front { left: 0.647%; top: 60.954%; width: 26.763%; height: 32.862%; -webkit-mask-image: url("../../assets/m26-ar/roue-front-masque.png"); mask-image: url("../../assets/m26-ar/roue-front-masque.png"); }
        #a2-wheel-rear { left: 71.727%; top: 63.428%; width: 25.612%; height: 31.449%; -webkit-mask-image: url("../../assets/m26-ar/roue-rear-masque.png"); mask-image: url("../../assets/m26-ar/roue-rear-masque.png"); }
        #a2-shadow { position: absolute; left: 130px; top: 1690px; width: 820px; height: 70px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0) 70%); }
        .a2-trail { position: absolute; height: 12px; border-radius: 6px; background: linear-gradient(90deg, rgba(184, 255, 58, 0.95), rgba(166, 242, 28, 0)); filter: blur(2px); box-shadow: 0 0 22px rgba(166, 242, 28, 0.6); transform-origin: 0% 50%; }
        #a2-trail-a { left: 720px; width: 560px; top: 560px; }
        #a2-trail-b { left: 640px; width: 470px; top: 330px; height: 8px; }
        #a2-hud { position: absolute; left: 70px; right: 70px; top: 176px; text-align: right; opacity: 0; }
        #a2-hud-k { font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 38px; color: #a6f21c; }
        #a2-hud-t { margin-top: 10px; font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 92px; line-height: 1.2; }
        #a2-hud-t b { color: #a6f21c; font-weight: 800; }
        #a2-throttle { position: absolute; left: 70px; top: 470px; width: 220px; height: 220px; opacity: 0; }
        #a2-throttle-arrow { transform-origin: 110px 110px; }
        #a2-throttle-l { position: absolute; left: 30px; top: 700px; width: 300px; text-align: center; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 32px; color: #dfe7d8; opacity: 0; }
        #a2-flash { background: #f4ffe6; opacity: 0; }
      </style>

      <div id="a2-root" dir="rtl" data-composition-id="a2-moteur" data-width="1080" data-height="1920" data-duration="6.5">
        <div id="a2-wall" class="layer"></div>
        <div id="a2-glow-b" data-layout-allow-overflow></div>
        <div id="a2-glow-r" data-layout-allow-overflow></div>

        <div id="a2-zoom">
          <div id="a2-stage" data-layout-allow-overflow><img src="../../assets/m26-ar/profil-vert.webp" alt="M26 من الجانب، العجلة الخلفية بمحرك مدمج" /></div>
          <div id="a2-shade-top" class="layer"></div>
          <div id="a2-shade-bot" class="layer"></div>
          <svg id="a2-current" viewBox="0 0 1080 1920" aria-hidden="true">
            <path id="a2-current-path" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M-40,620 C120,640 280,700 380,790 C450,850 500,920 525,955" />
            <path id="a2-current-flow" pathLength="1" stroke-dasharray="0.05 0.07" stroke-dashoffset="0" d="M-40,620 C120,640 280,700 380,790 C450,850 500,920 525,955" style="stroke: #f2ffd9; stroke-width: 6; opacity: 0" />
          </svg>
          <div id="a2-xray">
            <div id="a2-xray-disc"></div>
            <svg id="a2-motor" viewBox="-340 -340 680 680" aria-hidden="true">
              <g id="a2-magnets"></g>
              <circle r="208" fill="none" stroke="#3b4752" stroke-width="4" />
              <g id="a2-teeth"></g>
              <circle r="112" fill="#141a20" stroke="#56636e" stroke-width="5" />
              <circle r="112" fill="none" stroke="#a6f21c" stroke-width="3" stroke-dasharray="6 10" opacity="0.6" />
              <circle r="40" fill="#8c98a2" />
              <circle r="16" fill="#2a3138" />
            </svg>
          </div>
          <div id="a2-kicker">محرك مدمج في العجلة الخلفية · HUB</div>
          <div id="a2-power"><span class="ltr" id="a2-power-n">0</span><small>واط</small></div>
          <div id="a2-chip-speed" class="a2-chip"><i></i>من 50 إلى 70 كم/س*</div>
          <div id="a2-chip-auto" class="a2-chip"><i></i>أوتوماتيكي · بدون لامبرياج</div>
          <div id="a2-note">*السرعة القصوى المعلنة، تختلف حسب الإعدادات وظروف الاستعمال.</div>
        </div>

        <div id="a2-street">
          <div id="a2-sky" class="layer"></div>
          <img id="a2-far" src="../../assets/decor/ville-loin.svg" alt="" data-layout-allow-overflow />
          <img id="a2-mid" src="../../assets/decor/ville-rue.svg" alt="" data-layout-allow-overflow />
          <div id="a2-road"></div>
          <div id="a2-lane"></div>
          <div id="a2-shadow"></div>
          <div id="a2-ride">
            <div id="a2-trail-b" class="a2-trail" data-layout-allow-overflow></div>
            <div id="a2-trail-a" class="a2-trail" data-layout-allow-overflow></div>
            <img src="../../assets/m26-ar/profil-vert-roule.webp" alt="M26 يسير في شارع مغربي ليلاً" />
            <div id="a2-wheel-front" class="a2-wheel"><img src="../../assets/m26-ar/roue-front-flou.webp" alt="" /></div>
            <div id="a2-wheel-rear" class="a2-wheel"><img src="../../assets/m26-ar/roue-rear-flou.webp" alt="" /></div>
          </div>
          <div id="a2-hud">
            <div id="a2-hud-k">محرك 2000 واط</div>
            <div id="a2-hud-t">بدون لامبرياج. <b>أدِر المقبض… وانطلق.</b></div>
          </div>
          <svg id="a2-throttle" viewBox="0 0 220 220" aria-hidden="true">
            <circle cx="110" cy="110" r="104" fill="rgba(8,12,9,0.8)" stroke="rgba(166,242,28,0.8)" stroke-width="4" />
            <rect x="52" y="92" width="116" height="36" rx="18" fill="#2b3138" stroke="#9aa6af" stroke-width="3" />
            <rect x="52" y="92" width="28" height="36" rx="10" fill="#7fe12b" />
            <g id="a2-throttle-arrow">
              <path d="M150,62 A58,58 0 0 0 60,70" fill="none" stroke="#a6f21c" stroke-width="9" stroke-linecap="round" />
              <path d="M60,70 l26,-6 l-14,22 z" fill="#a6f21c" />
            </g>
          </svg>
          <div id="a2-throttle-l">أدِر وانطلق</div>
        </div>
        <div id="a2-flash" class="layer"></div>
      </div>

      <script>
        (() => {
          const NS = "http://www.w3.org/2000/svg";
          const teeth = document.getElementById("a2-teeth");
          for (let i = 0; i < 24; i++) {
            const g = document.createElementNS(NS, "g");
            g.setAttribute("transform", `rotate(${i * 15})`);
            const r = document.createElementNS(NS, "rect");
            r.setAttribute("x", "-13"); r.setAttribute("y", "-200"); r.setAttribute("width", "26"); r.setAttribute("height", "84"); r.setAttribute("rx", "7");
            r.setAttribute("class", "a2-tooth"); r.setAttribute("fill", "#b87533"); r.setAttribute("stroke", "#e0a15c"); r.setAttribute("stroke-width", "2");
            g.appendChild(r); teeth.appendChild(g);
          }
          const mags = document.getElementById("a2-magnets");
          for (let i = 0; i < 28; i++) {
            const a0 = (i * 360) / 28, a1 = a0 + 360 / 28 - 2;
            const p = (a, rad) => [rad * Math.cos((a * Math.PI) / 180), rad * Math.sin((a * Math.PI) / 180)];
            const [x0, y0] = p(a0, 222), [x1, y1] = p(a1, 222), [x2, y2] = p(a1, 254), [x3, y3] = p(a0, 254);
            const path = document.createElementNS(NS, "path");
            path.setAttribute("d", `M${x0},${y0} A222,222 0 0 1 ${x1},${y1} L${x2},${y2} A254,254 0 0 0 ${x3},${y3} Z`);
            path.setAttribute("fill", i % 2 ? "#253226" : "#8fc23d");
            path.setAttribute("opacity", i % 2 ? "1" : "0.85");
            mags.appendChild(path);
          }

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#a2-stage", { x: 0, y: 0, scale: 1, filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 0);
          tl.to("#a2-stage", { x: -1444, y: -1263, scale: 2.3, duration: 1.25, ease: "power3.inOut" }, 0.15);
          tl.fromTo(["#a2-shade-top", "#a2-shade-bot"], { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.9);
          tl.fromTo("#a2-kicker", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.55);
          tl.fromTo("#a2-power", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.75);
          const pw = { v: 0 };
          tl.fromTo(pw, { v: 0 }, { v: 2000, duration: 0.75, ease: "power2.out", onUpdate: () => {
            document.getElementById("a2-power-n").textContent = Math.round(pw.v / 10) * 10;
          } }, 0.95);

          tl.fromTo("#a2-xray", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, 1.3);
          tl.fromTo("#a2-current-path", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 1.55);
          tl.fromTo("#a2-current-flow", { opacity: 0, strokeDashoffset: 0 }, { opacity: 1, strokeDashoffset: -1.2, duration: 1.9, ease: "none" }, 1.9);
          tl.fromTo("#a2-root .a2-tooth", { fill: "#b87533" }, { fill: "#b8ff3a", duration: 0.12, stagger: 0.025, ease: "power1.out" }, 1.95);
          tl.fromTo("#a2-magnets", { rotation: 0, svgOrigin: "0 0" }, { rotation: -200, svgOrigin: "0 0", duration: 2.1, ease: "power2.in" }, 1.6);
          tl.fromTo("#a2-chip-speed", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.4);
          tl.fromTo("#a2-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.5);
          tl.fromTo("#a2-chip-auto", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.0);

          // cut on motion to the street: the M26 rides right to left
          tl.to("#a2-zoom", { opacity: 0, scale: 1.15, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 3.45);
          tl.fromTo("#a2-street", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.5);
          const RIDE = 3.0;
          tl.fromTo("#a2-far", { x: -2420 }, { x: -2040, duration: RIDE, ease: "none" }, 3.5);
          tl.fromTo("#a2-mid", { x: -3020 }, { x: -1120, duration: RIDE, ease: "none" }, 3.5);
          tl.fromTo("#a2-lane", { backgroundPositionX: "0px" }, { backgroundPositionX: "3600px", duration: RIDE, ease: "none" }, 3.5);
          tl.fromTo(["#a2-wheel-rear img", "#a2-wheel-front img"], { rotation: 0 }, { rotation: -1860, duration: RIDE, ease: "none" }, 3.5);
          tl.fromTo("#a2-ride", { y: 0 }, { y: -4, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 9 }, 3.5);
          tl.fromTo("#a2-root .a2-trail", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 3.6);
          tl.fromTo("#a2-hud", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.75);
          tl.fromTo(["#a2-throttle", "#a2-throttle-l"], { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 4.4);
          tl.fromTo("#a2-throttle-arrow", { rotation: 40 }, { rotation: -20, duration: 0.6, ease: "power2.inOut", yoyo: true, repeat: 1 }, 4.5);

          // exit: dive toward the battery panel
          tl.to("#a2-ride", { scale: 1.5, x: -40, y: -120, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 6.2);
          tl.fromTo("#a2-flash", { opacity: 0 }, { opacity: 0.25, duration: 0.25, ease: "power2.in" }, 6.25);

          window.__timelines["a2-moteur"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
