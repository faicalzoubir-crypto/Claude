        <div data-hf-id="hf-ag0m" id="f5-T2" class="f5-label"><b data-hf-id="hf-c9a9">Alarme de sécurité à distance</b><span data-hf-id="hf-u8ux">TÉLÉCOMMANDE</span></div>
        <div data-hf-id="hf-ee4n" id="f5-T3" class="f5-label"><b data-hf-id="hf-6qh2">Phare LED à halo</b><span data-hf-id="hf-6wnu">+ CLIGNOTANTS LED INTÉGRÉS</span></div>
        <div data-hf-id="hf-ic8o" id="f5-T4" class="f5-label"><b data-hf-id="hf-lufi">Écran LCD numérique</b><span data-hf-id="hf-w8je">VITESSE · BATTERIE · KILOMÉTRAGE</span></div>
        <div data-hf-id="hf-j3wh" id="f5-T5" class="f5-label"><b data-hf-id="hf-qo2d">Freins à disque hydrauliques</b><span data-hf-id="hf-kulr">AVANT ET ARRIÈRE</span></div>
        <div data-hf-id="hf-n20i" id="f5-T6" class="f5-label"><b data-hf-id="hf-bamm">Fourche télescopique</b><span data-hf-id="hf-9esc">+ DOUBLE AMORTISSEUR HYDRAULIQUE</span></div>
        <div data-hf-id="hf-t7qb" id="f5-T7" class="f5-label"><b data-hf-id="hf-e9xo">Confort au quotidien</b><span data-hf-id="hf-ureb">POUR LE PILOTE ET LE PASSAGER</span></div>
        </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          // beat starts (local seconds), each aligned with the word in the voice-over
          const B = [0, 2.2, 3.45, 4.4, 5.1, 6.7, 7.9, 9.0];
          const dots = gsap.utils.toArray("#f5-root .f5-dot");

          tl.fromTo("#f5-cam", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);
          tl.fromTo("#f5-main", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.5)" }, 0.05);
          tl.fromTo("#f5-kicker", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.1);

          const showLabel = (i) => {
            tl.fromTo(`#f5-T${i + 1}`, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, B[i] + 0.12);
            if (i < 6) tl.to(`#f5-T${i + 1}`, { opacity: 0, y: -30, duration: 0.18, ease: "power2.in" }, B[i + 1] - 0.05);
            tl.fromTo(dots[i], { backgroundColor: "#26302a", scale: 1 }, { backgroundColor: "#a6f21c", scale: 1.25, duration: 0.2 }, B[i] + 0.1);
            if (i < 6) tl.to(dots[i], { backgroundColor: "#4d6b2a", scale: 1, duration: 0.2 }, B[i + 1]);
          };
          for (let i = 0; i < 7; i++) showLabel(i);

          // lens layers 1–4
          const lensIn = (id, t) => tl.fromTo(id, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
          const lensOut = (id, t) => tl.to(id, { opacity: 0, duration: 0.2 }, t);
          lensIn("#f5-L1", 0.1); lensOut("#f5-L1", B[1]);
          lensIn("#f5-L2", B[1]); lensOut("#f5-L2", B[2]);
          lensIn("#f5-L3", B[2]); lensOut("#f5-L3", B[3]);
          lensIn("#f5-L4", B[3]);

          // b1: the NFC card taps the reader, the power symbol lights up
          tl.fromTo("#f5-card", { x: 260, y: 60, rotation: 12, svgOrigin: "380 520" }, { x: 0, y: -170, rotation: 0, svgOrigin: "380 520", duration: 0.7, ease: "power3.inOut" }, 0.35);
          tl.fromTo("#f5-reader-ring", { opacity: 0, scale: 1, svgOrigin: "380 300" }, { opacity: 1, scale: 1.25, svgOrigin: "380 300", duration: 0.35, ease: "power2.out" }, 1.05);
          tl.to("#f5-reader-ring", { opacity: 0, duration: 0.3 }, 1.4);
          tl.fromTo("#f5-power", { stroke: "#56645a" }, { stroke: "#b8ff3a", duration: 0.15 }, 1.08);
          tl.to("#f5-card", { y: 0, opacity: 0.0, duration: 0.4, ease: "power2.in" }, 1.6);

          // b2: the remote sends its signal, the shield locks
          ["w1", "w2", "w3"].forEach((w, i) => {
            tl.fromTo(`#f5-root .${w}`, { opacity: 0 }, { opacity: 1, duration: 0.12, yoyo: true, repeat: 3 }, B[1] + 0.25 + i * 0.08);
          });
          tl.fromTo("#f5-shield", { scale: 0.85, svgOrigin: "560 400" }, { scale: 1.05, svgOrigin: "560 400", duration: 0.25, ease: "back.out(2)", yoyo: true, repeat: 1 }, B[1] + 0.55);

          // b3: the halo headlight switches on
          tl.fromTo("#f5-halo", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.1, duration: 0.25, ease: "power2.out" }, B[2] + 0.2);
          tl.to("#f5-halo", { opacity: 0.7, scale: 1, duration: 0.4 }, B[2] + 0.45);
          tl.fromTo("#f5-L3 img", { scale: 1.15 }, { scale: 1.0, duration: 1.0, ease: "none" }, B[2]);
          tl.fromTo("#f5-L4 img", { scale: 1.15 }, { scale: 1.02, duration: 0.8, ease: "none" }, B[3]);

          // b5–b6: the lens splits in two, front and rear
          tl.to("#f5-main", { scale: 0.5, opacity: 0, duration: 0.25, ease: "power2.in" }, B[4] - 0.05);
          tl.fromTo("#f5-pair1", { opacity: 0 }, { opacity: 1, duration: 0.15 }, B[4]);
          tl.fromTo("#f5-pair1 .f5-lens", { scale: 0.3 }, { scale: 1, duration: 0.4, ease: "back.out(1.5)", stagger: 0.1 }, B[4]);
          tl.fromTo("#f5-pair1 img", { scale: 1.2 }, { scale: 1.0, duration: 1.6, ease: "none" }, B[4]);
          tl.to("#f5-pair1", { opacity: 0, duration: 0.2 }, B[5]);
          tl.fromTo("#f5-pair2", { opacity: 0 }, { opacity: 1, duration: 0.15 }, B[5]);
          tl.fromTo("#f5-pair2 .f5-lens", { rotation: -30, scale: 0.8 }, { rotation: 0, scale: 1, duration: 0.4, ease: "back.out(1.5)", stagger: 0.1 }, B[5]);
          tl.fromTo("#f5-pair2 img", { scale: 1.2 }, { scale: 1.0, duration: 1.2, ease: "none" }, B[5]);
          tl.to("#f5-pair2", { opacity: 0, duration: 0.2 }, B[6]);

          // b7: comfort callouts on the 3/4 rear view
          tl.fromTo("#f5-comfort", { opacity: 0 }, { opacity: 1, duration: 0.2 }, B[6]);
          tl.fromTo("#f5-comfort-img", { scale: 0.9, y: 30 }, { scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, B[6]);
          tl.fromTo("#f5-root .f5-pt", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.08 }, B[6] + 0.15);
          tl.fromTo("#f5-root .f5-lead", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, stagger: 0.08, ease: "power2.out" }, B[6] + 0.2);
          tl.fromTo("#f5-root .f5-call", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.08, ease: "power3.out" }, B[6] + 0.35);

          // exit: whip into the street
          tl.to("#f5-cam", { x: -300, opacity: 0, duration: 0.22, ease: "power2.in" }, 8.78);

          window.__timelines["f5-equipements"] = tl;
        })();
      </script>
    </template>
