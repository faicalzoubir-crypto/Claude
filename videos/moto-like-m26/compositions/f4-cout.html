        #f4-rial-l { position: absolute; left: 650px; top: 262px; width: 300px; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 80%; font-size: 40px; color: #e8b23c; opacity: 0; white-space: nowrap; }

            <path data-hf-id="hf-d3lu" id="f4-cable-flow" pathLength="1" stroke-dasharray="0.04 0.06" stroke-dashoffset="0" d="M900,1290 C880,1450 840,1600 760,1640 C640,1700 520,1560 470,1350" fill="none" stroke="#b8ff3a" stroke-width="7" stroke-linecap="round" style="opacity: 0; filter: drop-shadow(0 0 8px #a6f21c)" />

          <div data-hf-id="hf-phqw" id="f4-tag-meter" class="f4-tag" style="left: 385px; top: 740px"><b data-hf-id="hf-he9w">≈ 3,8 kWh</b><span data-hf-id="hf-5loh">COMPTEUR · PERTES ≈ 15 %</span></div>

          <div data-hf-id="hf-u7wv" id="f4-calc">

              <div data-hf-id="hf-jayk" id="f4-row2" class="f4-row"><div data-hf-id="hf-out5" class="t">120 km → <b data-hf-id="hf-fk1s">0,037 DH/km</b></div><div data-hf-id="hf-gav5" class="track"><div data-hf-id="hf-rw43" class="fill" style="width: 592px"></div></div></div>

      <script>
        (() => {
          // ── isometric drawing (deterministic geometry) ──
          const NS = "http://www.w3.org/2000/svg";
          const OX = 505, OY = 520, C = Math.cos(Math.PI / 6), S = 0.5;
          const P = (x, y, z = 0) => [OX + (x - y) * C, OY + (x + y) * S - z];
          const pts = (arr) => arr.map((p) => P(...p).map((v) => v.toFixed(1)).join(",")).join(" ");
          const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
          const grid = document.getElementById("f4-floorgrid");
          for (let v = -420; v <= 560; v += 70) {
            el("line", { x1: P(v, -420)[0], y1: P(v, -420)[1], x2: P(v, 560)[0], y2: P(v, 560)[1], stroke: "rgba(166,242,28,0.12)", "stroke-width": 2 }, grid);
            el("line", { x1: P(-420, v)[0], y1: P(-420, v)[1], x2: P(560, v)[0], y2: P(560, v)[1], stroke: "rgba(166,242,28,0.12)", "stroke-width": 2 }, grid);
          }
          const objs = document.getElementById("f4-objects");
          const box = (cx, cy, w, d, h, top, left, right, cls) => {
            const g = el("g", { class: "f4-obj " + cls }, objs);
            el("polygon", { points: pts([[cx - w / 2, cy + d / 2, 0], [cx + w / 2, cy + d / 2, 0], [cx + w / 2, cy + d / 2, h], [cx - w / 2, cy + d / 2, h]]), fill: left }, g);
            el("polygon", { points: pts([[cx + w / 2, cy - d / 2, 0], [cx + w / 2, cy + d / 2, 0], [cx + w / 2, cy + d / 2, h], [cx + w / 2, cy - d / 2, h]]), fill: right }, g);
            el("polygon", { points: pts([[cx - w / 2, cy - d / 2, h], [cx + w / 2, cy - d / 2, h], [cx + w / 2, cy + d / 2, h], [cx - w / 2, cy + d / 2, h]]), fill: top }, g);
            return g;
          };
          // pylon (lattice tower)
          const py = el("g", { class: "f4-obj f4-o1", stroke: "#9fb3c4", "stroke-width": 4, fill: "none", "stroke-linecap": "round" }, objs);
          const pyx = -162, pyy = 242;
          const legs = [[-34, -34], [34, -34], [34, 34], [-34, 34]];
          legs.forEach(([a, b]) => { const [x1, y1] = P(pyx + a, pyy + b, 0), [x2, y2] = P(pyx + a * 0.25, pyy + b * 0.25, 290); el("line", { x1, y1, x2, y2 }, py); });
          [60, 130, 200].forEach((z) => { const k = 1 - (z / 290) * 0.75; el("polygon", { points: pts(legs.map(([a, b]) => [pyx + a * k, pyy + b * k, z])) }, py); });
          [[230, 92], [178, 70]].forEach(([z, L]) => { const [x1, y1] = P(pyx - L, pyy, z), [x2, y2] = P(pyx + L, pyy, z); el("line", { x1, y1, x2, y2, "stroke-width": 6 }, py); });
          // meter, battery, map tile
          box(100, 240, 70, 50, 120, "#4a5560", "#2a323b", "#38424c", "f4-o2");
          el("polygon", { points: pts([[76, 265, 74], [124, 265, 74], [124, 265, 102], [76, 265, 102]]), fill: "#a6f21c", class: "f4-obj f4-o2" }, objs);
          box(104, -24, 130, 76, 72, "#a6f21c", "#1f262e", "#2b333d", "f4-o3");
          const map = el("g", { class: "f4-obj f4-o4" }, objs);
          el("polygon", { points: pts([[260, -110, 0], [520, -110, 0], [520, 130, 0], [260, 130, 0]]), fill: "#16201b", stroke: "rgba(166,242,28,0.45)", "stroke-width": 3 }, map);
          [[300, -110, 300, 130], [380, -110, 380, 130], [460, -110, 460, 130], [260, -40, 520, -40], [260, 40, 520, 40]].forEach(([a, b, c, d]) => {
            const [x1, y1] = P(a, b), [x2, y2] = P(c, d); el("line", { x1, y1, x2, y2, stroke: "rgba(242,245,240,0.16)", "stroke-width": 6 }, map);
          });
          el("polyline", { id: "f4-route", points: pts([[300, -100, 2], [300, -40, 2], [380, -40, 2], [380, 40, 2], [460, 40, 2], [460, 120, 2]]), fill: "none", stroke: "#b8ff3a", "stroke-width": 8, "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, map);
          const [pinx, piny] = P(460, 120, 0);
          el("path", { d: `M${pinx},${piny} c-18,-26 -18,-44 0,-52 c18,8 18,26 0,52 z`, fill: "#b8ff3a", class: "f4-pin" }, map);
          // energy links between the stations
          const links = document.getElementById("f4-links");
          [[[pyx, pyy, 230], [100, 240, 120]], [[100, 240, 60], [104, -24, 36]], [[104, -24, 36], [300, -100, 2]]].forEach(([a, b], i) => {
            const [x1, y1] = P(...a), [x2, y2] = P(...b);
            const mid = [(x1 + x2) / 2, Math.max(y1, y2) + 40];
            el("path", { class: "f4-link", d: `M${x1},${y1} Q${mid[0]},${mid[1]} ${x2},${y2}`, fill: "none", stroke: "#b8ff3a", "stroke-width": 6, "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1, style: "filter: drop-shadow(0 0 8px #a6f21c)" }, links);
            el("path", { class: "f4-flow", d: `M${x1},${y1} Q${mid[0]},${mid[1]} ${x2},${y2}`, fill: "none", stroke: "#f2ffd9", "stroke-width": 5, "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": "0.06 0.1", "stroke-dashoffset": 0, opacity: 0 }, links);
          });

          const tl = gsap.timeline({ paused: true });
          const setText = (id, v) => { document.getElementById(id).textContent = v; };

          // phase A: plug in and charge
          tl.fromTo("#f4-garage", { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
          tl.fromTo("#f4-cable", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 0.25);
          tl.fromTo("#f4-socket-l", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.7);
          tl.fromTo("#f4-cable-flow", { opacity: 0, strokeDashoffset: 0 }, { opacity: 1, strokeDashoffset: -1.6, duration: 1.6, ease: "none" }, 0.85);
          tl.fromTo("#f4-ring", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.6, ease: "power1.inOut" }, 0.6);
          const pc = { v: 0 };
          tl.fromTo(pc, { v: 0 }, { v: 100, duration: 1.6, ease: "power1.inOut", onUpdate: () => setText("f4-pct", Math.round(pc.v)) }, 0.6);

          // the camera rises: the charge becomes an isometric energy chain
          tl.to("#f4-garage", { y: 260, scale: 0.82, opacity: 0, duration: 0.45, ease: "power2.in" }, 2.2);
          tl.fromTo("#f4-info", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 2.35);
          tl.fromTo("#f4-kicker", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.4);
          tl.fromTo("#f4-floorgrid", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.35);
          ["f4-o1", "f4-o2", "f4-o3", "f4-o4"].forEach((c, i) => {
            tl.fromTo(`#f4-root .${c}`, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 2.5 + i * 0.12);
          });
          ["#f4-tag-grid", "#f4-tag-meter", "#f4-tag-bat", "#f4-tag-map"].forEach((t, i) => {
            tl.fromTo(t, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.85 + i * 0.12);
          });
          tl.fromTo("#f4-root .f4-link", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, stagger: 0.25, ease: "power2.inOut" }, 2.85);
          tl.fromTo("#f4-root .f4-flow", { opacity: 0, strokeDashoffset: 0 }, { opacity: 1, strokeDashoffset: -2.4, duration: 4.4, ease: "none" }, 3.6);
          tl.fromTo("#f4-route", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 3.5);

          // the calculation, line by line
          tl.fromTo("#f4-l1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.6);
          tl.fromTo("#f4-l1s", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.9);
          tl.fromTo("#f4-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.0);
          tl.fromTo("#f4-l2", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out", transformOrigin: "0% 50%" }, 3.55);
          const dh = { v: 0 };
          tl.fromTo(dh, { v: 0 }, { v: 4.46, duration: 0.8, ease: "power2.out", immediateRender: false, onUpdate: () => setText("f4-dh", dh.v.toFixed(2).replace(".", ",")) }, 3.55);
          tl.fromTo("#f4-row1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 5.2);
          tl.fromTo("#f4-row1 .fill", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 5.3);
          tl.fromTo("#f4-row2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 5.55);
          tl.fromTo("#f4-row2 .fill", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 5.65);
          tl.fromTo("#f4-rial", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, 6.05);
          tl.fromTo("#f4-rial-l", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 6.25);

          // exit: zoom into the first equipment close-up
