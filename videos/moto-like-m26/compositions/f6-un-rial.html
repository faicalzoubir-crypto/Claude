<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="f6-un-rial-template">
      <style>
        @font-face { font-family: "Baloo Bhaijaan 2"; src: url("../assets/fonts/BalooBhaijaan2.ttf") format("truetype"); font-weight: 400 800; }
        @font-face { font-family: "Saira"; src: url("../assets/fonts/Saira-Italic.ttf") format("truetype"); font-weight: 100 900; font-stretch: 50% 125%; font-style: italic; }
        @font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/JetBrainsMono.ttf") format("truetype"); font-weight: 100 800; }

        #f6-root { position: absolute; inset: 0; overflow: hidden; background: #080b0f; color: #f2f5f0; }
        #f6-root .layer { position: absolute; inset: 0; }

        /* ride */
        #f6-street { position: absolute; inset: 0; transform-origin: 50% 72%; }
        #f6-sky { background: radial-gradient(ellipse 120% 45% at 50% 66%, #3a2a3c 0%, #1b1d33 45%, #0a0f1d 100%); }
        #f6-far { position: absolute; left: 0; top: 500px; width: 3600px; height: 700px; opacity: 0.9; filter: blur(3px); }
        #f6-mid { position: absolute; left: -1200px; top: 340px; width: 4200px; height: 1100px; filter: blur(2px) brightness(0.8); }
        #f6-road { position: absolute; left: 0; right: 0; top: 1440px; bottom: 0; background: radial-gradient(ellipse 30% 16% at 20% 30%, rgba(255, 190, 110, 0.18), rgba(255, 190, 110, 0) 70%), linear-gradient(180deg, #151820 0%, #0b0d12 100%); }
        #f6-lane { position: absolute; left: 0; right: 0; top: 1790px; height: 14px; background: repeating-linear-gradient(90deg, rgba(236, 232, 220, 0.75) 0 150px, rgba(0, 0, 0, 0) 150px 300px); }
        #f6-shadow { position: absolute; left: 150px; top: 1690px; width: 800px; height: 70px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0) 70%); }
        #f6-ride { position: absolute; left: 110px; top: 1093px; width: 860px; height: 660px; }
        #f6-ride > img { position: absolute; inset: 0; width: 100%; height: 100%; }
        .f6-wheel { position: absolute; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
        .f6-wheel img { width: 100%; height: 100%; display: block; }
        #f6-wheel-rear { left: 2.773%; top: 61.327%; width: 25.828%; height: 33.657%; -webkit-mask-image: url("../assets/m26/roue-rear-masque.png"); mask-image: url("../assets/m26/roue-rear-masque.png"); }
        #f6-wheel-front { left: 75.538%; top: 65.912%; width: 24.172%; height: 31.499%; -webkit-mask-image: url("../assets/m26/roue-front-masque.png"); mask-image: url("../assets/m26/roue-front-masque.png"); }
        .f6-trail { position: absolute; height: 14px; border-radius: 7px; background: linear-gradient(90deg, rgba(166, 242, 28, 0), rgba(184, 255, 58, 0.95)); filter: blur(2px); box-shadow: 0 0 26px rgba(166, 242, 28, 0.7); transform-origin: 100% 50%; }
        #f6-trail-a { left: -900px; width: 1060px; top: 1570px; }
        #f6-trail-b { left: -700px; width: 860px; top: 1380px; height: 9px; }
        #f6-hud { position: absolute; left: 70px; right: 70px; top: 220px; text-align: center; }
        #f6-hud-big { font-family: "Saira", sans-serif; font-style: italic; font-weight: 800; font-stretch: 75%; font-size: 150px; line-height: 1; color: #a6f21c; text-shadow: 0 0 40px rgba(166, 242, 28, 0.5), 0 6px 30px rgba(0, 0, 0, 0.7); }
        #f6-hud-row { margin-top: 26px; display: flex; justify-content: center; gap: 60px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 34px; letter-spacing: 0.08em; text-shadow: 0 3px 14px rgba(0, 0, 0, 0.8); }
        #f6-hud-row span b { color: #a6f21c; }

        /* the held line */
        #f6-clean { background: radial-gradient(ellipse 80% 50% at 50% 45%, #121a12 0%, #090c0a 60%, #050706 100%); opacity: 0; }
        #f6-splash-a { position: absolute; left: -60px; top: 620px; width: 1200px; height: 700px; opacity: 0; }
        #f6-splash-b { position: absolute; left: 160px; top: 190px; width: 760px; height: 444px; opacity: 0; }
        #f6-head { position: absolute; left: 30px; right: 30px; top: 560px; text-align: center; font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; line-height: 1.12; }
        #f6-head span { display: block; }
        #f6-h1, #f6-h3 { font-size: 156px; color: #f2f5f0; text-shadow: 0 0 2px #050706, 0 8px 0 #050706, 0 14px 40px rgba(0, 0, 0, 0.85); }
        #f6-h2 { font-size: 190px; color: #b8ff3a; text-shadow: 0 0 3px #050706, 0 10px 0 #050706, 0 0 60px rgba(166, 242, 28, 0.45); }
        #f6-coin { position: absolute; left: 430px; top: 300px; width: 220px; height: 220px; opacity: 0; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 30px rgba(232, 178, 60, 0.5)); }
        #f6-sub { position: absolute; left: 40px; right: 40px; top: 1340px; text-align: center; font-family: "Baloo Bhaijaan 2", sans-serif; font-weight: 800; font-size: 100px; line-height: 1.2; opacity: 0; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.8); }
        #f6-sub-line { position: absolute; left: 320px; right: 320px; top: 1486px; height: 10px; border-radius: 5px; background: #a6f21c; box-shadow: 0 0 24px rgba(166, 242, 28, 0.7); transform-origin: 100% 50%; }
        #f6-note { position: absolute; left: 70px; right: 70px; top: 1770px; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 24px; line-height: 1.4; color: #98a392; opacity: 0; }
        #f6-flash { background: #f4ffe6; opacity: 0; }
        #f6-warm { background: radial-gradient(ellipse 90% 60% at 60% 30%, #ffc46b 0%, #ff8a3d 55%, #a8475a 100%); opacity: 0; }
      </style>

      <div data-hf-id="hf-50he" id="f6-root" data-composition-id="f6-un-rial" data-width="1080" data-height="1920" data-duration="6.5">
        <div data-hf-id="hf-bqo4" id="f6-street" data-layout-allow-overflow="">
          <div data-hf-id="hf-nf35" id="f6-sky" class="layer"></div>
          <img data-hf-id="hf-5r5d" id="f6-far" data-layout-allow-overflow="" src="../assets/decor/ville-loin.svg" alt="">
          <img data-hf-id="hf-yego" id="f6-mid" data-layout-allow-overflow="" src="../assets/decor/ville-rue.svg" alt="">
          <div data-hf-id="hf-y21v" id="f6-road" data-layout-allow-overflow=""></div>
          <div data-hf-id="hf-bix7" id="f6-lane" data-layout-allow-overflow=""></div>
          <div data-hf-id="hf-i3r6" id="f6-shadow"></div>
          <div data-hf-id="hf-al5o" id="f6-ride">
            <div data-hf-id="hf-qgba" id="f6-trail-b" data-layout-allow-overflow="" class="f6-trail"></div>
            <div data-hf-id="hf-mi79" id="f6-trail-a" data-layout-allow-overflow="" class="f6-trail"></div>
            <img data-hf-id="hf-i5sd" src="../assets/m26/profil-roule.webp" alt="M26 qui roule de nuit avec sa traînée verte">
            <div data-hf-id="hf-keet" id="f6-wheel-rear" class="f6-wheel"><img data-hf-id="hf-jar4" src="../assets/m26/roue-rear-flou.webp" alt=""></div>
            <div data-hf-id="hf-b738" id="f6-wheel-front" class="f6-wheel"><img data-hf-id="hf-ignh" src="../assets/m26/roue-front-flou.webp" alt=""></div>
          </div>
          <div data-hf-id="hf-1zhv" id="f6-hud" data-layout-allow-occlusion="">
            <div data-hf-id="hf-9qzy" id="f6-hud-big">0,045 DH/km</div>
            <div data-hf-id="hf-jgea" id="f6-hud-row"><span data-hf-id="hf-5h4m">DISTANCE <b data-hf-id="hf-k9hx" id="f6-km">0</b> km</span><span data-hf-id="hf-jaa8">COÛT <b data-hf-id="hf-wrpj" id="f6-dh">0,00</b> DH</span></div>
          </div>
        </div>

        <div data-hf-id="hf-s4ud" id="f6-clean" class="layer"></div>
        <img data-hf-id="hf-0guh" id="f6-splash-a" data-layout-allow-overflow="" src="../assets/decor/eclaboussure-a.svg" alt="">
        <img data-hf-id="hf-1njz" id="f6-splash-b" data-layout-allow-overflow="" src="../assets/decor/eclaboussure-b.svg" alt="">
        <div data-hf-id="hf-87qu" id="f6-head" dir="rtl" lang="ar"><span data-hf-id="hf-859g" id="f6-h1">بأقل من</span><span data-hf-id="hf-00yk" id="f6-h2">رِيَال واحد</span><span data-hf-id="hf-grfh" id="f6-h3">للكيلومتر</span></div>
        <img data-hf-id="hf-19gl" id="f6-coin" src="../assets/decor/piece-5-centimes.svg" alt="Pièce de 5 centimes, soit 1 rial">
        <div data-hf-id="hf-qdjf" id="f6-sub" dir="rtl" lang="ar">تنقّل أكثر، وصرف أقل</div>
        <div data-hf-id="hf-ry6j" id="f6-sub-line"></div>
        <div data-hf-id="hf-39ru" id="f6-note">*Selon le calcul : 3,8 kWh × 1,17 DH/kWh ÷ 100 km ≈ 0,045 DH/km, autonomie annoncée.</div>
        <div data-hf-id="hf-gfpc" id="f6-flash" class="layer"></div>
        <div data-hf-id="hf-86f9" id="f6-warm" class="layer"></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const RIDE = 2.0;
          // whip in, the M26 rides and the cost counter runs with it
          tl.fromTo("#f6-street", { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 0);
          tl.fromTo("#f6-far", { x: 0 }, { x: -320, duration: RIDE, ease: "none" }, 0);
          tl.fromTo("#f6-mid", { x: 0 }, { x: -1700, duration: RIDE, ease: "none" }, 0);
          tl.fromTo("#f6-lane", { backgroundPositionX: "0px" }, { backgroundPositionX: "-3400px", duration: RIDE, ease: "none" }, 0);
          tl.fromTo(["#f6-wheel-rear img", "#f6-wheel-front img"], { rotation: 0 }, { rotation: 1700, duration: RIDE, ease: "none" }, 0);
          tl.fromTo("#f6-root .f6-trail", { scaleX: 0.3, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#f6-hud", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.2);
          const run = { km: 0 };
          tl.fromTo(run, { km: 0 }, { km: 100, duration: 1.7, ease: "power1.in", onUpdate: () => {
            document.getElementById("f6-km").textContent = Math.round(run.km);
            document.getElementById("f6-dh").textContent = (run.km * 0.0446).toFixed(2).replace(".", ",");
          } }, 0.25);
          tl.fromTo("#f6-street", { scale: 1 }, { scale: 1.22, duration: 0.75, ease: "power2.in", immediateRender: false }, 1.25);

          // freeze: the set falls away, the line lands
          tl.fromTo("#f6-flash", { opacity: 0 }, { opacity: 0.45, duration: 0.05 }, 2.0);
          tl.to("#f6-flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, 2.06);
          tl.fromTo("#f6-clean", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.02);
          tl.fromTo("#f6-splash-a", { opacity: 0, scale: 0.5 }, { opacity: 0.22, scale: 1, duration: 0.3, ease: "expo.out" }, 2.08);
          tl.fromTo("#f6-splash-b", { opacity: 0, scale: 0.4 }, { opacity: 0.55, scale: 0.85, duration: 0.3, ease: "expo.out" }, 2.62);
          tl.fromTo("#f6-h1", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out" }, 2.08);
          tl.fromTo("#f6-h2", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, 2.22);
          tl.fromTo("#f6-h3", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out" }, 2.38);
          tl.fromTo("#f6-coin", { y: -600, rotation: -40 }, { y: 0, rotation: 0, duration: 0.7, ease: "bounce.out" }, 2.1);
          tl.set("#f6-coin", { opacity: 1 }, 2.1);
          tl.fromTo("#f6-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.8);
          // held frame 2.8–4.4: nothing moves while the line lands in the voice-over
          tl.fromTo("#f6-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.42);
          tl.fromTo("#f6-sub-line", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 4.6);

          // exit: the green turns into the warm sunset of the last shot
          tl.fromTo("#f6-warm", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.in" }, 6.15);

          window.__timelines["f6-un-rial"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
