  <script>
    (function () {
      // Spur gear outline: n teeth between radii r0 (root) and r1 (tip).
      function gear(cx, cy, r0, r1, n) {
        const pts = [];
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2, w = (Math.PI * 2) / n;
          const seq = [[r0, a], [r1, a + w * 0.18], [r1, a + w * 0.48], [r0, a + w * 0.66]];
          for (const [r, t] of seq) pts.push(`${(cx + r * Math.cos(t)).toFixed(1)} ${(cy + r * Math.sin(t)).toFixed(1)}`);
        }
        return "M " + pts.join(" L ") + " Z";
      }
      document.getElementById("f03-gearA").setAttribute("d", gear(84, 112, 50, 62, 16));
      document.getElementById("f03-gearB").setAttribute("d", gear(166, 112, 22, 32, 9));
      document.getElementById("f03-ring").setAttribute("d", gear(115, 112, 52, 62, 22));

      const D = 20.124, E = "power3.out";
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f03-progress", { width: "20%" }, { width: "30%", duration: D, ease: "none" }, 0);
      tl.fromTo("#f03-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: E }, 0.05);
      tl.fromTo("#f03-h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 0.12);
      tl.fromTo("#f03-tag", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: E }, 0.35);
      // the six stations wait dimmed, then light up as the voice names them
      const LIT = [0.9, 3.5, 6.6, 10.2, 14.9, 16.85];
      for (let i = 1; i <= 6; i++) {
        tl.fromTo("#f03-st" + i, { opacity: 0, y: 24 }, { opacity: 0.26, y: 0, duration: 0.5, ease: E }, 0.2 + i * 0.06);
        tl.to("#f03-st" + i, { opacity: 1, duration: 0.45, ease: E }, LIT[i - 1]);
        if (i < 6) {
          tl.fromTo("#f03-a" + i, { opacity: 0.16, scaleX: 0.3, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.45, ease: E }, LIT[i] - 0.2);
        }
      }
      tl.fromTo(["#f03-carter", "#f03-carter-k"], { opacity: 0 }, { opacity: 1, duration: 0.6, ease: E }, 6.45);
      tl.fromTo("#f03-move", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 18.6);

      // one clock drives every mechanism once its station is lit
      const q = (id) => document.getElementById(id);
      const pis = [q("f03-pis1"), q("f03-pis2"), q("f03-pis3")];
      const crank = q("f03-crank"), disc = q("f03-disc"), gA = q("f03-gearA"), gB = q("f03-gearB"), ring = q("f03-ring"), rim = q("f03-wheelrim");
      const shafts = [q("f03-sh1"), q("f03-sh2")];
      const clock = { t: 0 };
      const run = () => {
        const t = clock.t, w = 2 * Math.PI * 1.6;
        const a1 = Math.max(0, t - LIT[0]);
        pis.forEach((p, k) => p.setAttribute("transform", `translate(0 ${(a1 ? 12 * Math.sin(w * a1 + (k * 2 * Math.PI) / 3) : 0).toFixed(2)})`));
        crank.setAttribute("transform", `rotate(${((a1 * w * 180) / Math.PI).toFixed(1)} 115 174)`);
        const a2 = t - LIT[1];
        const sep = a2 > 0 && a2 < 2.6 ? 14 * Math.max(0, Math.sin((Math.PI * a2) / 1.3)) : 0;
        disc.setAttribute("transform", `translate(${sep.toFixed(2)} 0)`);
        const a3 = Math.max(0, t - LIT[2]);
        gA.setAttribute("transform", `rotate(${(-a3 * 120).toFixed(1)} 84 112)`);
        gB.setAttribute("transform", `rotate(${((a3 * 120 * 16) / 9).toFixed(1)} 166 112)`);
        const a4 = Math.max(0, t - LIT[3]);
