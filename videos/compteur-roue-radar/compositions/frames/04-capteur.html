      <div data-hf-id="hf-96bs" class="f04-lab" id="f04-lab1" style="left: 262px; top: 806px"><span data-hf-id="hf-6rox" class="f04-num">1</span>Capteur ABS</div>
      <div data-hf-id="hf-fj3z" class="f04-lab" id="f04-lab2" style="left: 894px; top: 642px"><span data-hf-id="hf-7ym0" class="f04-num">2</span>Calculateur</div>
      <div data-hf-id="hf-ch8f" class="f04-lab" id="f04-lab3" style="left: 1462px; top: 746px"><span data-hf-id="hf-7kaz" class="f04-num">3</span>Compteur</div>

  <script>
    (function () {
      // Toothed tone ring read by the ABS sensor.
      const cx = 400, cy = 560, n = 36, r0 = 84, r1 = 98, pts = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, w = (Math.PI * 2) / n;
        for (const [r, t] of [[r0, a], [r1, a + w * 0.12], [r1, a + w * 0.5], [r0, a + w * 0.62]])
          pts.push(`${(cx + r * Math.cos(t)).toFixed(1)} ${(cy + r * Math.sin(t)).toFixed(1)}`);
      }
      document.getElementById("f04-tone-path").setAttribute("d", "M " + pts.join(" L ") + " Z");

      // Speedometer: 0–180 km/h over 240°, needle on 60.
      const svg = document.getElementById("f04-gauge-svg");
      const NS = "http://www.w3.org/2000/svg";
      const gx = 210, gy = 210, R = 170;
      const ang = (v) => ((-120 + (v / 180) * 240) * Math.PI) / 180;
      const mk = (tag, attrs, text) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (text != null) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      const a0 = ang(0), a1 = ang(180);
      mk("path", { d: `M ${gx + R * Math.sin(a0)} ${gy - R * Math.cos(a0)} A ${R} ${R} 0 1 1 ${gx + R * Math.sin(a1)} ${gy - R * Math.cos(a1)}`, fill: "none", stroke: "#26343B", "stroke-width": 10, "stroke-linecap": "round" });
      for (let v = 0; v <= 180; v += 10) {
        const a = ang(v), major = v % 20 === 0, r1t = R - (major ? 34 : 22), r2t = R - 10;
        mk("line", { x1: gx + r1t * Math.sin(a), y1: gy - r1t * Math.cos(a), x2: gx + r2t * Math.sin(a), y2: gy - r2t * Math.cos(a), stroke: "#93A4A7", "stroke-width": major ? 5 : 3, "stroke-linecap": "round" });
        if (major) mk("text", { x: gx + (R - 62) * Math.sin(a), y: gy - (R - 62) * Math.cos(a) + 9, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 24, "font-weight": 600, fill: "#E8EEEC" }, v);
      }
      mk("text", { id: "f04-readout", x: gx, y: gy + 104, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 64, "font-weight": 700, fill: "#F4A62A" }, "60");
      mk("text", { x: gx, y: gy + 140, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 26, "font-weight": 600, fill: "#93A4A7" }, "km/h");
      const needle = mk("g", { id: "f04-needle" });
      needle.innerHTML = `<path d="M ${gx - 6} ${gy} L ${gx} ${gy - R + 48} L ${gx + 6} ${gy} Z" fill="#F4A62A"/><circle cx="${gx}" cy="${gy}" r="16" fill="#F4A62A"/><circle cx="${gx}" cy="${gy}" r="6" fill="#0D1316"/>`;
      
      const D = 6.31, E = "power3.out";
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-progress", { width: "30%" }, { width: "40%", duration: D, ease: "none" }, 0);
      tl.fromTo("#f04-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: E }, 0.05);
      tl.fromTo("#f04-h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 0.12);
      tl.fromTo("#f04-wheel", { opacity: 0, x: -160 }, { opacity: 1, x: 0, duration: 0.7, ease: E }, 0);
      tl.fromTo("#f04-sensor", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: E }, 0.6);
      tl.fromTo("#f04-lab1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0.9);
      const c1 = document.getElementById("f04-cable1"), c2 = document.getElementById("f04-cable2");
      const l1 = c1.getTotalLength(), l2 = c2.getTotalLength();
      tl.fromTo(c1, { strokeDasharray: l1, strokeDashoffset: l1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 2.7);
      tl.fromTo(c2, { strokeDasharray: l2, strokeDashoffset: l2 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 4.85);
      tl.fromTo("#f04-count", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 1.9);
      tl.fromTo("#f04-ecu", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: E }, 3.75);
      tl.fromTo("#f04-lab2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 3.9);
      tl.fromTo("#f04-gauge", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.55, ease: E }, 4.95);
      tl.fromTo(needle, { rotation: -120, svgOrigin: "210 210" }, { rotation: -40, svgOrigin: "210 210", duration: 1.0, ease: E }, 5.1);
      const readout = document.getElementById("f04-readout"), rv = { v: 0 };
      tl.fromTo(rv, { v: 0 }, { v: 60, duration: 1.0, ease: E, onUpdate: () => { readout.textContent = Math.round(rv.v); } }, 5.1);
      tl.fromTo("#f04-lab3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 5.3);

      // one clock: the tone ring turns, each 0.5 s counts a turn, pulses run along the cables
      const tone = document.getElementById("f04-tone"), tread = document.getElementById("f04-tread");
      const tours = document.getElementById("f04-tours");
      const p1 = gsap.utils.toArray("#f04-pulses1 circle"), p2 = gsap.utils.toArray("#f04-pulses2 circle");
      const clock = { t: 0 };
      const run = () => {
        const t = clock.t;
        tone.setAttribute("transform", `rotate(${(t * 220).toFixed(1)} 400 560)`);
        tread.setAttribute("transform", `rotate(${(t * 220).toFixed(1)} 400 560)`);
        tours.textContent = String(38 + Math.floor(Math.max(0, t - 1.9) / 0.5)).padStart(4, "0");
        const along = (path, len, dots, t0, t1) => dots.forEach((d, k) => {
          const u = (t - t0) / 0.9 - k / 3;
          const on = t >= t0 && t <= t1 && u >= 0;
          const f = ((u % 1) + 1) % 1;
          const pt = path.getPointAtLength(f * len);
          d.setAttribute("cx", pt.x.toFixed(1)); d.setAttribute("cy", pt.y.toFixed(1));
          d.setAttribute("opacity", on ? (1 - k * 0.3).toFixed(2) : 0);
        });
        along(c1, l1, p1, 3.1, D);
        along(c2, l2, p2, 5.2, D);
      };
      tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: run }, 0);
      run();
      window.__timelines["04-capteur"] = tl;
    })();
  </script>
