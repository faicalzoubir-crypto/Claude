  <script>
    (function () {
      // Toothed tone ring read by the ABS sensor.
      const cx = 400, cy = 560, n = 36, r0 = 84, r1 = 98, pts = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, w = (Math.PI * 2) / n;
        for (const [r, t] of [[r0, a], [r1, a + w * 0.12], [r1, a + w * 0.5], [r0, a + w * 0.62]])
          pts.push(`${(cx + r * Math.cos(t)).toFixed(1)} ${(cy + r * Math.sin(t)).toFixed(1)}`);
      }
      document.getElementById("f04-tone-path").setAttribute("d", "M " + pts.join(" L ") + " Z");

      // Speedometer: 0–180 km/h over 240°, needle on 60.
      const svg = document.getElementById("f04-gauge-svg");
      const NS = "http://www.w3.org/2000/svg";
      const gx = 210, gy = 210, R = 170;
      const ang = (v) => ((-120 + (v / 180) * 240) * Math.PI) / 180;
      const mk = (tag, attrs, text) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (text != null) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      const a0 = ang(0), a1 = ang(180);
      mk("path", { d: `M ${gx + R * Math.sin(a0)} ${gy - R * Math.cos(a0)} A ${R} ${R} 0 1 1 ${gx + R * Math.sin(a1)} ${gy - R * Math.cos(a1)}`, fill: "none", stroke: "rgba(193, 95, 60,0.25)", "stroke-width": 10, "stroke-linecap": "round" });
      for (let v = 0; v <= 180; v += 10) {
        const a = ang(v), major = v % 20 === 0, r1t = R - (major ? 34 : 22), r2t = R - 10;
        mk("line", { x1: gx + r1t * Math.sin(a), y1: gy - r1t * Math.cos(a), x2: gx + r2t * Math.sin(a), y2: gy - r2t * Math.cos(a), stroke: "#C15F3C", "stroke-width": major ? 5 : 3, "stroke-linecap": "round" });
        if (major) mk("text", { x: gx + (R - 62) * Math.sin(a), y: gy - (R - 62) * Math.cos(a) + 9, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 24, "font-weight": 600, fill: "#33241A" }, v);
      }
      mk("text", { id: "f04-readout", x: gx, y: gy + 104, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 64, "font-weight": 700, fill: "#C15F3C" }, "60");
      mk("text", { x: gx, y: gy + 140, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 26, "font-weight": 600, fill: "#7A6556" }, "km/h");
      const needle = mk("g", { id: "f04-needle" });
      needle.innerHTML = `<path d="M ${gx - 6} ${gy} L ${gx} ${gy - R + 48} L ${gx + 6} ${gy} Z" fill="#C15F3C"/><circle cx="${gx}" cy="${gy}" r="16" fill="#C15F3C"/><circle cx="${gx}" cy="${gy}" r="6" fill="#FAF9F5"/>`;
      gsap.set(needle, { rotation: -40, svgOrigin: `${gx} ${gy}` });

      const tl = gsap.timeline({ paused: true });
      window.__timelines["04-capteur"] = tl;
    })();
  </script>
