  <script>
    (function () {
      // Speedometer: 0–180 km/h over 240°, needle on 60.
      const svg = document.getElementById("f07-gauge-svg");
      const NS = "http://www.w3.org/2000/svg";
      const gx = 210, gy = 210, R = 190;
      const ang = (v) => ((-120 + (v / 180) * 240) * Math.PI) / 180;
      const mk = (tag, attrs, text) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (text != null) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      const a0 = ang(0), a1 = ang(180);
      mk("path", { d: `M ${gx + R * Math.sin(a0)} ${gy - R * Math.cos(a0)} A ${R} ${R} 0 1 1 ${gx + R * Math.sin(a1)} ${gy - R * Math.cos(a1)}`, fill: "none", stroke: "rgba(30,43,250,0.25)", "stroke-width": 10, "stroke-linecap": "round" });
      for (let v = 0; v <= 180; v += 10) {
        const a = ang(v), major = v % 20 === 0, r1t = R - (major ? 36 : 24), r2t = R - 10;
        mk("line", { x1: gx + r1t * Math.sin(a), y1: gy - r1t * Math.cos(a), x2: gx + r2t * Math.sin(a), y2: gy - r2t * Math.cos(a), stroke: "#1e2bfa", "stroke-width": major ? 6 : 3.5, "stroke-linecap": "round" });
        if (major) mk("text", { x: gx + (R - 68) * Math.sin(a), y: gy - (R - 68) * Math.cos(a) + 10, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 28, "font-weight": 600, fill: "#111111" }, v);
      }
      mk("text", { id: "f07-readout", x: gx, y: gy + 112, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 76, "font-weight": 700, fill: "#1e2bfa" }, "60");
      mk("text", { x: gx, y: gy + 150, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 28, "font-weight": 600, fill: "#6b6b6b" }, "km/h");
      const needle = mk("g", { id: "f07-needle" });
      needle.innerHTML = `<path d="M ${gx - 7} ${gy} L ${gx} ${gy - R + 52} L ${gx + 7} ${gy} Z" fill="#1e2bfa"/><circle cx="${gx}" cy="${gy}" r="18" fill="#1e2bfa"/><circle cx="${gx}" cy="${gy}" r="7" fill="#fdfae7"/>`;
      gsap.set(needle, { rotation: -40, svgOrigin: `${gx} ${gy}` });

      const tl = gsap.timeline({ paused: true });
      window.__timelines["07-karim"] = tl;
    })();
