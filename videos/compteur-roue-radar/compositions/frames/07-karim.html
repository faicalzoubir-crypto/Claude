  <script>
    (function () {
      // Speedometer: 0–180 km/h over 240°, needle on 60.
      const svg = document.getElementById("f07-gauge-svg");
      const NS = "http://www.w3.org/2000/svg";
      const gx = 210, gy = 210, R = 190;
      const ang = (v) => ((-120 + (v / 180) * 240) * Math.PI) / 180;
      const mk = (tag, attrs, text) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (text != null) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      const a0 = ang(0), a1 = ang(180);
      mk("path", { d: `M ${gx + R * Math.sin(a0)} ${gy - R * Math.cos(a0)} A ${R} ${R} 0 1 1 ${gx + R * Math.sin(a1)} ${gy - R * Math.cos(a1)}`, fill: "none", stroke: "#26343B", "stroke-width": 10, "stroke-linecap": "round" });
      for (let v = 0; v <= 180; v += 10) {
        const a = ang(v), major = v % 20 === 0, r1t = R - (major ? 36 : 24), r2t = R - 10;
        mk("line", { x1: gx + r1t * Math.sin(a), y1: gy - r1t * Math.cos(a), x2: gx + r2t * Math.sin(a), y2: gy - r2t * Math.cos(a), stroke: "#93A4A7", "stroke-width": major ? 6 : 3.5, "stroke-linecap": "round" });
        if (major) mk("text", { x: gx + (R - 68) * Math.sin(a), y: gy - (R - 68) * Math.cos(a) + 10, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 28, "font-weight": 600, fill: "#E8EEEC" }, v);
      }
      mk("text", { id: "f07-readout", x: gx, y: gy + 112, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 76, "font-weight": 700, fill: "#F4A62A" }, "60");
      mk("text", { x: gx, y: gy + 150, "text-anchor": "middle", "font-family": "Space Grotesk, Inter, sans-serif", "font-size": 28, "font-weight": 600, fill: "#93A4A7" }, "km/h");
      const needle = mk("g", { id: "f07-needle" });
      needle.innerHTML = `<path d="M ${gx - 7} ${gy} L ${gx} ${gy - R + 52} L ${gx + 7} ${gy} Z" fill="#F4A62A"/><circle cx="${gx}" cy="${gy}" r="18" fill="#F4A62A"/><circle cx="${gx}" cy="${gy}" r="7" fill="#0D1316"/>`;
      
      const D = 5.854, E = "power3.out";
      const tl = gsap.timeline({ paused: true });
      const rise = (sel, at, dy = 24, dur = 0.55) => tl.fromTo(sel, { opacity: 0, y: dy }, { opacity: 1, y: 0, duration: dur, ease: E }, at);
      tl.fromTo("#f07-progress", { width: "60%" }, { width: "70%", duration: D, ease: "none" }, 0);
      tl.fromTo("#f07-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: E }, 0.05);
      rise("#f07-h2a", 0.12);
      tl.fromTo("#f07-h2b", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: E }, 4.55);
      // the car drives in and stops at its mark, wheels turning with it
      tl.fromTo("#f07-car", { x: -980 }, { x: 0, duration: 1.7, ease: "power2.out" }, 0);
      tl.fromTo(["#f07-rim-r", "#f07-rim-f"], { rotation: -900, transformOrigin: "50% 50%" }, { rotation: 0, duration: 1.7, ease: "power2.out" }, 0);
      rise("#f07-tag", 1.15, 16, 0.45);
      tl.fromTo("#f07-gauge", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: E }, 1.9);
      tl.fromTo(needle, { rotation: -120, svgOrigin: "210 210" }, { rotation: -40, svgOrigin: "210 210", duration: 1.0, ease: E }, 2.3);
      const readout = document.getElementById("f07-readout"), rv = { v: 0 };
      tl.fromTo(rv, { v: 0 }, { v: 60, duration: 1.0, ease: E, onUpdate: () => { readout.textContent = Math.round(rv.v); } }, 2.3);
      tl.fromTo("#f07-cop", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 0.5);
      tl.fromTo("#f07-beam", { opacity: 0, scaleX: 0, transformOrigin: "100% 50%" }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.out" }, 4.4);
      tl.fromTo("#f07-radar", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.4, ease: E }, 4.45);
      const radar = document.getElementById("f07-radar-v"), dv = { v: 0 };
      tl.fromTo(dv, { v: 0 }, { v: 70, duration: 0.5, ease: "power2.out", immediateRender: false, onUpdate: () => { radar.textContent = Math.round(dv.v); } }, 4.5);
      window.__timelines["07-karim"] = tl;
    })();
  </script>
