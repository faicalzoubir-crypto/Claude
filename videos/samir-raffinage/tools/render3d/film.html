<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';


start();
function start() {
const STREAM_COLORS = { crude: '#C98B5A', gas: '#6FB6E8', naphtha: '#F5D65B', kero: '#B99CF0', diesel: '#93CDBB', heavy: '#D9736B', h2: '#F29BC0', h2s: '#C6E04A', product: '#E8EEEC' };

const vp = document.getElementById('viewport');
const canvas = document.getElementById('gl');
const labelsEl = document.getElementById('labels');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
const small = Math.min(innerWidth, innerHeight) < 700;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, small ? 1.5 : 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 2, 9000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.46; controls.minDistance = 25; controls.maxDistance = 1500;
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.9;

// deterministic random
let seed = 20150801;
const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- materials ----------
const stdMats = [];
function std(color, metalness, roughness, extra = {}) {
  const m = new THREE.MeshStandardMaterial({ color, metalness, roughness, ...extra });
  stdMats.push(m); return m;
}
const M = {
  steel: std(0x7d898e, 0.55, 0.5), steelDark: std(0x4a5458, 0.5, 0.6), insul: std(0xc4cbcd, 0.7, 0.32),
  white: std(0xe2e6e5, 0.05, 0.5), whiteDS: std(0xe2e6e5, 0.05, 0.5, { side: THREE.DoubleSide }),
  concrete: std(0x6e706d, 0, 0.95), padDark: std(0x4c4f4d, 0, 0.95), asphalt: std(0x26292b, 0, 0.92),
  ground: std(0x3f3e37, 0, 1), plot: std(0x4f4e46, 0, 1), far: std(0x34352f, 0, 1),
  grating: std(0x3a4347, 0.4, 0.7), yellow: std(0xc9a227, 0.25, 0.55), red: std(0xb3302a, 0.1, 0.6),
  heater: std(0x8a9295, 0.45, 0.55), reactor: std(0x59646a, 0.7, 0.38), stackGrey: std(0x9b9d98, 0, 0.85),
  roof: std(0xc39d48, 0.25, 0.6), wall: std(0xb2ac9d, 0, 0.85), tankDark: std(0x2d3133, 0.2, 0.7),
  roofDeck: std(0x5b6366, 0.5, 0.6), hull: std(0x2c3a42, 0.35, 0.6), deck: std(0x5d3a30, 0.1, 0.8),
  rock: std(0x393c3b, 0, 1), sulfur: std(0xd9cf3c, 0, 0.8), cab: std(0xd8dcdc, 0.2, 0.5)
};
const lampMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(4.2, 3.3, 2.1) });
const redMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(6, 0.35, 0.2) });
const cityMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(3.4, 2.6, 1.6) });
const fireMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(5, 1.6, 0.3) });
const windowMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.8, 1.4, 0.85) });

// ---------- geometry helpers ----------
const BX = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const CY = (rt, rb, h, s = 20, open = false) => new THREE.CylinderGeometry(rt, rb, h, s, 1, open);
const SP = (r, ws = 24, hs = 16) => new THREE.SphereGeometry(r, ws, hs);
const HE = (r, s = 24) => new THREE.SphereGeometry(r, s, 8, 0, Math.PI * 2, 0, Math.PI / 2);
const TO = (R, t, s = 32) => new THREE.TorusGeometry(R, t, 4, s);
function add(g, geo, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz); m.scale.set(sx, sy, sz);
  g.add(m); return m;
}
const UP = V(0, 1, 0);
function strut(g, a, b, t, mat, round = true) {
  const len = a.distanceTo(b); if (len < 0.01) return null;
  const m = new THREE.Mesh(round ? CY(t, t, len, 8) : BX(t, len, t), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, b.clone().sub(a).normalize());
  g.add(m); return m;
}
const lampPts = [], redPts = [], cityPts = [];
const lamp = (x, y, z) => lampPts.push(x, y, z);
const redLamp = (x, y, z) => redPts.push(x, y, z);

const groups = {};
function unit(id) { const g = new THREE.Group(); g.userData.unitId = id; scene.add(g); groups[id] = g; return g; }
const decor = new THREE.Group(); scene.add(decor);

// ---------- equipment builders ----------
function vessel(g, o) {
  const { x, z, r, h, y0 = 0, mat = M.insul, skirt = 2, plat = 0, ladder = true, lamps = true } = o;
  const base = y0 + skirt;
  if (skirt > 0) add(g, CY(r * 0.94, r * 0.98, skirt, 20), M.steelDark, x, y0 + skirt / 2, z);
  add(g, CY(r, r, h, 28), mat, x, base + h / 2, z);
  add(g, HE(r, 28), mat, x, base + h, z, 0, 0, 0, 1, 0.5, 1);
  if (skirt === 0) add(g, HE(r, 28), mat, x, base, z, Math.PI, 0, 0, 1, 0.5, 1);
  if (plat > 0) {
    let k = 0;
    for (let y = base + plat; y < base + h - 1; y += plat, k++) {
      add(g, CY(r + 1.6, r + 1.6, 0.25, 28), M.grating, x, y, z);
      add(g, TO(r + 1.55, 0.06, 32), M.yellow, x, y + 1.1, z, Math.PI / 2);
      if (lamps) for (let i = 0; i < 3; i++) { const a = i * 2.094 + k * 0.7; lamp(x + Math.cos(a) * (r + 1.3), y + 2.3, z + Math.sin(a) * (r + 1.3)); }
    }
  }
  if (ladder && h > 9) add(g, BX(0.9, h + skirt - 1, 0.9), M.yellow, x + r + 0.75, y0 + (h + skirt) / 2, z + 0.4);
  if (lamps) lamp(x, base + h + r * 0.5 + 0.8, z);
  return base + h + r * 0.5;
}

function frame(g, o) {
  const { x, z, w, d, h, levels = 3, floors = true, brace = true, lamps = true } = o;
  const nx = Math.max(1, Math.round(w / 7)), nz = Math.max(1, Math.round(d / 7));
  const xs = [], zs = [];
  for (let i = 0; i <= nx; i++) xs.push(x - w / 2 + (i * w) / nx);
  for (let j = 0; j <= nz; j++) zs.push(z - d / 2 + (j * d) / nz);
  for (let i = 0; i <= nx; i++) for (let j = 0; j <= nz; j++) {
    if (i === 0 || i === nx || j === 0 || j === nz) add(g, BX(0.5, h, 0.5), M.steel, xs[i], h / 2, zs[j]);
  }
  for (let L = 1; L <= levels; L++) {
    const y = (h * L) / levels, y0 = (h * (L - 1)) / levels;
    add(g, BX(w, 0.4, 0.35), M.steel, x, y, zs[0]); add(g, BX(w, 0.4, 0.35), M.steel, x, y, zs[nz]);
    add(g, BX(0.35, 0.4, d), M.steel, xs[0], y, z); add(g, BX(0.35, 0.4, d), M.steel, xs[nx], y, z);
    if (floors) add(g, BX(w, 0.14, d), M.grating, x, y - 0.25, z);
    add(g, BX(w, 0.08, 0.08), M.yellow, x, y + 1.1, zs[0]); add(g, BX(w, 0.08, 0.08), M.yellow, x, y + 1.1, zs[nz]);
    add(g, BX(0.08, 0.08, d), M.yellow, xs[0], y + 1.1, z); add(g, BX(0.08, 0.08, d), M.yellow, xs[nx], y + 1.1, z);
    if (lamps) {
      lamp(xs[0], y + 2.2, zs[nz]); lamp(xs[nx], y + 2.2, zs[nz]); lamp(xs[nx], y + 2.2, zs[0]);
      if (w > 12) lamp(x, y + 2.2, zs[nz]);
    }
    if (brace) {
      strut(g, V(xs[0], y0, zs[0]), V(xs[1], y, zs[0]), 0.18, M.steel);
      strut(g, V(xs[nx], y0, zs[0]), V(xs[nx], y, zs[1]), 0.18, M.steel);
    }
  }
}

function airCooler(g, { x, z, w, d, y }) {
  add(g, BX(w, 1.6, d), M.steelDark, x, y + 0.8, z);
  const nf = Math.max(1, Math.round(w / 4.5));
  for (let i = 0; i < nf; i++) {
    const fx = x - w / 2 + (w / nf) * (i + 0.5);
    add(g, CY(1.5, 1.5, 0.7, 18), M.steel, fx, y + 1.95, z - d / 4);
    add(g, CY(1.5, 1.5, 0.7, 18), M.steel, fx, y + 1.95, z + d / 4);
  }
  lamp(x - w / 2, y + 2.8, z + d / 2); lamp(x + w / 2, y + 2.8, z + d / 2);
}

function rack(g, o) {
  const { a, b, w = 9, tiers = [6, 9.5], spacing = 7, duct = false } = o;
  const [ax, az] = a, [bx, bz] = b;
  const alongX = Math.abs(bx - ax) >= Math.abs(bz - az);
  const L = alongX ? Math.abs(bx - ax) : Math.abs(bz - az);
  const n = Math.max(1, Math.round(L / spacing));
  const top = tiers[tiers.length - 1];
  const px = alongX ? 0 : w / 2, pz = alongX ? w / 2 : 0;
  for (let i = 0; i <= n; i++) {
    const t = i / n, cx = ax + (bx - ax) * t, cz = az + (bz - az) * t;
    add(g, BX(0.5, top, 0.5), M.steel, cx - px, top / 2, cz - pz);
    add(g, BX(0.5, top, 0.5), M.steel, cx + px, top / 2, cz + pz);
    for (const ty of tiers) add(g, alongX ? BX(0.4, 0.45, w + 0.6) : BX(w + 0.6, 0.45, 0.4), M.steel, cx, ty, cz);
    if (i % 2 === 0) lamp(cx + px, top + 1.6, cz + pz);
  }
  const mx = (ax + bx) / 2, mz = (az + bz) / 2;
  const radii = [0.32, 0.5, 0.28, 0.62, 0.38, 0.45, 0.3];
  const mats = [M.steel, M.insul, M.steelDark, M.insul, M.steel, M.steelDark, M.insul];
  tiers.forEach((ty, k) => {
    let off = -w / 2 + 0.6;
    for (let p = 0; p < 8; p++) {
      const r = radii[(p + k * 3) % radii.length];
      if (off + 2 * r > w / 2 - 0.4) break;
      const c = off + r;
      const geo = CY(r, r, L, 10);
      const mat = mats[(p + k) % mats.length];
      if (alongX) add(g, geo, mat, mx, ty + 0.25 + r, mz + c, 0, 0, Math.PI / 2);
      else add(g, geo, mat, mx + c, ty + 0.25 + r, mz, Math.PI / 2, 0, 0);
      off = c + r + 0.35;
    }
  });
  if (duct) {
    if (alongX) add(g, CY(1.25, 1.25, L * 0.92, 20), M.insul, mx, top + 1.6, mz - w / 4, 0, 0, Math.PI / 2);
    else add(g, CY(1.25, 1.25, L * 0.92, 20), M.insul, mx - w / 4, top + 1.6, mz, Math.PI / 2, 0, 0);
  }
}

function tank(g, o) {
  const { x, z, r, h, mat = M.white, roof = 'cone', a0 = 0.8 } = o;
  add(g, CY(r + 0.8, r + 1.0, 0.6, 36), M.concrete, x, 0.3, z);
  if (roof === 'float') {
    add(g, CY(r, r, h, 48, true), M.whiteDS, x, 0.6 + h / 2, z);
    add(g, CY(r - 0.2, r - 0.2, 0.4, 48), M.roofDeck, x, 0.6 + h - 1.8, z);
    add(g, TO(r + 0.12, 0.25, 48), mat, x, 0.6 + h - 0.15, z, Math.PI / 2);
  } else {
    add(g, CY(r, r, h, 48), mat, x, 0.6 + h / 2, z);
    add(g, CY(1.0, r + 0.15, r * 0.17, 48), mat, x, 0.6 + h + r * 0.085, z);
  }
  const rr = r + 0.7, nseg = 6;
  for (let i = 0; i < nseg; i++) {
    const t0 = i / nseg, t1 = (i + 1) / nseg;
    strut(g, V(x + Math.cos(a0 + t0 * 1.6) * rr, 0.6 + t0 * h, z + Math.sin(a0 + t0 * 1.6) * rr),
             V(x + Math.cos(a0 + t1 * 1.6) * rr, 0.6 + t1 * h, z + Math.sin(a0 + t1 * 1.6) * rr), 0.45, M.yellow);
  }
  lamp(x + Math.cos(a0 + 1.6) * (r - 0.6), h + 2.4, z + Math.sin(a0 + 1.6) * (r - 0.6));
  lamp(x - Math.cos(a0) * (r - 0.6), h + 2.4, z - Math.sin(a0) * (r - 0.6));
}

function bund(g, x1, z1, x2, z2, hh = 1.6) {
  add(g, BX(x2 - x1, hh, 0.7), M.concrete, (x1 + x2) / 2, hh / 2, z1);
  add(g, BX(x2 - x1, hh, 0.7), M.concrete, (x1 + x2) / 2, hh / 2, z2);
  add(g, BX(0.7, hh, z2 - z1), M.concrete, x1, hh / 2, (z1 + z2) / 2);
  add(g, BX(0.7, hh, z2 - z1), M.concrete, x2, hh / 2, (z1 + z2) / 2);
  add(g, BX(x2 - x1, 0.06, z2 - z1), M.padDark, (x1 + x2) / 2, 0.04, (z1 + z2) / 2);
}

function sphereTank(g, { x, z, r }) {
  const cy = r + 4;
  add(g, SP(r, 36, 24), M.white, x, cy, z);
  add(g, TO(r + 0.06, 0.28, 48), M.white, x, cy, z, Math.PI / 2);
  for (let k = 0; k < 8; k++) {
    const a = (k * Math.PI) / 4;
    add(g, CY(0.45, 0.5, cy, 10), M.steel, x + Math.cos(a) * r * 0.97, cy / 2, z + Math.sin(a) * r * 0.97);
  }
  add(g, CY(2.6, 2.6, 0.25, 18), M.grating, x, cy + r + 0.1, z);
  add(g, TO(2.6, 0.06, 24), M.yellow, x, cy + r + 1.2, z, Math.PI / 2);
  lamp(x, cy + r + 2.6, z);
  for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + 0.4; lamp(x + Math.cos(a) * (r + 0.8), cy + 0.8, z + Math.sin(a) * (r + 0.8)); }
}

function heater(g, o) {
  const { x, z, w, d, h, stackH = 0 } = o;
  add(g, BX(w + 4, 0.15, d + 4), M.concrete, x, 0.08, z);
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) add(g, BX(0.6, 3, 0.6), M.steelDark, x + sx * (w / 2 - 0.5), 1.5, z + sz * (d / 2 - 0.5));
  add(g, BX(w, h, d), M.heater, x, 3 + h / 2, z);
  add(g, BX(w - 1.2, 0.2, d - 1.2), fireMat, x, 2.9, z);
  const nw = Math.max(2, Math.floor(w / 4));
  for (let i = 0; i < nw; i++) {
    const wx = x - w / 2 + (w / nw) * (i + 0.5);
    add(g, BX(0.7, 0.5, 0.1), fireMat, wx, 4.6, z + d / 2 + 0.06);
    add(g, BX(0.7, 0.5, 0.1), fireMat, wx, 4.6, z - d / 2 - 0.06);
  }
  const ch = h * 0.42;
  add(g, BX(w * 0.5, ch, d * 0.62), M.heater, x, 3 + h + ch / 2, z);
  add(g, BX(w + 2, 0.18, d + 2), M.grating, x, 3 + h * 0.55, z);
  add(g, BX(w + 2, 0.08, 0.08), M.yellow, x, 3 + h * 0.55 + 1.1, z + d / 2 + 1);
  add(g, BX(w + 2, 0.08, 0.08), M.yellow, x, 3 + h * 0.55 + 1.1, z - d / 2 - 1);
  lamp(x - w / 2 - 1, 3 + h * 0.55 + 2.2, z + d / 2 + 1); lamp(x + w / 2 + 1, 3 + h * 0.55 + 2.2, z + d / 2 + 1);
  lamp(x + w / 2 + 1, 3 + h * 0.55 + 2.2, z - d / 2 - 1);
  if (stackH > 0) {
    const sy = 3 + h + ch;
    add(g, CY(1.0, 1.35, stackH, 16), M.steelDark, x, sy + stackH / 2, z);
    redLamp(x + 1.1, sy + stackH - 0.5, z);
  }
}

function hdrum(g, o) {
  const { x, y, z, r, len, axis = 'x', mat = M.white } = o;
  if (axis === 'x') {
    add(g, CY(r, r, len, 24), mat, x, y, z, 0, 0, Math.PI / 2);
    add(g, SP(r, 20, 12), mat, x - len / 2, y, z, 0, 0, 0, 0.5, 1, 1);
    add(g, SP(r, 20, 12), mat, x + len / 2, y, z, 0, 0, 0, 0.5, 1, 1);
    for (const s of [-0.3, 0.3]) add(g, BX(1, y, r * 1.5), M.concrete, x + len * s, y / 2, z);
  } else {
    add(g, CY(r, r, len, 24), mat, x, y, z, Math.PI / 2, 0, 0);
    add(g, SP(r, 20, 12), mat, x, y, z - len / 2, 0, 0, 0, 1, 1, 0.5);
    add(g, SP(r, 20, 12), mat, x, y, z + len / 2, 0, 0, 0, 1, 1, 0.5);
    for (const s of [-0.3, 0.3]) add(g, BX(r * 1.5, y, 1), M.concrete, x, y / 2, z + len * s);
  }
}

function building(g, o) {
  const { x, z, w, d, h, roof = 'flat', wall = M.wall, roofMat = M.roof, windows = true, rh = 3 } = o;
  add(g, BX(w, h, d), wall, x, h / 2, z);
  if (roof === 'gable') {
    const sh = new THREE.Shape();
    sh.moveTo(-d / 2 - 0.5, 0); sh.lineTo(d / 2 + 0.5, 0); sh.lineTo(0, rh); sh.closePath();
    const geo = new THREE.ExtrudeGeometry(sh, { depth: w + 1, bevelEnabled: false });
    geo.translate(0, 0, -(w + 1) / 2);
    add(g, geo, roofMat, x, h, z, 0, Math.PI / 2, 0);
  } else add(g, BX(w + 0.4, 0.5, d + 0.4), M.concrete, x, h + 0.25, z);
  if (windows) {
    const nwin = Math.floor((w - 2) / 4);
    for (let i = 0; i < nwin; i++) {
      const wx = x - w / 2 + 3 + i * 4;
      add(g, BX(2.4, 1.3, 0.12), windowMat, wx, Math.min(h * 0.6, 4.5), z + d / 2 + 0.06);
      add(g, BX(2.4, 1.3, 0.12), windowMat, wx, Math.min(h * 0.6, 4.5), z - d / 2 - 0.06);
    }
  }
  lamp(x - w / 2, h + 0.8, z + d / 2 + 0.6); lamp(x + w / 2, h + 0.8, z + d / 2 + 0.6);
}

function truck(g, x, z, ry = 0) {
  const t = new THREE.Group();
  add(t, BX(2.6, 1.0, 14), M.steelDark, 0, 1.1, 0);
  add(t, CY(1.25, 1.25, 10, 16), M.white, 0, 2.6, -1.8, Math.PI / 2);
  add(t, BX(2.6, 2.8, 2.6), M.cab, 0, 2.4, 5.7);
  t.position.set(x, 0, z); t.rotation.y = ry;
  g.add(t);
}

function streetLamp(g, x, z) {
  add(g, CY(0.14, 0.2, 10, 6), M.steelDark, x, 5, z);
  lamp(x, 10.2, z);
}

function tanker(g, { x, z, len = 150, beam = 24 }) {
  const hl = len / 2, hb = beam / 2;
  const sh = new THREE.Shape();
  sh.moveTo(-hl, -hb); sh.lineTo(hl - 24, -hb);
  sh.quadraticCurveTo(hl + 2, -hb * 0.7, hl + 5, 0);
  sh.quadraticCurveTo(hl + 2, hb * 0.7, hl - 24, hb);
  sh.lineTo(-hl, hb); sh.lineTo(-hl, -hb);
  const hull = new THREE.ExtrudeGeometry(sh, { depth: 14, bevelEnabled: false, curveSegments: 10 });
  hull.rotateX(-Math.PI / 2);
  add(g, hull, M.hull, x, -6, z);
  add(g, BX(len - 4, 0.4, beam - 1.2), M.deck, x + 1, 8.2, z);
  const sx = x - hl + 9;
  add(g, BX(13, 13, beam - 3), M.white, sx, 8 + 6.5, z);

// ---------- bake: merge each group by material ----------
const KEEP = ['position', 'normal', 'uv'];
function bake(group, cloneMats) {
  group.updateMatrixWorld(true);
  const buckets = new Map();
  const meshes = [];
  group.traverse((o) => { if (o.isMesh) meshes.push(o); });
  for (const o of meshes) {
    let geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const k of Object.keys(geo.attributes)) if (!KEEP.includes(k)) geo.deleteAttribute(k);
    if (!geo.attributes.uv) geo.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(geo.attributes.position.count * 2), 2));
    geo.clearGroups();
    geo.applyMatrix4(o.matrixWorld);
    o.geometry.dispose();
    const key = o.material.uuid;
    if (!buckets.has(key)) buckets.set(key, { mat: o.material, geos: [] });
    buckets.get(key).geos.push(geo);
  }
  group.clear();
  const out = [];
  for (const { mat, geos } of buckets.values()) {
    const merged = mergeGeometries(geos, false);
    geos.forEach((gg) => gg.dispose());
    let m = mat;
    if (cloneMats && mat.isMeshStandardMaterial) { m = mat.clone(); stdMats.push(m); }
    const mesh = new THREE.Mesh(merged, m);
    mesh.userData.unitId = group.userData.unitId;
    group.add(mesh); out.push(mesh);
  }
  return out;
}

const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: small ? 2 : 4 });

const LANE = { crude: -4.2, gas: -3, naphtha: -1.8, kero: -0.6, diesel: 0.6, heavy: 1.8, h2: 3, h2s: 4.2, product: 0 };

  hdtInN: [12, 10, -23], hdtInD: [14.5, 10, -23], hdtOutN: [21.5, 10, -23], hdtOutD: [24, 10, -23], hdtH2S: [26.6, 10, -23], hdtH2: [9, 10, -23],

  hcuIn: [100, 8, -46.8], hcuDiesel: [126, 20, -42.4], hcuKero: [126, 32, -42.4], hcuH2S: [117, 4.2, -38],
  h2Out: [140, 8, 30], sruIn: [145, 5, -44], lpgIn: [55, 13, 55],

};
const FLOWS = [
  { type: 'crude', units: ['jetty', 'crude'], pts: [P.tanker, [-195, 9.5, -246], [-195, 4.5, -246], P.crudeTank] },

  { type: 'kero', units: ['hcu', 'products'], pts: via(P.hcuKero, P.tKero, 'kero').map((p, i) => (i > 0 && i < 5 ? [p[0], p[1] + 2, p[2]] : p)) },
  { type: 'h2s', units: ['hcu', 'sru'], pts: [P.hcuH2S, [117, 4.2, -44], P.sruIn] },

const dashCanvas = (() => {
  const c = document.createElement('canvas'); c.width = 128; c.height = 4; const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 128, 0);

  x.fillStyle = gr; x.fillRect(0, 0, 128, 4); return c;
})();
const flows = FLOWS.map((f) => {

// ---------- film: light modes, shots, frame(t) ----------
MODES.off = { ...MODES.dusk, warmI: 0, emissiveI: 0, lamp: [0, 0, 0], win: [0.5, 0.42, 0.3], bloom: 0.6, flareI: 0 };
function applyMode(name) {

  skyU.top.value.set(m.top); skyU.horizon.value.set(m.horizon); skyU.bottom.value.set(m.bottom); skyU.glow.value.set(m.glow); skyU.sunDir.value.set(...m.sunDir).normalize();

  windowMat.color.setRGB(...m.win);

const W = 1080, H = 1920;
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
composer.setSize(W, H);
camera.aspect = W / H;

const smoother = (x) => x * x * x * (x * (x * 6 - 15) + 10);
let SHOT = null;
function setShot(name) {
  SHOT = window.SHOTS[name];
  camera.fov = SHOT.fov || 50; camera.updateProjectionMatrix();
  applyMode(SHOT.mode || 'dusk');
  if (SHOT.emphasize) flows.forEach((f) => { f.mat.opacity = SHOT.emphasize.some((u) => f.units.includes(u)) ? 1 : 0.18; });
}
function camAt(t) {
  const K = SHOT.keys;
  if (t <= K[0][0]) return [V(...K[0][1]), V(...K[0][2])];
  for (let i = 0; i < K.length - 1; i++) {
    const [t0, p0, q0] = K[i], [t1, p1, q1] = K[i + 1];
    if (t <= t1) {
      const k = smoother((t - t0) / (t1 - t0));
      return [V(...p0).lerp(V(...p1), k), V(...q0).lerp(V(...q1), k)];
    }
  }
  const L = K[K.length - 1];
  return [V(...L[1]), V(...L[2])];
}
const tmpP = V();
function filmFrame(t) {

  camera.position.copy(p); camera.lookAt(q); camera.updateMatrixWorld();

  seaMat.normalMap.offset.set(T * 0.0035, T * 0.005);
  const fl = 1 + 0.22 * Math.sin(T * 9.3) + 0.12 * Math.sin(T * 23.1);
  flameOuter.scale.set(1, fl, 1); flameInner.scale.set(1, 0.9 + 0.3 * Math.sin(T * 13.7 + 1), 1);
  flame.rotation.z = 0.12 * Math.sin(T * 1.3); flameGlow.material.opacity = 0.75 + 0.2 * Math.sin(T * 7);
  flareLight.intensity = mode.flareI * (0.85 + 0.15 * Math.sin(T * 11));
  for (const f of flows) f.tex.offset.x = -0.55 * T;
  composer.render();
  const anchors = {};
  for (const [k, xyz] of Object.entries(SHOT.anchors || {})) {
    tmpP.set(...xyz).project(camera);
    anchors[k] = [Math.round((tmpP.x * 0.5 + 0.5) * W * 10) / 10, Math.round((-tmpP.y * 0.5 + 0.5) * H * 10) / 10, tmpP.z < 1 ? 1 : 0];
  }
  return { jpeg: canvas.toDataURL('image/jpeg', 0.93), anchors };
}
window.FILM = { setShot, frame: filmFrame, ready: true };

}
