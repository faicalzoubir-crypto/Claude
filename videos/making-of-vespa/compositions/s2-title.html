<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0d1316;
          font-family: "Montserrat", sans-serif;
          color: #e8eeec;
        }
        #s2-grid {
          position: absolute;
          left: -120px;
          top: -120px;
          width: 1320px;
          height: 2160px;
          background-image:
            linear-gradient(to right, rgba(38, 52, 59, 0.5) 2px, transparent 2px),
            linear-gradient(to bottom, rgba(38, 52, 59, 0.5) 2px, transparent 2px);
          background-size: 60px 60px;
        }
        #s2-glow {
          position: absolute;
          left: -260px;
          top: 360px;
          width: 1200px;
          height: 1200px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(244, 166, 42, 0.14) 0%, rgba(244, 166, 42, 0.04) 40%, rgba(13, 19, 22, 0) 66%);
        }
        #s2-label {
          position: absolute;
          left: 96px;
          top: 640px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 32px;
          letter-spacing: 0.16em;
          color: #f4a62a;
        }
        #s2-title {
          position: absolute;
          left: 96px;
          top: 720px;
          width: 900px;
        }
        .s2-line {
          display: block;
          font-weight: 900;
          font-size: 132px;
          line-height: 1.02;
          letter-spacing: -0.035em;
        }
        .s2-line.accent {
          color: #f4a62a;
        }
        #s2-rule {
          position: absolute;
          left: 96px;
          top: 1286px;
          width: 420px;
          height: 8px;
          background: #f4a62a;
          transform-origin: left center;
        }
        #s2-sub {
          position: absolute;
          left: 96px;
          top: 1336px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 400;
          font-size: 32px;
          letter-spacing: 0.08em;
          color: #93a4a7;
        }
      </style>

      <div id="root" data-composition-id="s2-title" data-width="1080" data-height="1920">
        <div id="s2-grid" data-layout-allow-overflow></div>
        <div id="s2-glow" data-layout-allow-overflow></div>
        <div id="s2-label">MAKING-OF</div>
        <div id="s2-title">
          <span class="s2-line" id="s2-l1">Comment</span>
          <span class="s2-line" id="s2-l2">j'ai fait</span>
          <span class="s2-line accent" id="s2-l3">cette vidéo</span>
        </div>
        <div id="s2-rule"></div>
        <div id="s2-sub">GLISSADE VESPA · ASR</div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s2-grid", { x: 0, y: 0 }, { x: -40, y: -20, duration: 1.6, ease: "none" }, 0);
          tl.fromTo("#s2-glow", { scale: 0.9, opacity: 0.6 }, { scale: 1.04, opacity: 1, duration: 1.6, ease: "sine.out" }, 0);
          tl.fromTo("#s2-label", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.05);
          ["#s2-l1", "#s2-l2", "#s2-l3"].forEach((id, k) => {
            tl.fromTo(id, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.1 + k * 0.1);
          });
          tl.fromTo("#s2-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, 0.45);
          tl.fromTo("#s2-sub", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.6);
          window.__timelines["s2-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
