<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0d1316;
          font-family: "Montserrat", sans-serif;
          color: #e8eeec;
        }
        #s8-stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .s8-clip {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          object-fit: cover;
        }
        #s8-segs {
          position: absolute;
          left: 60px;
          top: 64px;
          width: 960px;
          display: flex;
          gap: 12px;
        }
        .s8-seg {
          position: relative;
          flex: 1;
          height: 8px;
          border-radius: 4px;
          background: rgba(232, 238, 236, 0.28);
          overflow: hidden;
        }
        .s8-seg i {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 8px;
          background: #f4a62a;
          transform-origin: left center;
        }
        #s8-tag {
          position: absolute;
          left: 60px;
          top: 1660px;
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 18px 28px;
          border-radius: 16px;
          background: rgba(13, 19, 22, 0.86);
          border: 2px solid #26343b;
        }
        #s8-tag b {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 34px;
          letter-spacing: 0.14em;
          color: #f4a62a;
        }
        #s8-tag span {
          font-family: "IBM Plex Mono", monospace;
          font-size: 26px;
          color: #93a4a7;
        }
      </style>

      <div id="root" data-composition-id="s8-result" data-width="1080" data-height="1920">
        <div id="s8-stage">
          <!-- highlights of the finished film; only the footage keeps its own (low) sound,
               the other clips' audio is the film's music, already playing as the bed -->
          <video id="s8-v0" class="s8-clip" data-hf-media-start-basis="local" src="assets/clips/m1-footage.mp4" playsinline data-has-audio="true" data-volume="0.35" data-start="0" data-duration="1.12" data-track-index="11"></video>
          <video id="s8-v1" class="s8-clip" data-hf-media-start-basis="local" src="assets/clips/m2-earth.mp4" muted playsinline data-start="1.12" data-duration="1.12" data-track-index="12"></video>
          <video id="s8-v2" class="s8-clip" data-hf-media-start-basis="local" src="assets/clips/m3-dash.mp4" muted playsinline data-start="2.24" data-duration="1.12" data-track-index="13"></video>
          <video id="s8-v3" class="s8-clip" data-hf-media-start-basis="local" src="assets/clips/m4-3d.mp4" muted playsinline data-start="3.36" data-duration="1.12" data-track-index="14"></video>
          <video id="s8-v4" class="s8-clip" data-hf-media-start-basis="local" src="assets/clips/m5-summary.mp4" muted playsinline data-start="4.48" data-duration="1.12" data-track-index="15"></video>
        </div>
        <div id="s8-segs"><span class="s8-seg"><i id="s8-f0"></i></span><span class="s8-seg"><i id="s8-f1"></i></span><span class="s8-seg"><i id="s8-f2"></i></span><span class="s8-seg"><i id="s8-f3"></i></span><span class="s8-seg"><i id="s8-f4"></i></span></div>
        <div id="s8-tag"><b>LE RÉSULTAT</b><span>final-video.mp4 · 64 s</span></div>
      </div>

      <script>
        (function () {
          const SHOT = 1.12;
          const tl = gsap.timeline({ paused: true });
          for (let k = 0; k < 5; k++) {
            // each cut lands with a small punch-in, the story bar fills with the shot
            tl.fromTo(`#s8-v${k}`, { scale: 1.08 }, { scale: 1, duration: 0.5, ease: "power3.out" }, k * SHOT);
            tl.fromTo(`#s8-f${k}`, { scaleX: 0 }, { scaleX: 1, duration: SHOT, ease: "none" }, k * SHOT);
          }
          tl.fromTo("#s8-segs", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);
          tl.fromTo("#s8-tag", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15);
          window.__timelines["s8-result"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
