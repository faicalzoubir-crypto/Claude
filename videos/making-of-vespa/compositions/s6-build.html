            [1, 0.9, null, 1.3],
            [2, 1.4, 1.75, 2.1],
            [3, 2.35, 2.7, 3.05],

          ROWS.forEach(([i, tin, tthumb, tok]) => {
            tl.fromTo(`#s6-r${i}`, { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, tin);
            if (tthumb !== null) {
              tl.fromTo(`#s6-t${i}`, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, tthumb);

            tl.to(`#s6-b${i}`, { opacity: 0, duration: 0.1 }, tok);
            tl.fromTo(`#s6-d${i}`, { opacity: 0 }, { opacity: 1, duration: 0.15 }, tok);
          });
