<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0d1316;
          font-family: "Montserrat", sans-serif;
          color: #e8eeec;
        }
        #s7-grid {
          position: absolute;
          left: -120px;
          top: -120px;
          width: 1320px;
          height: 2160px;
          background-image:
            linear-gradient(to right, rgba(38, 52, 59, 0.5) 2px, transparent 2px),
            linear-gradient(to bottom, rgba(38, 52, 59, 0.5) 2px, transparent 2px);
          background-size: 60px 60px;
        }
        #s7-glow {
          position: absolute;
          left: -100px;
          top: 820px;
          width: 1280px;
          height: 1200px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(244, 166, 42, 0.14) 0%, rgba(244, 166, 42, 0.04) 42%, rgba(13, 19, 22, 0) 68%);
        }
        #s7-step {
          position: absolute;
          left: 96px;
          top: 196px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 32px;
          letter-spacing: 0.16em;
          color: #f4a62a;
        }
        #s7-cap {
          position: absolute;
          left: 96px;
          top: 250px;
          width: 900px;
          font-weight: 800;
          font-size: 76px;
          line-height: 1.04;
          letter-spacing: -0.025em;
        }
        #s7-win {
          position: absolute;
          left: 50px;
          top: 420px;
          width: 980px;
          height: 400px;
          background: #090e10;
          border: 2px solid #26343b;
          border-radius: 26px;
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
          overflow: hidden;
        }
        #s7-bar {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 64px;
          background: #141d21;
          border-bottom: 2px solid #26343b;
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 0 24px;
        }
        .s7-dot {
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: #26343b;
        }
        #s7-title {
          margin-left: 12px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 22px;
          color: #93a4a7;
        }
        #s7-cmd {
          position: absolute;
          left: 30px;
          top: 94px;
          font-family: "IBM Plex Mono", monospace;
          font-size: 28px;
          white-space: pre;
        }
        #s7-cmd::before {
          content: "$ ";
          color: #f4a62a;
        }
        #s7-track {
          position: absolute;
          left: 30px;
          top: 176px;
          width: 920px;
          height: 26px;
          border-radius: 13px;
          background: #1a2429;
          overflow: hidden;
        }
        #s7-fill {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 26px;
          background: #f4a62a;
          transform-origin: left center;
        }
        #s7-pct {
          position: absolute;
          right: 30px;
          top: 222px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 40px;
          color: #f4a62a;
        }
        #s7-frames {
          position: absolute;
          left: 30px;
          top: 232px;
          font-family: "IBM Plex Mono", monospace;
          font-size: 24px;
          color: #93a4a7;
        }
        #s7-ok {
          position: absolute;
          left: 30px;
          top: 312px;
          font-family: "IBM Plex Mono", monospace;
          font-size: 28px;
          font-weight: 700;
          color: #7fd3a8;
        }
        #s7-ok::before {
          content: "";
          display: inline-block;
          width: 16px;
          height: 8px;
          margin: 0 18px 8px 4px;
          border-left: 4px solid #7fd3a8;
          border-bottom: 4px solid #7fd3a8;
          transform: rotate(-45deg);
        }
        #s7-file {
          position: absolute;
          left: 330px;
          top: 900px;
          width: 420px;
          height: 846px;
          background: #141d21;
          border: 2px solid #26343b;
          border-radius: 26px;
          box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
          overflow: hidden;
        }
        #s7-thumb {
          position: absolute;
          left: 20px;
          top: 20px;
          width: 380px;
          height: 676px;
          border-radius: 14px;
          object-fit: cover;
          display: block;
        }
        #s7-play {
          position: absolute;
          left: 160px;
          top: 308px;
          width: 100px;
          height: 100px;
          border-radius: 50%;
          background: rgba(13, 19, 22, 0.72);
          border: 3px solid #f4a62a;
        }
        #s7-play::after {
          content: "";
          position: absolute;
          left: 38px;
          top: 27px;
          width: 0;
          height: 0;
          border-left: 34px solid #f4a62a;
          border-top: 20px solid transparent;
          border-bottom: 20px solid transparent;
        }
        #s7-name {
          position: absolute;
          left: 24px;
          top: 718px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 32px;
          color: #e8eeec;
        }
        #s7-meta {
          position: absolute;
          left: 24px;
          top: 766px;
          font-family: "IBM Plex Mono", monospace;
          font-size: 24px;
          color: #93a4a7;
        }
      </style>

      <div id="root" data-composition-id="s7-render" data-width="1080" data-height="1920">
        <div id="s7-grid" data-layout-allow-overflow></div>
        <div id="s7-glow" data-layout-allow-overflow></div>
        <div id="s7-step">ÉTAPE 5</div>
        <div id="s7-cap">Le rendu</div>
        <div id="s7-win">
          <div id="s7-bar"><span class="s7-dot"></span><span class="s7-dot"></span><span class="s7-dot"></span><span id="s7-title">terminal — glissade-vespa</span></div>
          <div id="s7-cmd"></div>
          <div id="s7-track"><div id="s7-fill"></div></div>
          <div id="s7-frames">0 / 1920 images</div>
          <div id="s7-pct">0 %</div>
          <div id="s7-ok">final-video.mp4</div>
        </div>
        <div id="s7-file">
          <img id="s7-thumb" src="assets/thumbs/final-video.jpg" alt="" />
          <div id="s7-play"></div>
          <div id="s7-name">final-video.mp4</div>
          <div id="s7-meta">64 s · 1080×1920</div>
        </div>
      </div>

      <script>
        (function () {
          const CMD = "npx hyperframes render";
          const FRAMES = 1920; // 64 s at 30 fps
          const cmd = document.querySelector("#s7-cmd");
          const pct = document.querySelector("#s7-pct");
          const frames = document.querySelector("#s7-frames");

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s7-grid", { x: 0, y: 0 }, { x: -40, y: -20, duration: 2.6, ease: "none" }, 0);
          tl.fromTo("#s7-step", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.05);
          tl.fromTo("#s7-cap", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.12);
          tl.fromTo("#s7-win", { y: 60, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0.12);

          // the command types itself
          const typing = { n: 0 };
          tl.fromTo(
            typing,
            { n: 0 },
            {
              n: CMD.length,
              duration: 0.35,
              ease: "none",
              immediateRender: true,
              onUpdate: () => {
                cmd.textContent = CMD.slice(0, Math.round(typing.n));
              },
            },
            0.25
          );

          // progress 0 → 100 %, with the frame counter
          const prog = { p: 0 };
          tl.fromTo("#s7-fill", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power1.inOut" }, 0.65);
          tl.fromTo(
            prog,
            { p: 0 },
            {
              p: 1,
              duration: 1.0,
              ease: "power1.inOut",
              immediateRender: true,
              onUpdate: () => {
                pct.textContent = Math.round(prog.p * 100) + " %";
                frames.textContent = Math.round(prog.p * FRAMES) + " / " + FRAMES + " images";
              },
            },
            0.65
          );
          tl.fromTo("#s7-pct", { scale: 1 }, { scale: 1.14, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 1.65);
          tl.fromTo("#s7-ok", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, 1.7);

          // the finished file
          tl.fromTo("#s7-file", { y: 120, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 1.72);
          tl.fromTo("#s7-play", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, 2.05);
          tl.fromTo("#s7-glow", { opacity: 0.4, scale: 0.9 }, { opacity: 1, scale: 1.05, duration: 0.8, ease: "sine.out" }, 1.72);
          window.__timelines["s7-render"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
