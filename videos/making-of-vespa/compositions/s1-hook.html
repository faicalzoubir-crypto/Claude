<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0d1316;
        }
        #s1-frame {
          position: absolute;
          inset: 0;
        }
        #s1-frame video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #s1-scan {
          position: absolute;
          inset: 0;
          opacity: 0;
          background: repeating-linear-gradient(to bottom, rgba(232, 238, 236, 0.07) 0px, rgba(232, 238, 236, 0.07) 2px, rgba(13, 19, 22, 0) 2px, rgba(13, 19, 22, 0) 6px);
        }
        #s1-band {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 90px;
          opacity: 0;
          background: rgba(232, 238, 236, 0.18);
        }
        #s1-rew {
          position: absolute;
          left: 96px;
          top: 196px;
          display: flex;
          align-items: center;
          gap: 22px;
          opacity: 0;
        }
        #s1-rew svg {
          width: 96px;
          height: 60px;
          display: block;
        }
        #s1-rew-label {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 34px;
          letter-spacing: 0.16em;
          color: #f4a62a;
        }
        #s1-flash {
          position: absolute;
          inset: 0;
          background: #0d1316;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="s1-hook" data-width="1080" data-height="1920">
        <div id="s1-frame">
          <video id="s1-clip" data-hf-media-start-basis="local" src="assets/clips/hook-3d.mp4" playsinline data-has-audio="true" data-start="0" data-duration="2.25" data-track-index="1"></video>
          <video id="s1-rewind" data-hf-media-start-basis="local" src="assets/clips/rewind.mp4" muted playsinline data-start="2.2" data-duration="0.8" data-track-index="2"></video>
        </div>
        <div id="s1-scan"></div>
        <div id="s1-band"></div>
        <div id="s1-rew">
          <svg viewBox="0 0 96 60"><path d="M46 4 L6 30 L46 56 Z M90 4 L50 30 L90 56 Z" fill="#f4a62a" /></svg>
          <div id="s1-rew-label">REWIND</div>
        </div>
        <div id="s1-flash"></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // the striking 3D moment plays, then the whole film rewinds in under a second
          tl.fromTo("#s1-frame", { scale: 1.0 }, { scale: 1.06, duration: 2.2, ease: "none" }, 0);
          tl.set("#s1-scan", { opacity: 1 }, 2.2);
          tl.set("#s1-rew", { opacity: 1 }, 2.2);
          tl.fromTo("#s1-rew", { x: -30 }, { x: 0, duration: 0.18, ease: "power2.out" }, 2.2);
          tl.to("#s1-rew", { opacity: 0.35, duration: 0.12, yoyo: true, repeat: 3, ease: "none" }, 2.4);
          tl.fromTo("#s1-band", { y: 1920, opacity: 1 }, { y: -120, opacity: 1, duration: 0.34, ease: "none" }, 2.22);
          tl.fromTo("#s1-band", { y: 1920, opacity: 1 }, { y: -120, opacity: 1, duration: 0.34, ease: "none", immediateRender: false }, 2.6);
          [2.2, 2.32, 2.44, 2.56, 2.68, 2.8].forEach((t, i) => {
            tl.set("#s1-frame", { x: i % 2 ? -10 : 8, scale: 1.06 + (i % 3) * 0.01 }, t);
          });
          tl.set("#s1-frame", { x: 0 }, 2.92);
          tl.to("#s1-flash", { opacity: 1, duration: 0.16, ease: "power2.in" }, 2.84);
          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
