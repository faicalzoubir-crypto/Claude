<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0d1316;
          font-family: "Montserrat", sans-serif;
          color: #e8eeec;
        }
        #s5-grid {
          position: absolute;
          left: -120px;
          top: -120px;
          width: 1320px;
          height: 2160px;
          background-image:
            linear-gradient(to right, rgba(38, 52, 59, 0.5) 2px, transparent 2px),
            linear-gradient(to bottom, rgba(38, 52, 59, 0.5) 2px, transparent 2px);
          background-size: 60px 60px;
        }
        #s5-step {
          position: absolute;
          left: 96px;
          top: 196px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 32px;
          letter-spacing: 0.16em;
          color: #f4a62a;
        }
        #s5-cap {
          position: absolute;
          left: 96px;
          top: 250px;
          width: 900px;
          font-weight: 800;
          font-size: 76px;
          line-height: 1.04;
          letter-spacing: -0.025em;
        }
        #s5-win {
          position: absolute;
          left: 50px;
          top: 520px;
          width: 980px;
          height: 820px;
          background: #090e10;
          border: 2px solid #26343b;
          border-radius: 26px;
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
          overflow: hidden;
        }
        #s5-bar {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 64px;
          background: #141d21;
          border-bottom: 2px solid #26343b;
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 0 24px;
        }
        .s5-dot {
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: #26343b;
        }
        #s5-title {
          margin-left: 12px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 22px;
          color: #93a4a7;
        }
        #s5-view {
          position: absolute;
          left: 0;
          right: 0;
          top: 66px;
          bottom: 0;
          overflow: hidden;
        }
        #s5-body {
          position: absolute;
          left: 30px;
          top: 22px;
          width: 920px;
          font-family: "IBM Plex Mono", monospace;
          font-size: 26px;
          line-height: 40px;
          color: #e8eeec;
          white-space: pre;
        }
        .s5-l {
          position: relative;
          height: 40px;
        }
        .s5-l.cmd .s5-t::before {
          content: "$ ";
          color: #f4a62a;
        }
        .s5-l.ok {
          color: #7fd3a8;
        }
        .s5-l.ok .s5-t::before {
          content: "";
          display: inline-block;
          width: 16px;
          height: 8px;
          margin: 0 16px 8px 4px;
          border-left: 4px solid #7fd3a8;
          border-bottom: 4px solid #7fd3a8;
          transform: rotate(-45deg);
        }
        .s5-l.p {
          color: #e8eeec;
        }
        .s5-l.p.first .s5-t::before {
          content: "> ";
          color: #f4a62a;
        }
        .s5-caret {
          display: inline-block;
          width: 15px;
          height: 30px;
          margin-left: 2px;
          vertical-align: -6px;
          background: #f4a62a;
          opacity: 0;
        }
        .s5-hl {
          position: absolute;
          left: -12px;
          width: 932px;
          height: 40px;
          border-radius: 6px;
          background: rgba(244, 166, 42, 0.2);
          border-left: 6px solid #f4a62a;
          transform-origin: left center;
        }
        .s5-tag {
          position: absolute;
          right: -8px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 20px;
          letter-spacing: 0.1em;
          color: #0d1316;
          background: #f4a62a;
          padding: 2px 10px;
          border-radius: 6px;
          top: 6px;
        }
      </style>

      <div id="root" data-composition-id="s5-prompt" data-width="1080" data-height="1920">
        <div id="s5-grid" data-layout-allow-overflow></div>
        <div id="s5-step">ÉTAPE 3</div>
        <div id="s5-cap">Décrire la vidéo à Claude Code</div>
        <div id="s5-win">
          <div id="s5-bar"><span class="s5-dot"></span><span class="s5-dot"></span><span class="s5-dot"></span><span id="s5-title">terminal — glissade-vespa</span></div>
          <div id="s5-view">
            <div id="s5-body" data-layout-allow-overflow></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // prompt.txt — suggested by Claude from the Vespa project's brief (the user's own wording was not kept)
          const LINES = [
            ["cmd", "npx skills add heygen-com/hyperframes"],
            ["ok", "21 skills installés"],
            ["cmd", "claude"],
            ["p first", "Fais une vidéo explicative verticale (1080×1920,"],
            ["p", "  30 fps, 60 à 90 s) sur la glissade de ma Vespa 300"],
            ["p", "  dans un rond-point à Bouznika, le 19/09/2026."],
            ["p", "  Le fusible de l'ASR s'était débranché : l'ASR"],
            ["p", "  (antipatinage) coupe la puissance quand la roue"],
            ["p", "  arrière patine. Sans lui, en accélérant penché,"],
            ["p", "  l'arrière a glissé et le scooter est tombé."],
            ["p", "  Style sobre : fond sombre, une couleur d'accent,"],
            ["p", "  transitions douces. Sections, dans cet ordre :"],
            ["p", "  1. Images réelles (my-video.mp4) + date et lieu"],
            ["p", "  2. Google Earth (google-earth.mp4) + path.png"],
            ["p", "  3. Compteur (speedometer.jpg) : « ASR OFF »"],
            ["p", "  4. Scène 3D en Three.js : ASR ON puis ASR OFF,"],
            ["p", "     avec la photo fuse.jpg"],
            ["p", "  5. Carte résumé"],
            ["p", "  Floute la plaque et le conducteur de la voiture."],
            ["p", "  Construis section par section, avec un aperçu"],
            ["p", "  à valider après chacune."],
          ];
          const LH = 40;
          const body = document.querySelector("#s5-body");
          const els = LINES.map(([cls, text], i) => {
            const d = document.createElement("div");
            d.className = "s5-l " + cls;
            d.id = "s5-l" + i;
            d.innerHTML = '<span class="s5-t"></span><span class="s5-caret"></span>';
            body.appendChild(d);
            return { d, t: d.querySelector(".s5-t"), c: d.querySelector(".s5-caret"), text };
          });
          // highlighted key lines: the ASR explanation, the 3D scene, the section order
          const HL = [
            [7, 2, "L'ASR"],
            [15, 2, "LA 3D"],
            [11, 1, "L'ORDRE"],
          ];
          HL.forEach(([row, rows, tag], k) => {
            const h = document.createElement("div");
            h.className = "s5-hl";
            h.id = "s5-hl" + k;
            h.style.top = row * LH + "px";
            h.style.height = rows * LH + "px";
            h.innerHTML = '<span class="s5-tag">' + tag + "</span>";
            body.insertBefore(h, body.firstChild);
          });

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s5-grid", { x: 0, y: 0 }, { x: -60, y: -30, duration: 7, ease: "none" }, 0);
          tl.fromTo("#s5-step", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.05);
          tl.fromTo("#s5-cap", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.12);
          tl.fromTo("#s5-win", { y: 80, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.15);
          els.forEach((e) => tl.set(e.d, { opacity: 0 }, 0));

          // typed lines: [index, start, duration]
          const typed = (i, t0, dur) => {
            const e = els[i];
            const proxy = { n: 0 };
            tl.set(e.d, { opacity: 1 }, t0);
            tl.set(e.c, { opacity: 1 }, t0);
            tl.fromTo(
              proxy,
              { n: 0 },
              {
                n: e.text.length,
                duration: dur,
                ease: "none",
                immediateRender: true,
                onUpdate: () => {
                  e.t.textContent = e.text.slice(0, Math.round(proxy.n));
                },
              },
              t0
            );
            tl.set(e.c, { opacity: 0 }, t0 + dur + 0.12);
          };
          typed(0, 0.4, 0.9); // npx skills add heygen-com/hyperframes
          tl.set(els[1].d, { opacity: 1 }, 1.45);
          els[1].t.textContent = els[1].text;
          typed(2, 1.65, 0.22); // claude
          typed(3, 2.0, 0.95); // first prompt lines at a readable pace
          typed(4, 2.95, 0.95);
          // then the rest scrolls by fast
          for (let i = 5; i < els.length; i++) {
            els[i].t.textContent = els[i].text;
            tl.set(els[i].d, { opacity: 1 }, 3.95 + (i - 5) * 0.07);
          }
          const visible = 17;
          const shift = (els.length - visible + 1) * LH;
          tl.fromTo("#s5-body", { y: 0 }, { y: -shift, duration: 0.9, ease: "power2.inOut" }, 4.3);
          // highlights, in story order: ASR, 3D, then the section order
          HL.forEach((_, k) => {
            tl.fromTo("#s5-hl" + k, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, 5.25 + k * 0.4);
          });
          // the blinking caret waits at the end of the prompt
          const last = els[els.length - 1];
          tl.set(last.c, { opacity: 1 }, 5.0);
          [5.5, 6.0, 6.5].forEach((t) => {
            tl.set(last.c, { opacity: 0 }, t);
            tl.set(last.c, { opacity: 1 }, t + 0.25);
          });
          window.__timelines["s5-prompt"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
