<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d1316; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0d1316; }
      #root > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- Making-of of the Vespa slide explainer. Generated by tools/build_index.py — edit the table there. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.6" data-fps="30" data-width="1080" data-height="1920">
      <div
        id="el-s1-hook"
        data-composition-id="s1-hook"
        data-composition-src="compositions/s1-hook.html"
        data-start="0.0"
        data-duration="3.0"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="el-s2-title"
        data-composition-id="s2-title"
        data-composition-src="compositions/s2-title.html"
        data-start="3.0"
        data-duration="1.6"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio id="sfx-rewind" src="assets/sfx/rewind.wav" data-start="2.2" data-duration="0.8" data-track-index="20" data-volume="0.9"></audio>
      <audio
        id="music"
        src="assets/music/vespa-fond.wav"
        data-start="3.0"
        data-media-start="12.0"
        data-duration="1.6"
        data-track-index="21"
        data-automation='{"version": 1, "lanes": [{"target": "volume", "points": [{"t": 0, "v": 0.0}, {"t": 0.4, "v": 0.85}, {"t": 0.5, "v": 0.85}, {"t": 1.6, "v": 0.0}]}]}'
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#el-s2-title", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
