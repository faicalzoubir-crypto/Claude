<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d1316;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1316;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #el-s4,
      #el-s4 video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #film-fade {
        position: absolute;
        inset: 0;
        background: #0d1316;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="64"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-s1"
        data-composition-id="s1-footage"
        data-composition-src="compositions/s1-footage.html"
        data-start="0"
        data-duration="14"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-s2"
        data-composition-id="s2-map"
        data-composition-src="compositions/s2-map.html"
        data-start="13.4"
        data-duration="11.6"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-s3"
        data-composition-id="s3-dash"
        data-composition-src="compositions/s3-dash.html"
        data-start="24.4"
        data-duration="7.4"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Section 4 pré-rendue : source compositions/s4-3d.html, régénérée par
           python3 tools/check_section.py s4 --render assets/footage/s4-3d-rendu.mp4 --quality delivery
           (le WebGL logiciel de ce conteneur ne tient pas le film entier dans une seule page). -->
      <div id="el-s4">
        <video
          id="s4-video"
          src="assets/footage/s4-3d-rendu.mp4"
          muted
          playsinline
          data-start="31.2"
          data-duration="26.4"
          data-track-index="4"
        ></video>
      </div>

      <div
        id="el-s5"
        data-composition-id="s5-summary"
        data-composition-src="compositions/s5-summary.html"
        data-start="57"
        data-duration="7"
        data-track-index="5"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- fond musical (tools/music.py) : discret sous le son d'origine, puis présent sans couvrir -->
      <audio
        id="music"
        src="assets/music/fond.wav"
        data-start="0"
        data-duration="64"
        data-track-index="10"
        data-volume="2"
      ></audio>

      <div id="film-fade"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#film-fade", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
      // fondus enchaînés entre sections (0,6 s, léger recul d'échelle)
      tl.fromTo("#el-s2", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 13.4);
      tl.fromTo("#el-s3", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 24.4);
      tl.fromTo("#el-s4", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 31.2);
      tl.fromTo("#el-s5", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 57);
      tl.to("#film-fade", { opacity: 1, duration: 0.8, ease: "power1.in" }, 63.15);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
