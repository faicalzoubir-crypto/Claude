<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <!-- langue du film : fr, en ou ar (tools/render_lang.py la change pour les versions anglaise et arabe) -->
    <script>window.LANG = "fr";</script>
    <script src="i18n.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d1316;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1316;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #el-s4,
      #el-s4 video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      @font-face {
        font-family: "IBM Plex Sans Arabic";
        src: url("assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2") format("woff2");
        font-weight: 400;
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
      }
      @font-face {
        font-family: "IBM Plex Sans Arabic";
        src: url("assets/fonts/ibm-plex-sans-arabic-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD, U+00D7;
      }
      @font-face {
        font-family: "IBM Plex Sans Arabic";
        src: url("assets/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2") format("woff2");
        font-weight: 700;
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
      }
      @font-face {
        font-family: "IBM Plex Sans Arabic";
        src: url("assets/fonts/ibm-plex-sans-arabic-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD, U+00D7;
      }
      /* arabe : police arabe, pas d'interlettrage (il casserait la liaison des lettres), mise en page de droite à gauche */
      html[lang="ar"] body * {
        font-family: "IBM Plex Sans Arabic", sans-serif !important;
        letter-spacing: 0 !important;
        font-variant-numeric: tabular-nums;
      }
      /* l'arabe paraît plus petit que les capitales latines à taille égale : petits textes agrandis */
      html[lang="ar"] .s1-label,
      html[lang="ar"] .s2-label,
      html[lang="ar"] #s3-label,
      html[lang="ar"] #s4-label,
      html[lang="ar"] #s5-label,
      html[lang="ar"] #s0-label,
      html[lang="ar"] #s1-meta,
      html[lang="ar"] #s4-asr,
      html[lang="ar"] .s4-row .lab {
        font-size: 33px !important;
      }
      html[lang="ar"] #s1-pill,
      html[lang="ar"] #s2-pill,
      html[lang="ar"] .s2-chip > div,
      html[lang="ar"] #s3-tag-ce {
        font-size: 34px !important;
      }
      html[lang="ar"] #s4-circuit text {
        font-size: 27px !important;
      }
      html[dir="rtl"] .i18n-block {
        left: auto !important;
        right: 96px !important;
        direction: rtl;
        text-align: right;
      }
      html[dir="rtl"] .i18n-end {
        right: auto !important;
        left: 96px !important;
      }
      html[dir="rtl"] .i18n-bar {
        transform-origin: right center !important;
      }
      html[dir="rtl"] .s4-row .val {
        text-align: left !important;
      }
      html[dir="rtl"] .s5-line {
        left: auto !important;
        right: 44px !important;
      }
      html[dir="rtl"] #s4-circuit {
        direction: ltr;
      }
      #film-fade {
        position: absolute;
        inset: 0;
        background: #0d1316;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="79"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- Ouverture : les commentaires Instagram, un par temps, puis la question épinglée au milieu (10–15 s) ; le film suit -->
      <div
        id="el-s0"
        data-composition-id="s0-comments"
        data-composition-src="compositions/s0-comments.html"
        data-start="0"
        data-duration="15.6"
        data-track-index="6"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- un effet sonore à chaque commentaire (pop), la vague (whoosh), la question (notification) -->
      <audio id="sfx-pop-01" src="assets/sfx/pop.mp3" data-start="0.667" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-pop-02" src="assets/sfx/pop.mp3" data-start="1.333" data-duration="0.72" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-pop-03" src="assets/sfx/pop.mp3" data-start="2.0" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-pop-04" src="assets/sfx/pop.mp3" data-start="2.667" data-duration="0.72" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-pop-05" src="assets/sfx/pop.mp3" data-start="3.333" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-pop-06" src="assets/sfx/pop.mp3" data-start="4.0" data-duration="0.72" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-pop-07" src="assets/sfx/pop.mp3" data-start="4.667" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-pop-08" src="assets/sfx/pop.mp3" data-start="5.333" data-duration="0.72" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-pop-09" src="assets/sfx/pop.mp3" data-start="6.0" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-pop-10" src="assets/sfx/pop.mp3" data-start="6.667" data-duration="0.72" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-pop-11" src="assets/sfx/pop.mp3" data-start="7.333" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-pop-12" src="assets/sfx/pop.mp3" data-start="8.0" data-duration="0.72" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-wave" src="assets/sfx/whoosh.mp3" data-start="8.667" data-duration="0.57" data-track-index="13" data-volume="0.45"></audio>
      <audio id="sfx-question" src="assets/sfx/notification.mp3" data-start="10" data-duration="2.45" data-track-index="14" data-volume="0.6"></audio>

      <div
        id="el-s1"
        data-composition-id="s1-footage"
        data-composition-src="compositions/s1-footage.html"
        data-start="15"
        data-duration="14"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-s2"
        data-composition-id="s2-map"
        data-composition-src="compositions/s2-map.html"
        data-start="28.4"
        data-duration="11.6"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-s3"
        data-composition-id="s3-dash"
        data-composition-src="compositions/s3-dash.html"
        data-start="39.4"
        data-duration="7.4"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Section 4 pré-rendue : source compositions/s4-3d.html, régénérée par
           python3 tools/check_section.py s4 --render assets/footage/s4-3d-rendu.mp4 --quality delivery
           (le WebGL logiciel de ce conteneur ne tient pas le film entier dans une seule page). -->
      <div id="el-s4">
        <video
          id="s4-video"
          src="assets/footage/s4-3d-rendu.mp4"
          muted
          playsinline
          data-start="46.2"
          data-duration="26.4"
          data-track-index="4"
        ></video>
      </div>

      <div
        id="el-s5"
        data-composition-id="s5-summary"
        data-composition-src="compositions/s5-summary.html"
        data-start="72"
        data-duration="7"
        data-track-index="5"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- fond musical (tools/music.py) : discret sous le son d'origine, puis présent sans couvrir -->
      <audio
        id="music"
        src="assets/music/fond.wav"
        data-start="0"
        data-duration="79"
        data-track-index="10"
        data-volume="2"
      ></audio>

      <div id="film-fade"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#film-fade", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
      // fondus enchaînés entre sections (0,6 s, léger recul d'échelle)
      tl.fromTo("#el-s1", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 15);
      tl.fromTo("#el-s2", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 28.4);
      tl.fromTo("#el-s3", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 39.4);
      tl.fromTo("#el-s4", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 46.2);
      tl.fromTo("#el-s5", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 72);
      tl.to("#film-fade", { opacity: 1, duration: 0.8, ease: "power1.in" }, 78.15);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
