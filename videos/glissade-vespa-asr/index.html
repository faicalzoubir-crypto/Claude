<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d1316;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1316;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #film-fade {
        position: absolute;
        inset: 0;
        background: #0d1316;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-s1"
        data-composition-id="s1-footage"
        data-composition-src="compositions/s1-footage.html"
        data-start="0"
        data-duration="14"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-s2"
        data-composition-id="s2-map"
        data-composition-src="compositions/s2-map.html"
        data-start="13.4"
        data-duration="16.6"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <div id="film-fade"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#film-fade", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
      // fondus enchaînés entre sections (0,6 s, léger recul d'échelle)
      tl.fromTo("#el-s2", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 13.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
