<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0d1316;
          font-family: "Montserrat", sans-serif;
          color: #e8eeec;
        }
        #s1-media {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s1-media video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #s1-flash {
          position: absolute;
          inset: 0;
          background: #e8eeec;
          opacity: 0;
        }
        #s1-scrim {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1180px;
          background: linear-gradient(180deg, rgba(13, 19, 22, 0.94) 0%, rgba(13, 19, 22, 0.8) 42%, rgba(13, 19, 22, 0.35) 72%, rgba(13, 19, 22, 0) 100%);
        }
        .s1-label {
          position: absolute;
          left: 96px;
          top: 196px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 28px;
          letter-spacing: 0.14em;
          color: #f4a62a;
        }
        #s1-title {
          position: absolute;
          left: 96px;
          top: 290px;
          width: 888px;
        }
        .s1-h1 {
          font-weight: 900;
          font-size: 136px;
          line-height: 0.98;
          letter-spacing: -0.035em;
        }
        #s1-rule {
          width: 150px;
          height: 7px;
          margin: 44px 0 36px;
          background: #f4a62a;
          transform-origin: left center;
        }
        #s1-date {
          font-weight: 400;
          font-size: 56px;
          line-height: 1.1;
          letter-spacing: -0.01em;
        }
        #s1-meta {
          margin-top: 30px;
          font-family: "IBM Plex Mono", monospace;
          font-size: 28px;
          letter-spacing: 0.1em;
          color: #b4c1c3;
        }
        #s1-replay {
          position: absolute;
          left: 96px;
          top: 284px;
          width: 888px;
        }
        #s1-pill {
          display: inline-block;
          padding: 12px 20px 11px;
          border-radius: 12px;
          background: #f4a62a;
          color: #0d1316;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.08em;
        }
        .s1-ev {
          padding-top: 34px;
        }
        .s1-ev .t {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 32px;
          color: #f4a62a;
        }
        .s1-ev .txt {
          margin-top: 6px;
          font-weight: 700;
          font-size: 56px;
          line-height: 1.1;
          letter-spacing: -0.02em;
        }
        .s1-ev .bar {
          display: block;
          width: 100%;
          height: 5px;
          margin-top: 16px;
          background: #f4a62a;
          transform-origin: left center;
        }
      </style>

      <div id="root" data-composition-id="s1-footage" data-width="1080" data-height="1920">
        <div id="s1-media" data-layout-allow-overflow>
          <video
            id="s1-real"
            src="assets/footage/accident-floute.mp4"
            playsinline
            data-has-audio="true"
            data-start="0"
            data-duration="8.4"
            data-media-start="0"
            data-track-index="1"
            data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":8.15,"v":1},{"t":8.4,"v":0}]}]}'
          ></video>
          <video
            id="s1-slowmo"
            data-hf-media-start-basis="local"
            src="assets/footage/accident-floute.mp4"
            playsinline
            data-has-audio="true"
            data-start="8.4"
            data-duration="5.6"
            data-media-start="4.2"
            data-playback-rate="0.5"
            data-track-index="2"
            data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.3,"v":0.45},{"t":5.2,"v":0.45},{"t":5.6,"v":0}]}]}'
          ></video>
          <div id="s1-flash"></div>
        </div>

        <div id="s1-scrim"></div>
        <div class="s1-label" id="s1-label">01 — IMAGES RÉELLES</div>

        <div id="s1-title">
          <div class="s1-h1" id="s1-h1a">Glissade</div>
          <div class="s1-h1" id="s1-h1b">à moto</div>
          <div id="s1-rule"></div>
          <div id="s1-date">19/09/2026 — Bouznika</div>
          <div id="s1-meta">VESPA 300 · CAMÉRA EMBARQUÉE</div>
        </div>

        <div id="s1-replay">
          <div id="s1-pill">RALENTI ×0,5</div>
          <div class="s1-ev" id="s1-ev1">
            <div class="t">4,9 s</div>
            <div class="txt" id="s1-ev1-txt">L'arrière perd l'adhérence</div>
            <div class="bar" id="s1-ev1-bar"></div>
          </div>
          <div class="s1-ev" id="s1-ev2">
            <div class="t">5,6 s</div>
            <div class="txt" id="s1-ev2-txt">Chute côté gauche</div>
            <div class="bar" id="s1-ev2-bar"></div>
          </div>
          <div class="s1-ev" id="s1-ev3">
            <div class="t">6,2 s</div>
            <div class="txt" id="s1-ev3-txt">Le scooter glisse au sol</div>
            <div class="bar" id="s1-ev3-bar"></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const REPLAY = 8.4;
          // temps de la vidéo source → temps de la section pendant le ralenti (source 4,2 s → 8,4 s, ×0,5)
          const slow = (src) => REPLAY + (src - 4.2) / 0.5;

          // entrée
          tl.fromTo("#s1-media", { scale: 1.06 }, { scale: 1, duration: 4, ease: "power2.out" }, 0);
          tl.fromTo("#s1-scrim", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo("#s1-label", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.25);
          tl.fromTo("#s1-h1a", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.4);
          tl.fromTo("#s1-h1b", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.52);
          tl.fromTo("#s1-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.inOut" }, 0.9);
          tl.fromTo("#s1-date", { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 1.05);
          tl.fromTo("#s1-meta", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.3);

          // le titre s'efface avant la glissade (4,9 s) : image dégagée
          tl.to("#s1-title", { y: -50, opacity: 0, duration: 0.4, ease: "power2.in" }, 3.9);
          tl.to("#s1-scrim", { opacity: 0.4, duration: 0.6, ease: "power1.inOut" }, 3.95);
          tl.to("#s1-label", { opacity: 0.45, duration: 0.4 }, 3.95);

          // ralenti : flash, pastille, journal d'événements
          tl.set(["#s1-pill", "#s1-ev1", "#s1-ev2", "#s1-ev3"], { opacity: 0 }, 0);
          tl.fromTo("#s1-flash", { opacity: 0 }, { opacity: 0.7, duration: 0.06, ease: "none" }, REPLAY - 0.06);
          tl.to("#s1-flash", { opacity: 0, duration: 0.4, ease: "power2.out" }, REPLAY);
          tl.to("#s1-media", { scale: 1.04, duration: 5.6, ease: "none" }, REPLAY);
          tl.to("#s1-scrim", { opacity: 1, duration: 0.5, ease: "power1.out" }, REPLAY + 0.1);
          tl.to("#s1-label", { opacity: 1, duration: 0.4 }, REPLAY + 0.2);
          tl.fromTo("#s1-pill", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, REPLAY + 0.25);

          [["#s1-ev1", 4.9], ["#s1-ev2", 5.6], ["#s1-ev3", 6.2]].forEach(([id, src], i, all) => {
            const t = slow(src);
            tl.fromTo(id, { x: -36, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t - 0.1);
            tl.fromTo(id + "-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, t);
            if (i < all.length - 1) {
              const next = slow(all[i + 1][1]);
              tl.to(id + "-txt", { color: "#b4c1c3", duration: 0.3 }, next - 0.1);
              tl.to(id + "-bar", { opacity: 0.25, duration: 0.3 }, next - 0.1);
            }
          });

          // fondu de sortie des textes avant l'enchaînement avec la section 2
          tl.to(["#s1-replay", "#s1-label"], { opacity: 0, duration: 0.3, ease: "power1.in" }, 13.15);

          window.__timelines["s1-footage"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
