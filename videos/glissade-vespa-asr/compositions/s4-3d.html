      <script>
        if (window.applyI18n) window.applyI18n(document); // textes de la langue choisie (i18n.js)
        (function () {
          const $ = (id) => document.getElementById(id);
          const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
          const lerp = (a, b, u) => a + (b - a) * u;
          const E = {
            lin: (u) => u,
            out: (u) => 1 - (1 - u) * (1 - u),
            in: (u) => u * u,
            io: (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2),
            sine: (u) => -(Math.cos(Math.PI * u) - 1) / 2,
          };
          // valeur qui passe de a à b entre t0 et t1
          const ramp = (t, t0, t1, a, b, e = E.io) => (t <= t0 ? a : t >= t1 ? b : lerp(a, b, e((t - t0) / (t1 - t0))));

          // ── Calendrier (temps local) ──
          const A_ACC = 3.2, A_DETECT = 4.6, A_CUT = 5.0, A_RECOVER = 6.2, A_OK = 6.8, A_END = 10.8;
          const B_START = 11.4, B_CRUISE = 14.8, B_ACC = 16.4, B_NOCUT = 18.2, B_YAW = 19.4, B_FALL = 20.8, B_GROUND = 21.4, B_STOP = 23.4;
          const DUR = 26.4;
          const inB = (t) => t >= B_START;

          // ── État physique, fonction du temps seul ──
          function vFront(t) {
            if (!inB(t)) return ramp(t, A_ACC, A_OK, 25, 26.5);
            if (t < B_YAW) return ramp(t, B_ACC, B_NOCUT, 25, 27);
            if (t < B_FALL) return ramp(t, B_YAW, B_FALL, 27, 22);
            return ramp(t, B_FALL, B_GROUND + 0.6, 22, 0, E.out);
          }
          function vRear(t) {
            if (!inB(t)) {
              if (t < A_DETECT) return ramp(t, A_ACC, A_DETECT, 25, 39, E.out);
              if (t < A_CUT) return ramp(t, A_DETECT, A_CUT, 39, 40);
              return ramp(t, A_CUT, A_RECOVER, 40, 26.5, E.out);
            }
            if (t < B_NOCUT) return ramp(t, B_ACC, B_NOCUT, 25, 42, E.out);
            if (t < B_FALL) return ramp(t, B_NOCUT, B_FALL, 42, 58, E.lin);
            return ramp(t, B_FALL, B_GROUND + 1.2, 58, 0, E.out);
          }
          function power(t) {
            if (!inB(t)) {
              if (t < A_CUT) return ramp(t, A_ACC, A_ACC + 0.5, 30, 85);
              if (t < A_RECOVER) return ramp(t, A_CUT, A_CUT + 0.25, 85, 15);
              return ramp(t, A_RECOVER, A_OK + 0.6, 15, 40);
            }
            if (t < B_FALL) return ramp(t, B_ACC, B_ACC + 0.5, 30, 85);
            return ramp(t, B_FALL, B_FALL + 0.3, 85, 0);
          }
          function asrStatus(t) {
            if (inB(t)) return [T("st_off"), true];
            if (t >= A_DETECT && t < A_CUT) return [T("st_detect"), true];
            if (t >= A_CUT && t < A_OK) return [T("st_cut"), true];
            return [T("st_ready"), false];
          }
          const lean = (t) => (inB(t) ? ramp(t, B_FALL, B_GROUND, 30, 88, E.in) : 30);
          function yaw(t) {
            if (!inB(t)) return t < A_CUT ? ramp(t, A_ACC + 0.6, A_CUT, 0, 4, E.sine) : ramp(t, A_CUT, A_RECOVER, 4, 0, E.sine);
            if (t < B_YAW) return ramp(t, B_ACC + 0.8, B_YAW, 0, 6, E.in);
            if (t < B_FALL) return ramp(t, B_YAW, B_FALL, 6, 45, E.in);
            return ramp(t, B_FALL, B_STOP, 45, 62, E.out);
          }
          const SLIDE_V0 = 22 / 3.6;
          const slideDist = (t) => (t <= B_FALL ? 0 : ((SLIDE_V0 * (B_STOP - B_FALL)) / 2) * E.out(clamp((t - B_FALL) / (B_STOP - B_FALL))));

          // intégrales (angle du sol, rotation des roues) — table précalculée, déterministe
          const R = 9.8, WHEEL_R = 0.29, SPIN_VIS = 0.16; // rotation des roues ralentie pour rester lisible à 30 i/s
          const DT = 1 / 240, N = Math.ceil(DUR / DT) + 2;
          const ground = new Float64Array(N), rotF = new Float64Array(N), rotR = new Float64Array(N);
          for (let i = 1; i < N; i++) {
            const t = (i - 0.5) * DT;
            const vg = t < B_FALL ? vFront(t) / 3.6 : ramp(t, B_FALL, B_FALL + 0.25, 22 / 3.6, 0, E.out);
            ground[i] = ground[i - 1] + (vg / R) * DT;
            rotF[i] = rotF[i - 1] + (vFront(t) / 3.6 / WHEEL_R) * SPIN_VIS * DT;
            rotR[i] = rotR[i - 1] + (vRear(t) / 3.6 / WHEEL_R) * SPIN_VIS * DT;
          }
          const look = (arr, t) => {
            const x = clamp(t / DT, 0, N - 1.001), i = Math.floor(x), u = x - i;
            return arr[i] + (arr[i + 1] - arr[i]) * u;
          };

          // ── Textes (GSAP) ──
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s4-label", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3);
          tl.fromTo("#s4-badge-on", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.5);
          tl.to("#s4-badge-on", { opacity: 0, duration: 0.3 }, A_END);
          tl.fromTo("#s4-badge-off", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, B_START);
          tl.fromTo("#s4-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6);
          const caps = [
            ["#s4-a1", 0.8, A_ACC - 0.35], ["#s4-a2", A_ACC, A_CUT - 0.3], ["#s4-a3", A_CUT, A_OK - 0.35], ["#s4-a4", A_OK, A_END - 0.1],
            ["#s4-b1", B_START + 0.2, B_CRUISE - 0.35], ["#s4-b2", B_CRUISE, B_ACC - 0.35], ["#s4-b3", B_ACC, B_NOCUT - 0.3], ["#s4-b4", B_NOCUT, B_YAW - 0.3], ["#s4-b5", B_YAW + 0.1, DUR - 0.75],
          ];
          caps.forEach(([id, a, b]) => {
            tl.fromTo(id, { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, a);
            tl.to(id, { y: -18, opacity: 0, duration: 0.3, ease: "power2.in" }, b);
          });
          tl.fromTo("#s4-lean", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.1);
          tl.to("#s4-lean", { opacity: 0, duration: 0.4 }, A_ACC - 0.3);
          tl.to("#s4-lean", { opacity: 1, duration: 0.5 }, B_CRUISE + 0.2);
          tl.to("#s4-lean", { opacity: 0, duration: 0.4 }, B_ACC - 0.3);
          // passage ON → OFF : la scène s'assombrit, la carte du fusible s'affiche
          tl.to("#s4-panel", { opacity: 0, duration: 0.35 }, A_END);
          tl.fromTo("#s4-dim", { opacity: 0 }, { opacity: 0.88, duration: 0.5, ease: "power1.inOut" }, A_END);
          tl.fromTo("#s4-fuse", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, B_START + 0.15);
          tl.fromTo("#s4-fuse-icon", { y: 0, rotation: 0 }, { y: -64, x: 18, rotation: 14, duration: 0.7, ease: "back.out(1.4)", svgOrigin: "416 100" }, B_START + 1.1);
          tl.to("#s4-wire-out", { stroke: "#3b4a51", duration: 0.3 }, B_START + 1.4);
          tl.to("#s4-asr-box", { stroke: "#3b4a51", duration: 0.3 }, B_START + 1.4);
          tl.fromTo("#s4-nocurrent", { opacity: 0 }, { opacity: 1, duration: 0.35 }, B_START + 1.6);
          tl.to("#s4-fuse", { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, B_CRUISE - 0.4);
          tl.to("#s4-dim", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, B_CRUISE - 0.3);
          tl.to("#s4-panel", { opacity: 1, duration: 0.4 }, B_CRUISE);
          // sortie
          tl.to(["#s4-label", "#s4-badge-off", "#s4-panel"], { opacity: 0, duration: 0.3, ease: "power1.in" }, DUR - 0.75);
          window.__timelines["s4-3d"] = tl;

          // ── Tableau de mesures (piloté par le temps) ──
          function panelAt(t) {
            const vf = vFront(t), vr = vRear(t), p = power(t);
            $("s4-v-front").textContent = Math.round(vf) + " " + T("kmh");
            $("s4-v-rear").textContent = Math.round(vr) + " " + T("kmh");
            $("s4-v-pow").textContent = Math.round(p) + " %";
            $("s4-f-front").style.transform = `scaleX(${clamp(vf / 60).toFixed(4)})`;
            $("s4-f-rear").style.transform = `scaleX(${clamp(vr / 60).toFixed(4)})`;
            $("s4-f-pow").style.transform = `scaleX(${clamp(p / 100).toFixed(4)})`;
            const slipping = vr - vf > 3;
            $("s4-f-rear").style.background = slipping ? "#f4a62a" : "#e8eeec";
            $("s4-v-rear").style.color = slipping ? "#f4a62a" : "#e8eeec";
            const cutting = !inB(t) && t >= A_CUT && t < A_OK;
            $("s4-f-pow").style.background = cutting ? "#f4a62a" : "#e8eeec";
            $("s4-v-pow").style.color = cutting ? "#f4a62a" : "#e8eeec";
            const [st, hot] = asrStatus(t);
            $("s4-asr").textContent = st;
            $("s4-asr").style.color = hot ? "#f4a62a" : "#93cdbb";
          }

          // ── Scène Three.js ──
          let hostStart = 0;
          for (let el = $("s4-gl"); el; el = el.parentElement) {
            if (el.hasAttribute("data-start") && el.hasAttribute("data-composition-id")) hostStart += parseFloat(el.getAttribute("data-start")) || 0;
          }
          const localTime = (g) => clamp(g - hostStart, 0, DUR);
          panelAt(localTime(window.__hfThreeTime || 0));

          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady["s4-3d"] = import("./vendor/three.module.js").then((THREE) => {
            const canvas = $("s4-gl");
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
            renderer.setPixelRatio(1);
            renderer.setSize(1080, 1920, false);
            const BG = 0x0d1316;
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(BG);
            scene.fog = new THREE.Fog(BG, 9, 30);
            const camera = new THREE.PerspectiveCamera(36, 1080 / 1920, 0.1, 100);

            // générateur pseudo-aléatoire graine fixe (texture d'asphalte)
            let seed = 20260919;
            const rnd = () => {
              seed = (seed + 0x6d2b79f5) | 0;
              let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
              x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
              return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
            };
            const tex = document.createElement("canvas");
            tex.width = tex.height = 512;
            const g2 = tex.getContext("2d");
            g2.fillStyle = "#11181b";
            g2.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 2600; i++) {
              const v = rnd();
              g2.fillStyle = v < 0.5 ? "rgba(40,54,60,0.9)" : "rgba(6,10,12,0.9)";
              g2.fillRect(rnd() * 512, rnd() * 512, 1 + rnd() * 3, 1 + rnd() * 3);
            }
            const asphalt = new THREE.CanvasTexture(tex);
            asphalt.wrapS = asphalt.wrapT = THREE.RepeatWrapping;
            asphalt.repeat.set(24, 24);
            asphalt.colorSpace = THREE.SRGBColorSpace;

            // sol du rond-point : tourne autour du centre pour faire défiler la route sous le scooter
            const groundG = new THREE.Group();
            scene.add(groundG);
            const flat = (geo, color, y, extra = {}) => {
              const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.95, ...extra }));
              m.rotation.x = -Math.PI / 2;
              m.position.y = y;
              groundG.add(m);
              return m;
            };
            flat(new THREE.CircleGeometry(60, 96), 0xffffff, 0, { map: asphalt });
            flat(new THREE.CircleGeometry(7.9, 96), 0x1a2427, 0.004);
            flat(new THREE.RingGeometry(7.9, 8.15, 128), 0x7f8f93, 0.006);
            flat(new THREE.RingGeometry(12.2, 12.45, 128), 0x7f8f93, 0.006);
            flat(new THREE.RingGeometry(12.45, 16, 128), 0x172024, 0.004);
            function dashedRing(r, w, n, fill) {
              const pos = [];
              for (let k = 0; k < n; k++) {
                const a0 = (k / n) * Math.PI * 2, a1 = a0 + (fill / n) * Math.PI * 2;
                const p = (a, rr) => [rr * Math.cos(a), rr * Math.sin(a), 0];
                const A = p(a0, r - w / 2), B = p(a1, r - w / 2), C = p(a1, r + w / 2), D = p(a0, r + w / 2);
                pos.push(...A, ...B, ...C, ...A, ...C, ...D);
              }
              const geo = new THREE.BufferGeometry();
              geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
              geo.computeVertexNormals();
              return geo;
            }
            const dashMat = { side: THREE.DoubleSide };
            flat(dashedRing(8.6, 0.12, 40, 0.5), 0x5d6d72, 0.008, dashMat);
            flat(dashedRing(11.6, 0.12, 52, 0.5), 0x5d6d72, 0.008, dashMat);

            // traces : pneu arrière qui patine puis frottement du scooter couché (dans le repère du sol)
            function ribbon(maxN, color, opacity) {
              const geo = new THREE.BufferGeometry();
              geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(maxN * 6 * 3), 3));
              geo.setDrawRange(0, 0);
              const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide }));
              m.position.y = 0.01;
              m.frustumCulled = false; // géométrie réécrite à chaque image : sa sphère englobante initiale est vide
              groundG.add(m);
              return m;
            }
            const skid = ribbon(600, 0xb4c1c3, 0.5);
            const scrape = ribbon(600, 0x93a4a7, 0.28);

            // ── Scooter stylisé (avant = -Z, haut = +Y, gauche = -X ; contact avant à l'origine) ──
            const mint = new THREE.MeshStandardMaterial({ color: 0x93cdbb, roughness: 0.42, metalness: 0.05 });
            const mintDark = new THREE.MeshStandardMaterial({ color: 0x7db3a3, roughness: 0.5 });
            const dark = new THREE.MeshStandardMaterial({ color: 0x1f2a2e, roughness: 0.6 });
            const tireMatF = new THREE.MeshStandardMaterial({ color: 0x121618, roughness: 0.9 });
            const tireMatR = new THREE.MeshStandardMaterial({ color: 0x121618, roughness: 0.9, emissive: 0xf4a62a, emissiveIntensity: 0 });
            const alloy = new THREE.MeshStandardMaterial({ color: 0xb9c4c1, roughness: 0.35, metalness: 0.6 });
            const lamp = new THREE.MeshStandardMaterial({ color: 0xfff6d8, emissive: 0xfff6d8, emissiveIntensity: 1.2 });
            const red = new THREE.MeshStandardMaterial({ color: 0xc8352b, emissive: 0xc8352b, emissiveIntensity: 0.9 });
            const add = (parent, geo, mat, x, y, z, sx = 1, sy = 1, sz = 1) => {
              const m = new THREE.Mesh(geo, mat);
              m.position.set(x, y, z);
              m.scale.set(sx, sy, sz);
              parent.add(m);
              return m;
            };
            function wheel(tireMat) {
              const w = new THREE.Group();
              const spin = new THREE.Group();
              w.add(spin);
              const tire = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.075, 18, 48), tireMat);
              tire.rotation.y = Math.PI / 2;
              spin.add(tire);
              const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.09, 32), alloy);
              rim.rotation.z = Math.PI / 2;
              spin.add(rim);
              for (let k = 0; k < 5; k++) {
                const s = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.2), dark);
                s.position.set(0, Math.sin((k / 5) * Math.PI * 2) * 0.07, Math.cos((k / 5) * Math.PI * 2) * 0.07);
                s.rotation.x = -(k / 5) * Math.PI * 2;
                spin.add(s);
              }
              for (let k = 0; k < 8; k++) {
                const a = (k / 8) * Math.PI * 2;
                const d = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.035, 0.06), new THREE.MeshStandardMaterial({ color: 0x3a4549, roughness: 0.8 }));
                d.position.set(0, Math.sin(a) * 0.22, Math.cos(a) * 0.22);
                d.rotation.x = -a;
                spin.add(d);
              }
              return { w, spin };
            }
            const model = new THREE.Group();
            const front = wheel(tireMatF);
            front.w.position.set(0, WHEEL_R, 0);
            model.add(front.w);
            const rear = wheel(tireMatR);
            rear.w.position.set(0, WHEEL_R, 1.37);
            model.add(rear.w);
            add(model, new THREE.SphereGeometry(1, 40, 28), mint, 0, 0.6, 1.12, 0.36, 0.3, 0.55);
            add(model, new THREE.BoxGeometry(0.4, 0.07, 0.6), mintDark, 0, 0.3, 0.62);
            const shield = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.3, 0.7, 40, 1, true, Math.PI * 0.62, Math.PI * 0.76), mint);
            shield.material = mint.clone();
            shield.material.side = THREE.DoubleSide;
            shield.position.set(0, 0.64, 0.62);
            shield.rotation.x = -0.18;
            model.add(shield);
            add(model, new THREE.SphereGeometry(1, 32, 20), mint, 0, 0.5, -0.02, 0.12, 0.12, 0.26);
            add(model, new THREE.CylinderGeometry(0.035, 0.035, 0.82, 12), dark, 0, 0.66, 0.2).rotation.x = 0.52;
            add(model, new THREE.SphereGeometry(1, 32, 20), mint, 0, 1.04, 0.45, 0.24, 0.1, 0.15);
            add(model, new THREE.SphereGeometry(0.06, 16, 12), lamp, 0, 1.04, 0.3);
            const bar = add(model, new THREE.CylinderGeometry(0.02, 0.02, 0.7, 10), dark, 0, 1.08, 0.48);
            bar.rotation.z = Math.PI / 2;
            for (const sx of [-1, 1]) {
              add(model, new THREE.CylinderGeometry(0.01, 0.01, 0.22, 8), dark, sx * 0.24, 1.2, 0.48);
              add(model, new THREE.SphereGeometry(1, 16, 12), dark, sx * 0.25, 1.32, 0.48, 0.07, 0.05, 0.02);
            }
            const seat = add(model, new THREE.CapsuleGeometry(0.13, 0.42, 8, 16), dark, 0, 0.88, 1.05, 1.15, 0.55, 1);
            seat.rotation.x = Math.PI / 2;
            add(model, new THREE.BoxGeometry(0.4, 0.31, 0.36), dark, 0, 1.08, 1.55);
            add(model, new THREE.BoxGeometry(0.36, 0.04, 0.32), mintDark, 0, 0.92, 1.55);
            add(model, new THREE.BoxGeometry(0.16, 0.05, 0.03), red, 0, 0.74, 1.68);

            // hiérarchie : position (contact avant) → lacet (pivot à l'avant) → inclinaison (axe longitudinal au sol)
            const posG = new THREE.Group(), yawG = new THREE.Group(), leanG = new THREE.Group();
            posG.add(yawG);
            yawG.add(leanG);
            leanG.add(model);
            scene.add(posG);
            posG.position.set(R, 0, 0);

            // ombre de contact (texture radiale générée)
            const sh = document.createElement("canvas");
            sh.width = sh.height = 128;
            const sg = sh.getContext("2d");
            const grad = sg.createRadialGradient(64, 64, 4, 64, 64, 62);
            grad.addColorStop(0, "rgba(0,0,0,0.75)");
            grad.addColorStop(1, "rgba(0,0,0,0)");
            sg.fillStyle = grad;
            sg.fillRect(0, 0, 128, 128);
            const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 2.6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sh), transparent: true, depthWrite: false }));
            shadow.rotation.x = -Math.PI / 2;
            shadow.position.y = 0.012;
            yawG.add(shadow);

            scene.add(new THREE.HemisphereLight(0xdfeee9, 0x0d1316, 1.5));
            const key = new THREE.DirectionalLight(0xffffff, 2.4);
            key.position.set(R + 3, 6, 5);
            key.target = posG;
            scene.add(key);
            const rim = new THREE.DirectionalLight(0x93cdbb, 0.9);
            rim.position.set(R - 5, 3, -6);
            rim.target = posG;
            scene.add(rim);

            const CAM = new THREE.Vector3(R + 3.5, 2.3, 7.0), TGT = new THREE.Vector3(R - 0.85, 1.05, 0.25);
            const tmp = new THREE.Vector3();
            const box = new THREE.Box3(), cNow = new THREE.Vector3(), off = new THREE.Vector3();
            const VIEW_BACK = CAM.clone().sub(TGT).normalize();
            // centre du scooter en croisière (référence du suivi caméra)
            leanG.rotation.z = (30 * Math.PI) / 180;
            scene.updateMatrixWorld();
            const C0 = new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3());
            const proj = (v) => {
              tmp.copy(v).project(camera);
              return [((tmp.x + 1) / 2) * 1080, ((1 - tmp.y) / 2) * 1920];
            };
            const fmt = (n) => n.toFixed(1);
            const d2 = (pts) => pts.map((p, i) => (i ? "L" : "M") + fmt(p[0]) + " " + fmt(p[1])).join(" ");

            // positions du scooter dans le monde (pour les traces)
            function frontPos(t) {
              return new THREE.Vector3(R, 0, -slideDist(t));
            }
            const rad = (d) => (d * Math.PI) / 180;
            function rearContactWorld(t) {
              const y = rad(yaw(t)), f = frontPos(t);
              return new THREE.Vector3(f.x + Math.sin(y) * 1.37, 0, f.z + Math.cos(y) * 1.37);
            }
            function toGround(v, t) {
              const a = look(ground, t); // le sol a tourné de -a : on remet le point dans le repère du sol
              const c = Math.cos(a), s = Math.sin(a);
              return [v.x * c + v.z * s, -v.x * s + v.z * c];
            }
            function fillRibbon(mesh, pts, w) {
              const arr = mesh.geometry.attributes.position.array;
              let n = 0;
              for (let i = 1; i < pts.length && i < 600; i++) {
                const [x0, z0] = pts[i - 1], [x1, z1] = pts[i];
                const dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz) || 1;
                const nx = (-dz / L) * w, nz = (dx / L) * w;
                // repère du sol tourné de -90° autour de X : (x, z) monde → (x, -y) local ; on écrit directement en 3D (y = 0)
                const q = [x0 - nx, 0, z0 - nz, x1 - nx, 0, z1 - nz, x1 + nx, 0, z1 + nz, x0 - nx, 0, z0 - nz, x1 + nx, 0, z1 + nz, x0 + nx, 0, z0 + nz];
                arr.set(q, n * 18);
                n++;
              }
              mesh.geometry.setDrawRange(0, n * 6);
              mesh.geometry.attributes.position.needsUpdate = true;
            }

            function renderAt(t) {
              panelAt(t);
              const lz = rad(lean(t)), yz = rad(yaw(t));
              groundG.rotation.y = -look(ground, t);
              posG.position.copy(frontPos(t));
              yawG.rotation.y = yz;
              leanG.rotation.z = lz;
              leanG.position.y = 0.36 * E.sine(clamp((lean(t) - 45) / 43));
              model.position.z = 0;
              front.spin.rotation.x = -look(rotF, t);
              rear.spin.rotation.x = -look(rotR, t);
              const slip = clamp((vRear(t) - vFront(t)) / 12);
              tireMatR.emissiveIntensity = (t < B_FALL || !inB(t) ? slip : slip * clamp(1 - (t - B_FALL) / 0.8)) * 0.0;
              shadow.position.set(-Math.sin(lz) * 0.45, 0.012, 0.68);
              shadow.scale.set(1 + Math.sin(lz) * 1.1, 1, 1);

              // caméra : fixe derrière le scooter (trois quarts arrière droit) ; dès que l'arrière décroche,
              // elle suit le centre réel du scooter puis recule un peu pendant la glissade
              const sd = slideDist(t);
              scene.updateMatrixWorld();
              box.setFromObject(model);
              box.getCenter(cNow);
              const w = inB(t) ? E.sine(clamp((t - B_YAW) / (B_GROUND + 0.4 - B_YAW))) : 0;
              const dolly = inB(t) ? 1.6 * E.io(clamp((t - B_FALL) / (B_STOP - B_FALL))) : 0;
              off.copy(cNow).sub(C0).multiplyScalar(w);
              camera.position.copy(CAM).add(off).addScaledVector(VIEW_BACK, dolly);
              camera.lookAt(TGT.x + off.x, TGT.y + off.y, TGT.z + off.z);
              camera.updateMatrixWorld();

              // traces au sol
              const skidPts = [];
              if (inB(t) && t > B_NOCUT) {
                const tEnd = Math.min(t, B_GROUND);
                for (let k = B_NOCUT; k <= tEnd + 1e-6; k += 0.04) skidPts.push(toGround(rearContactWorld(k), k));
                skidPts.push(toGround(rearContactWorld(tEnd), tEnd));
              }
              fillRibbon(skid, skidPts, 0.035);
              const scrPts = [];
              if (inB(t) && t > B_GROUND) {
                for (let k = B_GROUND; k <= t + 1e-6; k += 0.05) {
                  const f = frontPos(k), y = rad(yaw(k));
                  scrPts.push(toGround(new THREE.Vector3(f.x + Math.sin(y) * 0.7 - 0.5, 0, f.z + Math.cos(y) * 0.7), k));
                }
              }
              fillRibbon(scrape, scrPts, 0.12);

              renderer.render(scene, camera);

              // annotations projetées : angle d'inclinaison, cercle sur la roue arrière
              const P0 = new THREE.Vector3(R, 0, 1.37 - sd);
              const up = (a, l) => new THREE.Vector3(P0.x - Math.sin(a) * l, Math.cos(a) * l, P0.z);
              $("s4-lean-v").setAttribute("d", d2([proj(P0), proj(up(0, 1.45))]));
              $("s4-lean-a").setAttribute("d", d2([proj(P0), proj(up(lz, 1.45))]));
              const arc = [];
              for (let k = 0; k <= 12; k++) arc.push(proj(up((lz * k) / 12, 1.0)));
              $("s4-lean-arc").setAttribute("d", d2(arc));
              const lab = proj(up(lz / 2, 1.22));
              $("s4-lean-t").setAttribute("x", fmt(lab[0] - 34));
              $("s4-lean-t").setAttribute("y", fmt(lab[1] - 14));
              $("s4-lean-t").textContent = Math.round(lean(t)) + "°";
              const wc = new THREE.Vector3(P0.x - Math.sin(lz) * WHEEL_R, Math.cos(lz) * WHEEL_R, P0.z);
              rear.w.getWorldPosition(wc);
              const c = proj(wc), e = proj(wc.clone().add(new THREE.Vector3(0, 0.4, 0)));
              $("s4-ring").setAttribute("cx", fmt(c[0]));
              $("s4-ring").setAttribute("cy", fmt(c[1]));
              $("s4-ring").setAttribute("r", fmt(Math.hypot(e[0] - c[0], e[1] - c[1])));
              $("s4-ring").setAttribute("opacity", (t < B_FALL || !inB(t) ? slip : 0).toFixed(3));
            }

            window.addEventListener("hf-seek", (ev) => renderAt(localTime(ev.detail.time)));
            renderAt(localTime(window.__hfThreeTime || 0));
          });
        })();
      </script>
    </template>
  </body>
</html>
