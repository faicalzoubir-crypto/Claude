<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>

        @font-face { font-family: "Cairo"; src: url("assets/fonts/cairo-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
        @font-face { font-family: "Cairo"; src: url("assets/fonts/cairo-arabic-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; unicode-range: U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC; }
        @font-face { font-family: "Cairo"; src: url("assets/fonts/cairo-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
        @font-face { font-family: "Cairo"; src: url("assets/fonts/cairo-arabic-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; unicode-range: U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC; }
        @font-face { font-family: "Cairo"; src: url("assets/fonts/cairo-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Cairo", sans-serif;
          direction: rtl;
        }
        #s-card {
          position: absolute;
          left: 60px;
          top: 262px;
          width: 960px;
          height: 136px;
          border-radius: 14px;
          background: rgba(20, 29, 33, 0.92);
          border: 1.5px solid #26343b;
        }
        .s-row {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          gap: 26px;
          padding: 0 34px 4px;
          opacity: 0;
        }
        .s-num {
          flex: none;
          width: 64px;
          height: 64px;
          border-radius: 50%;
          background: #f4a62a;
          color: #0d1316;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
          font-size: 38px;
          line-height: 1;
        }
        .s-line {
          flex: none;
          width: 8px;
          height: 64px;
          border-radius: 4px;
          background: #f4a62a;
        }
        .s-txt {
          font-weight: 700;
          font-size: 46px;
          line-height: 1.2;
          color: #e8eeec;
          white-space: nowrap;
        }
        .s-chip {
          position: absolute;
          right: 60px;
          top: 416px;
          padding: 6px 20px 9px;
          border-radius: 100px;
          background: rgba(20, 29, 33, 0.92);
          border: 1.5px solid #26343b;
          color: #e8eeec;
          font-weight: 700;
          font-size: 30px;
          opacity: 0;
          white-space: nowrap;
        }
        .s-chip b {
          direction: ltr;
          unicode-bidi: isolate;
          font-weight: 800;
          color: #f4a62a;
        }
      </style>
      <div
        id="root"
        data-composition-id="steps"
        data-width="1080"
        data-height="1920"
        data-composition-variables='[
          {"id":"step1","type":"string","label":"Étape 1","default":"السير العادي في الممر الأقصى يساراً"},
          {"id":"step2","type":"string","label":"Étape 2","default":"توقف مفاجئ للدراجة الصغيرة"},
          {"id":"step3","type":"string","label":"Étape 3","default":"محاولة التفادي والفرملة"},
          {"id":"step4","type":"string","label":"Étape 4","default":"تماس خفيف"},
          {"id":"step5","type":"string","label":"Étape 5","default":"فقدان السيطرة والسقوط على الرصيف"},
          {"id":"stepFinal","type":"string","label":"Positions finales","default":"المواضع النهائية"},
          {"id":"rateLabel","type":"string","label":"Vitesse affichée","default":"سرعة العرض"},
          {"id":"slowLabel","type":"string","label":"Ralenti","default":"حركة بطيئة"}
        ]'
      >
        <div id="s-card">
          <div id="s-r1" class="s-row"><span class="s-num">1</span><span class="s-txt" data-var-text="step1">السير العادي في الممر الأقصى يساراً</span></div>
          <div id="s-r2" class="s-row"><span class="s-num">2</span><span class="s-txt" data-var-text="step2">توقف مفاجئ للدراجة الصغيرة</span></div>
          <div id="s-r3" class="s-row"><span class="s-num">3</span><span class="s-txt" data-var-text="step3">محاولة التفادي والفرملة</span></div>
          <div id="s-r4" class="s-row"><span class="s-num">4</span><span class="s-txt" data-var-text="step4">تماس خفيف</span></div>
          <div id="s-r5" class="s-row"><span class="s-num">5</span><span class="s-txt" data-var-text="step5">فقدان السيطرة والسقوط على الرصيف</span></div>
          <div id="s-r6" class="s-row"><span class="s-line"></span><span class="s-txt" data-var-text="stepFinal">المواضع النهائية</span></div>
        </div>
        <div id="s-rate" class="s-chip"><span data-var-text="rateLabel">سرعة العرض</span> <b>×0.5</b></div>
        <div id="s-slow" class="s-chip"><span data-var-text="slowLabel">حركة بطيئة</span> <b>×0.1</b></div>
      </div>
      <script>
        (function () {
          // temps locaux : 0 = 3 s dans le film
          const T = (g) => g - 3;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s-card", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, T(3.0));
          const rows = [["#s-r1", 3.04, 6.9], ["#s-r2", 6.95, 8.95], ["#s-r3", 9.0, 10.85], ["#s-r4", 10.9, 12.1], ["#s-r5", 12.15, 15.3], ["#s-r6", 15.4, null]];
          rows.forEach(([id, a, b]) => {
            tl.fromTo(`${id} .s-num, ${id} .s-line`, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, T(a));
            tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.01 }, T(a));
            tl.fromTo(`${id} .s-txt`, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, T(a) + 0.06);
            if (b !== null) tl.to(id, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, T(b) - 0.16);
          });
          // vitesse d'affichage (honnêteté : le film n'est pas en temps réel)
          tl.fromTo("#s-rate", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T(3.4));
          tl.to("#s-rate", { opacity: 0, duration: 0.15 }, T(10.6));
          tl.fromTo("#s-slow", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, T(10.75));
          tl.to("#s-slow", { opacity: 0, duration: 0.15 }, T(12.5));
          tl.to("#s-rate", { opacity: 1, duration: 0.25 }, T(12.7));
          tl.to("#s-rate", { opacity: 0, duration: 0.2 }, T(15.3));
          tl.to("#s-card", { opacity: 0, duration: 0.3, ease: "power2.in" }, T(19.5));
          window.__timelines["steps"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
