          tl.fromTo("#m-bg", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);
          tl.fromTo("#m-line", { scaleX: 0.2, transformOrigin: "100% 50%", opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.25);

          tl.fromTo(".m-row", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out", stagger: 0.14 }, 0.7);
          tl.fromTo(".m-num", { scale: 0.6 }, { scale: 1, duration: 0.4, ease: "back.out(1.6)", stagger: 0.14 }, 0.7);
          tl.fromTo("#m-rule", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 1.5);
          tl.fromTo(["#m-fig", "#m-note"], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power3.out", stagger: 0.15 }, 1.65);

          window.__timelines["summary"] = tl;
