          opacity: 0;
        }

          direction: ltr;

          color: #e8eeec;

          font-size: 34px;
          line-height: 1.2;

        }
        .w-txt {
          direction: rtl;
          text-align: right;
        }
        .w-sub {
          display: block;
          font-size: 28px;
          font-weight: 600;
          color: #93a4a7;
        }
        .w-iso {
          direction: ltr;
          unicode-bidi: isolate;
        }

          flex: none;
          width: 48px;
          height: 48px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
          font-size: 30px;
          line-height: 1;

          color: #0d1316;

          color: #ffffff;
        }

          border-color: #f4a62a;
          color: #0d1316;
        }
        .w-amber .w-sub {

      <script>
        (function () {
          const $ = (id) => document.getElementById(id);
          const K = window.KIN;
          // Le monde est toujours calculé dans un cadre « portrait virtuel » 1080 × 1920 (route verticale) ;
          // en 16:9 (window.FORMAT), ce cadre est tourné de 90° (sens de marche vers la droite, terre-plein en haut).
          const LAND = window.FORMAT === "16x9";
          const W = LAND ? 1920 : 1080, H = LAND ? 1080 : 1920; // cadre réel
          const VW = 1080, VH = 1920, AY = LAND ? 960 : 900; // cadre virtuel, ancre le long de la route
          const AYL = 630; // 16:9 : hauteur à l'écran du foyer latéral de la caméra
          const M = LAND ? new DOMMatrix([0, 1, -1, 0, VH - 960 + AY, AYL - VW / 2]) : new DOMMatrix();
          const S = (xp, yp) => (LAND ? [-yp + M.e, xp + M.f] : [xp, yp]); // virtuel → écran
          const Pinv = (lx, ly) => (LAND ? [ly - M.f, M.e - lx] : [lx, ly]); // écran → virtuel
          const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
          const lerp = (a, b, u) => a + (b - a) * u;
          const smooth = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
          const io2 = (u) => { u = clamp(u, 0, 1); return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; };
          const sine = (u) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(u, 0, 1));
          const rad = (d) => (d * Math.PI) / 180;
          function mulberry32(a) {
            return function () {
              a |= 0; a = (a + 0x6d2b79f5) | 0;
              let t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          // ─────────────────────────── Caméra ───────────────────────────
          // échelle (px/m) : interpolée en log entre des clés ; foyer : suit l'action
          // 3 → 10,8 s : l'échelle cadre les deux deux-roues dans la bande utile (≈ 780 px entre les cartes et le bas)
          const BAND = LAND ? 1500 : 780;
          function follow(t) {
            const tau = K.tauAt(t), a = K.scooter(tau), b = K.bmw(tau);
            const span = Math.max(a.y + K.P.LA / 2, b.y + K.P.LB / 2) - Math.min(a.y - K.P.LA / 2, b.y - K.P.LB / 2);
            return Math.min(LAND ? 130 : 95, BAND / (span + 3.0));
          }
          // 12 → 15 s : même principe sur la chute (moto, motard, scooter, point de contact)
          function postBox(t) {
            const tau = K.tauAt(t), a = K.scooter(tau), b = K.bmw(tau), r = K.rider(tau);
            const top = Math.max(b.y + 1.3, r.y + 1.0, a.y + 1.0), bot = Math.min(K.contact.y - 0.9, a.y - 1.0);
            return { top, bot, s: Math.min(LAND ? 190 : 140, BAND / (top - bot + 1.6)) };
          }
          const SK = [[0, 0.42], [2.95, follow(2.95), io2], [10.8, null], [11.25, 190, io2], [11.95, 190, io2], [12.9, null], [15.0, null], [16.6, LAND ? 40 : 23, io2]];
          function scaleAt(t) {
            if (t <= SK[0][0]) return SK[0][1];
            if (t >= 2.95 && t <= 10.8) return follow(t);
            if (t > 10.8 && t <= 11.25) return Math.exp(lerp(Math.log(follow(10.8)), Math.log(190), io2((t - 10.8) / 0.45)));
            if (t > 11.95 && t <= 12.9) return Math.exp(lerp(Math.log(190), Math.log(postBox(t).s), io2((t - 11.95) / 0.95)));
            if (t > 12.9 && t <= 15.0) return postBox(t).s;
            if (t > 15.0 && t <= 16.6) return Math.exp(lerp(Math.log(postBox(15.0).s), Math.log(LAND ? 40 : 23), io2((t - 15.0) / 1.6)));
            for (let i = 1; i < SK.length; i++) {
              if (t <= SK[i][0]) {
                const u = SK[i][2]((t - SK[i - 1][0]) / (SK[i][0] - SK[i - 1][0]));
                return Math.exp(lerp(Math.log(SK[i - 1][1]), Math.log(SK[i][1]), u));
              }
            }
            return SK[SK.length - 1][1];
          }
          const yTop = K.restB.y + 1.3, yBot = K.yB0 - K.P.LB / 2 - 0.4;
          const OVER = { x: 0.6, y: (yTop + yBot) / 2 };
          const CONT = { x: 1.55, y: K.contact.y + 0.25 };
          const mix = (a, b, u) => ({ x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u) });
          function focusAt(t) {
            const tau = K.tauAt(t), a = K.scooter(tau), b = K.bmw(tau), r = K.rider(tau);
            const pair = { x: 1.55, y: (a.y + b.y) / 2 };
            const pb = postBox(t), post = { x: 1.0, y: (pb.top + pb.bot) / 2 };
            let f;
            if (t < 8.8) f = pair;
            else if (t < 11.25) f = mix(pair, CONT, io2((t - 8.8) / 2.45));
            else if (t < 11.95) f = CONT;
            else if (t < 12.9) f = mix(CONT, post, io2((t - 11.95) / 0.95));
            else if (t < 15.0) f = post;
            else f = mix(post, OVER, io2((t - 15.0) / 1.6));
            if (t < 2.95) f = { x: lerp(-2.0, f.x, io2(t / 2.95)), y: f.y };
            return f;
          }
          function cameraAt(t) { const f = focusAt(t); return { x: f.x, y: f.y, s: scaleAt(t) }; }

          // ─────────────────────────── Fond de carte dessiné ───────────────────────────
          if (LAND) document.querySelectorAll(".w-arrow").forEach((e) => e.classList.add("f16x9"));
          const cv = $("w-map");
          cv.width = W; cv.height = H;
          $("w-svg").setAttribute("viewBox", `0 0 ${W} ${H}`);
          if (LAND) $("w-rot").setAttribute("transform", `matrix(0,1,-1,0,${M.e},${M.f})`);
          const ctx = cv.getContext("2d");
          const rnd = mulberry32(20261106);
          function texture(n, cells, seed, ampC, ampF) {
            const r = mulberry32(seed);
            const small = document.createElement("canvas"); small.width = small.height = cells;
            const sg = small.getContext("2d"), sd = sg.createImageData(cells, cells);
            for (let i = 0; i < cells * cells; i++) { const v = 128 + (r() - 0.5) * 2 * ampC; sd.data.set([v, v, v, 255], i * 4); }
            sg.putImageData(sd, 0, 0);
            const c = document.createElement("canvas"); c.width = c.height = n;
            const g = c.getContext("2d");
            g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
            g.drawImage(small, 0, 0, n, n);
            const d = g.getImageData(0, 0, n, n);
            for (let i = 0; i < n * n; i++) { const k = (r() - 0.5) * 2 * ampF; d.data[i * 4] += k; d.data[i * 4 + 1] += k; d.data[i * 4 + 2] += k; }
            g.putImageData(d, 0, 0);
            return c;
          }
          const TEX = [texture(256, 24, 11, 34, 10), texture(256, 32, 12, 26, 22), texture(256, 40, 13, 18, 26)];
          const PAT = TEX.map((c) => ctx.createPattern(c, "repeat"));
          const PAT_SIZE = [70, 9, 1.6]; // m par tuile

          // Ville : rues, îlots, toits (Path2D en mètres)
          const EXT_X = 1300, EXT_Y = 2500;
          const inDirt = (x0, y0, x1, y1) =>
            (x1 > 13.5 && x0 < 175 && y1 > -340 && y0 < 280) || (x0 < -18.5 && x1 > -215 && y1 > -310 && y0 < 250);
          const ROOFS = ["#e2d9c8", "#d6cab4", "#cbbca2", "#ebe6dc", "#beae93", "#c98b6b", "#9ea6a8"];
          const ROOFW = [0.22, 0.22, 0.18, 0.14, 0.12, 0.07, 0.05];
          const city = { urban: new Path2D(), park: new Path2D(), streets: new Path2D(), shadow: new Path2D(), roofs: ROOFS.map(() => new Path2D()), parkTrees: new Path2D() };
          (function buildCity() {
            const ew = []; let y = -EXT_Y;
            while (y < EXT_Y) { y += 92 + rnd() * 58; if (y > -150 && y < 130) continue; ew.push([y, rnd() < 0.12 ? 20 : 9 + rnd() * 4]); }
            const ns = [[-18.5, 0], [13.5, 0]];
            let x = 13.5; while (x < EXT_X) { x += x === 13.5 ? 150 + rnd() * 40 : 84 + rnd() * 50; ns.push([x, rnd() < 0.1 ? 20 : 9 + rnd() * 3]); }
            x = -18.5; while (x > -EXT_X) { x -= x === -18.5 ? 190 + rnd() * 40 : 84 + rnd() * 50; ns.push([x, rnd() < 0.1 ? 20 : 9 + rnd() * 3]); }
            ns.sort((a, b) => a[0] - b[0]);
            for (const [yy, w] of ew) { city.streets.rect(-EXT_X, yy - w / 2, 2 * EXT_X, w); }
            for (const [xx, w] of ns) if (w > 0) city.streets.rect(xx - w / 2, -EXT_Y, w, 2 * EXT_Y);
            const ys = [-EXT_Y, ...ew.map((e) => e[0]), EXT_Y];
            const yw = [0, ...ew.map((e) => e[1]), 0];
            for (let j = 0; j < ns.length - 1; j++) {
              const xa = ns[j][0] + ns[j][1] / 2, xb = ns[j + 1][0] - ns[j + 1][1] / 2;
              if (xa < 0 && xb > 0) continue; // le boulevard
              for (let i = 0; i < ys.length - 1; i++) {
                const ya = ys[i] + yw[i] / 2, yb = ys[i + 1] - yw[i + 1] / 2;
                if (xb - xa < 20 || yb - ya < 20) continue;
                if (inDirt(xa, ya, xb, yb)) continue;
                const r = rnd();
                if (r < 0.06) {
                  city.park.rect(xa + 2, ya + 2, xb - xa - 4, yb - ya - 4);
                  for (let k = 0; k < (xb - xa) * (yb - ya) / 90; k++) { const px = lerp(xa + 5, xb - 5, rnd()), py = lerp(ya + 5, yb - 5, rnd()); city.parkTrees.moveTo(px + 2.5, py); city.parkTrees.arc(px, py, 1.8 + rnd() * 1.6, 0, 6.2832); }
                  continue;
                }
                if (r < 0.15) continue; // terrain vague
                city.urban.rect(xa + 1.5, ya + 1.5, xb - xa - 3, yb - ya - 3);
                const rows = yb - ya > 38 ? 2 : 1;
                const rowH = (yb - ya - 6) / rows;
                for (let rr = 0; rr < rows; rr++) {
                  const r0 = ya + 3 + rr * rowH;
                  let px = xa + 3;
                  while (px < xb - 9) {
                    const pw = Math.min(xb - 3 - px, 8 + rnd() * 10);
                    const depth = rowH * (0.62 + rnd() * 0.33);
                    const by = rr === 0 ? r0 : r0 + rowH - depth;
                    const h = 6 + rnd() * 10;
                    const bx0 = px + 0.5, bw = pw - 1.0;
                    city.shadow.rect(bx0 + 0.75 * h, by + 0.15 * h, bw, depth);
                    let q = rnd(), ci = 0; while (ci < ROOFW.length - 1 && q > ROOFW[ci]) { q -= ROOFW[ci]; ci++; }
                    city.roofs[ci].rect(bx0, by, bw, depth);
                    px += pw;
                  }
                }
              }
            }
          })();

          // Terrains vagues autour du lieu : taches, traces de pneus, buissons, gravats
          const lot = { dark: new Path2D(), light: new Path2D(), tracks: new Path2D(), shrubs: new Path2D(), shrubSh: new Path2D(), rubble: new Path2D() };
          (function buildLots() {
            const zones = [[13.5, -340, 175, 280], [-215, -310, -18.5, 250]];
            for (const [x0, y0, x1, y1] of zones) {
              const area = (x1 - x0) * (y1 - y0);
              for (let k = 0; k < area / 260; k++) {
                const px = lerp(x0, x1, rnd()), py = lerp(y0, y1, rnd()), rx = 2 + rnd() * 9, ry = 2 + rnd() * 9;
                (rnd() < 0.5 ? lot.dark : lot.light).ellipse(px, py, rx, ry, rnd() * 3, 0, 6.2832);
              }
              for (let k = 0; k < area / 1800; k++) {
                let px = lerp(x0 + 6, x1 - 6, rnd()), py = lerp(y0, y1, rnd()), a = rnd() * 6.28;
                for (const off of [-0.8, 0.8]) {
                  const ox = Math.cos(a + 1.57) * off, oy = Math.sin(a + 1.57) * off;

              } else {
                at(E["w-laneL"], 56, ly - 48); // bord gauche fixe dans la zone utile ; le trait passe sous la carte
                E["w-ld-lane"].setAttribute("d", `M300,${ly}L${(xl + 18).toFixed(1)},${ly}`);
              }
            }

            // repères (cercles) tant que les deux-roues sont petits
            const lo = (t > 9 ? 0 : smooth((t - 3.05) / 0.4) * clamp((44 - s) / 12, 0, 1)).toFixed(3);
            [["w-locA", a], ["w-locB", b]].forEach(([id, p]) => {
              E[id].setAttribute("cx", X(p.x).toFixed(1)); E[id].setAttribute("cy", Y(p.y).toFixed(1));
              E[id].setAttribute("r", Math.max(30, 1.7 * s).toFixed(1)); E[id].setAttribute("opacity", lo);
            });

            // étiquettes A / B, vitesses en direct
            if (LAND) { // sous chaque deux-roues
              const qa = S(X(a.x + 0.55), Y(a.y)), qb = S(X(b.x + 0.62), Y(b.y));
              at(E["w-tagA"], qa[0], qa[1] + 14, "ct"); at(E["w-tagB"], qb[0], qb[1] + 14, "ct");
            } else {
              at(E["w-tagA"], X(a.x + 0.55) + 16, Y(a.y) - 46);
              at(E["w-tagB"], X(b.x + 0.62) + 16, Y(b.y) - 46);
            }
            E["w-vA"].textContent = String(Math.round(a.v * 3.6));
            E["w-vB"].textContent = String(Math.round(b.v * 3.6));

            // point de contact : anneau qui s'ouvre (11,48 → 12,1 s) et repère qui reste
            const cx = X(K.contact.x), cy = Y(K.contact.y);
            const kr = clamp((t - 11.48) / 0.62, 0, 1), kr2 = clamp((t - 11.62) / 0.62, 0, 1);
            [[E["w-ring"], kr], [E["w-ring2"], kr2]].forEach(([el, q]) => {
              el.setAttribute("cx", cx.toFixed(1)); el.setAttribute("cy", cy.toFixed(1));
              el.setAttribute("r", ((0.12 + 1.3 * (1 - Math.pow(1 - q, 3))) * s).toFixed(1));
              el.setAttribute("opacity", q > 0 && q < 1 ? (1 - q).toFixed(3) : "0");
            });
            E["w-mark"].setAttribute("cx", cx.toFixed(1)); E["w-mark"].setAttribute("cy", cy.toFixed(1));
            E["w-mark"].setAttribute("r", Math.max(9, 0.16 * s).toFixed(1));

            // étiquette du contact en gros plan (à droite, au-dessus)
            if (LAND) {
              const q = S(cx, cy), lx = q[0] + 300, ly = q[1] - 240;
              at(E["w-clL"], lx, ly, "cc"); dline(E["w-ld-cl"], [q[0] + 12, q[1] - 12], [lx, ly]);
            } else {
              const clx = cx + 150, cly = cy - 190;
              at(E["w-clL"], clx, cly - 34);
              E["w-ld-cl"].setAttribute("d", `M${cx + 14},${cy - 14}L${clx},${cly}`);
            }

            // vue d'ensemble : étiquettes en colonne à droite (A, B, contact) et à gauche (motard)
            const ov = [
              ["w-ovB", "w-ld-ovB", K.restB, 0, 1, 0.0],
              ["w-ovA", "w-ld-ovA", K.restA, 0, 1, -10],
              ["w-ovC", "w-ld-ovC", K.contact, 0, 1, 70],
              ["w-ovR", "w-ld-ovR", K.restR, 0, -1, 0],
            ];
            if (LAND) { // étiquettes déployées autour des positions finales (dessous : B, A, contact ; dessus : motard)
              const OFF = { "w-ovB": [40, 200], "w-ovA": [80, 300], "w-ovC": [-200, 210], "w-ovR": [0, -175] };
              for (const [id, ld, p] of ov) {
                const q = S(X(p.x + (id === "w-ovB" ? -0.4 : 0)), Y(p.y)), lx = q[0] + OFF[id][0], ly = q[1] + OFF[id][1];
                at(E[id], lx, ly, "cc"); dline(E[ld], q, [lx, ly]);
              }
            } else for (const [id, ld, p, , side, dy] of ov) {
              const px = X(p.x + (id === "w-ovB" ? -0.4 : 0)), py = Y(p.y);
              if (side > 0) {
                const lx = 680, ly = py + dy;
                at(E[id], lx, ly - 34);
                E[ld].setAttribute("d", `M${px + 10},${py}L${lx - 26},${ly}L${lx},${ly}`);
              } else {
                const lx = 430, ly = py + dy;
                at(E[id], lx, ly - 34, true);
                E[ld].setAttribute("d", `M${px - 10},${py}L${lx + 26},${ly}L${lx},${ly}`);
              }
            }
          }

          // début de la scène dans le film (somme des data-start des hôtes)
          let hostStart = 0;
          for (let el = cv; el; el = el.parentElement) {
            if (el.hasAttribute && el.hasAttribute("data-start") && el.hasAttribute("data-composition-id")) hostStart += parseFloat(el.getAttribute("data-start")) || 0;
          }
          window.addEventListener("hf-seek", (e) => renderAt(Math.max(0, e.detail.time - hostStart)));
          renderAt(0);

          // ─────────────────────────── Apparitions (GSAP) ───────────────────────────
          const tl = gsap.timeline({ paused: true });
          const IN = { opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power3.out" };
          const show = (sel, a, b) => {
            tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { ...IN }, K.T(a));
            if (b !== undefined) tl.to(sel, { opacity: 0, filter: "blur(6px)", duration: 0.16, ease: "power2.in" }, K.T(b));
          };
          const fade = (sel, a, b, o = 1) => {
            tl.fromTo(sel, { opacity: 0 }, { opacity: o, duration: 0.3, ease: "power2.out" }, K.T(a));
            if (b !== undefined) tl.to(sel, { opacity: 0, duration: 0.2, ease: "power2.in" }, K.T(b));
          };
          show("#w-tagA > .in", 3.35);
          show("#w-tagB > .in", 3.55);
          tl.to(["#w-tagA > .in", "#w-tagB > .in"], { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, K.T(10.55));
          show("#w-roadN > .in", 1.6, 3.75);
          show("#w-roadS > .in", 1.72, 3.75);
          show("#w-roadN2 > .in", 16.45);
          show("#w-roadS2 > .in", 16.6);
          fade("#w-lane", 3.55, 6.9);
          show("#w-laneL > .in", 3.6, 6.85);
          fade("#w-ld-lane", 3.6, 6.8);
          fade("#w-gap", 6.35, 7.75);
          show("#w-gapL > .in", 6.45, 7.7);
          fade("#w-mark", 11.5, undefined, 1);
          show("#w-clL > .in", 11.62, 12.55);
          fade("#w-ld-cl", 11.6, 12.5);
          tl.to("#w-mark", { opacity: 0.85, duration: 0.3 }, K.T(12.6));
          fade("#w-over", 15.7);
          fade("#w-gap2", 16.1);
          show("#w-gap2L > .in", 16.25);
          [["w-ovB", 17.25], ["w-ovR", 17.55], ["w-ovA", 17.85], ["w-ovC", 18.15]].forEach(([id, a]) => {
            show(`#${id} > .in`, a);
            fade(`#w-ld-${id.slice(2)}`, a - 0.05);
          });
          tl.to("#w-mark", { opacity: 1, duration: 0.2 }, K.T(18.1));
          tl.set({}, {}, K.T(20.4));
          window.__timelines["world"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
