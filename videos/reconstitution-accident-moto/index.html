<!doctype html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <!-- cinématique de la reconstitution (positions, vitesses, distances) : window.KIN -->
    <script src="assets/kinematics.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d1316;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: #0d1316;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Reconstitution d'accident (simulation) — 55 s, 1080×1920. Plan : SPEC.md ; chiffres : assets/kinematics.js -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="55" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="world" class="scene" data-track-kind="graphics"
        data-composition-id="world" data-composition-src="compositions/world.html"
        data-start="0" data-duration="28" data-track-index="0" style="z-index: 1"></div>
      <div id="steps" class="scene" data-track-kind="graphics"
        data-composition-id="steps" data-composition-src="compositions/steps.html"
        data-start="4" data-duration="23.6" data-track-index="1" style="z-index: 3"></div>
      <div id="title" class="scene" data-track-kind="graphics"
        data-composition-id="title" data-composition-src="compositions/title.html"
        data-start="0" data-duration="4" data-track-index="2" style="z-index: 4"></div>
      <div id="law" class="scene" data-track-kind="graphics"
        data-composition-id="law" data-composition-src="compositions/law.html"
        data-start="27.6" data-duration="16" data-track-index="4" style="z-index: 5"></div>
      <div id="summary" class="scene" data-track-kind="graphics"
        data-composition-id="summary" data-composition-src="compositions/summary.html"
        data-start="43.2" data-duration="11.8" data-track-index="2" style="z-index: 6"></div>
      <div id="chrome" class="scene" data-track-kind="graphics"
        data-composition-id="chrome" data-composition-src="compositions/chrome.html"
        data-start="0" data-duration="55" data-track-index="3" style="z-index: 7"></div>
      <!-- son : musique de marque (tools/music.py), souffle sur la plongée, petits clics à l'arrivée des étapes et des repères -->
      <audio id="a-music" class="clip" src="assets/music/fond.m4a" data-start="0" data-duration="55" data-track-index="10" data-volume="1"></audio>
      <audio id="a-whoosh" class="clip" src="assets/sfx/whoosh-soft.wav" data-start="1.6" data-duration="0.7" data-track-index="11" data-volume="0.5"></audio>
      <audio id="a-tick1" class="clip" src="assets/sfx/tick.wav" data-start="4.188" data-duration="0.09" data-track-index="12" data-volume="0.55"></audio>
      <audio id="a-tick2" class="clip" src="assets/sfx/blip.wav" data-start="8.975" data-duration="0.09" data-track-index="12" data-volume="0.45"></audio>
      <audio id="a-tick3" class="clip" src="assets/sfx/tick.wav" data-start="11.537" data-duration="0.09" data-track-index="12" data-volume="0.55"></audio>
      <audio id="a-tick4" class="clip" src="assets/sfx/blip.wav" data-start="13.912" data-duration="0.09" data-track-index="12" data-volume="0.45"></audio>
      <audio id="a-tick5" class="clip" src="assets/sfx/tick.wav" data-start="16.075" data-duration="0.09" data-track-index="12" data-volume="0.55"></audio>
      <audio id="a-tick6" class="clip" src="assets/sfx/blip.wav" data-start="20.137" data-duration="0.09" data-track-index="12" data-volume="0.45"></audio>
      <audio id="a-tick7" class="clip" src="assets/sfx/tick.wav" data-start="22.8" data-duration="0.09" data-track-index="12" data-volume="0.3"></audio>
      <audio id="a-tick8" class="clip" src="assets/sfx/blip.wav" data-start="23.329" data-duration="0.09" data-track-index="12" data-volume="0.25"></audio>
      <audio id="a-tick9" class="clip" src="assets/sfx/tick.wav" data-start="23.859" data-duration="0.09" data-track-index="12" data-volume="0.3"></audio>
      <audio id="a-tick10" class="clip" src="assets/sfx/blip.wav" data-start="24.388" data-duration="0.09" data-track-index="12" data-volume="0.25"></audio>
      <audio id="a-tick11" class="clip" src="assets/sfx/tick.wav" data-start="28" data-duration="0.09" data-track-index="12" data-volume="0.45"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 55);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
