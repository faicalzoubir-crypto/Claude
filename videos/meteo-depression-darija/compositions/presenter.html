<template>
  <style>
    @font-face { font-family: "Cairo"; src: url("assets/fonts/cairo-arabic-700-normal.woff2") format("woff2"); font-weight: 700; }
    #root { position: absolute; inset: 0; pointer-events: none; }
    /* the presenter: full frame in s1 and s6, picture-in-picture top-left (over the sea on the map) otherwise */
    #pres-frame { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; }
    #presenter { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    #pres-edge { position: absolute; left: 36px; top: 190px; width: 252px; height: 448px; border-radius: 18px;
                 border: 3px solid #FFFFFF; opacity: 0; }
    .ph svg { position: absolute; left: 0; top: 0; }
    .ph-t { position: absolute; left: 0; right: 0; top: 330px; text-align: center; direction: rtl;
            font-family: "Cairo", sans-serif; font-weight: 700; font-size: 56px; color: #6F86A6; }
  </style>
  <div id="root" data-composition-id="presenter" data-width="1080" data-height="1920">
    <div id="pres-frame">
      <div id="presenter" class="clip ph" data-start="0" data-duration="90.0" data-track-index="1"><svg viewBox="0 0 1080 1920" width="1080" height="1920" aria-hidden="true"><rect width="1080" height="1920" fill="#13263F"/><circle cx="540" cy="700" r="190" fill="#24405F"/><path d="M150 1920 C170 1330 330 1120 540 1120 C750 1120 910 1330 930 1920 Z" fill="#24405F"/></svg><div class="ph-t" data-layout-ignore>الأڤاتار ديالك هنا</div></div>
    </div>
    <div id="pres-edge"></div>
  </div>
  <script>
    (function () {
      const C = window.CUES;
      const tl = gsap.timeline({ paused: true });
      const PIP = { x: 36, y: 190, scale: 252 / 1080, borderRadius: 18 / (252 / 1080) };
      const FULL = { x: 0, y: 0, scale: 1, borderRadius: 0 };
      const ids = Object.keys(C.scenes).sort((a, b) => C.scenes[a].start - C.scenes[b].start);
      let state = C.scenes[ids[0]].presenter;
      tl.set("#pres-frame", state === "full" ? FULL : PIP, 0);
      tl.set("#pres-edge", { opacity: state === "full" ? 0 : 1 }, 0);
      ids.slice(1).forEach((id) => {
        const s = C.scenes[id];
        if (s.presenter === state) return;
        const t = s.start - (s.presenter === "pip" ? 0.12 : 0.35);
        if (s.presenter === "pip") {
          tl.fromTo("#pres-frame", FULL, { ...PIP, duration: 0.7, ease: "power3.inOut" }, t);
          tl.fromTo("#pres-edge", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, t + 0.6);
        } else {
          tl.fromTo("#pres-edge", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, t);
          tl.fromTo("#pres-frame", PIP, { ...FULL, duration: 0.7, ease: "power3.inOut" }, t + 0.04);
        }
        state = s.presenter;
      });
      window.__timelines["presenter"] = tl;
    })();
  </script>
</template>
