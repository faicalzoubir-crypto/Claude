<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: #000000; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      .media { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- The Last King. Written by tools/build.py from its timing table: retime there, then run it again. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-fps="24" data-width="1080" data-height="1920">
      <div id="ground"></div>
      <!-- scenes -->
      <div id="el-s1" class="scene" data-track-kind="graphics"
        data-composition-id="s1" data-composition-src="compositions/s1.html"
        data-start="0.0" data-duration="10.0" data-track-index="0"></div>
      <div id="el-s2" class="scene" data-track-kind="graphics"
        data-composition-id="s2" data-composition-src="compositions/s2.html"
        data-start="10.0" data-duration="8.0" data-track-index="0"></div>
      <div id="el-s3" class="scene" data-track-kind="graphics"
        data-composition-id="s3" data-composition-src="compositions/s3.html"
        data-start="18.0" data-duration="10.0" data-track-index="0"></div>
      <div id="el-s4" class="scene" data-track-kind="graphics"
        data-composition-id="s4" data-composition-src="compositions/s4.html"
        data-start="28.0" data-duration="10.0" data-track-index="0"></div>
      <div id="el-s5" class="scene" data-track-kind="graphics"
        data-composition-id="s5" data-composition-src="compositions/s5.html"
        data-start="38.0" data-duration="12.0" data-track-index="0"></div>
      <div id="el-s6" class="scene" data-track-kind="graphics"
        data-composition-id="s6" data-composition-src="compositions/s6.html"
        data-start="50.0" data-duration="10.0" data-track-index="0"></div>
      <!-- swirling brushstroke dissolves between scenes -->
      <video id="dz-s1b-s2a" class="clip media" src="assets/transitions/s1b-s2a.mp4" muted playsinline
        data-start="9.2" data-duration="1.6" data-media-start="0"
        data-track-index="1" style="z-index: 30"></video>
      <video id="dz-s2b-s3a" class="clip media" src="assets/transitions/s2b-s3a.mp4" muted playsinline
        data-start="17.2" data-duration="1.6" data-media-start="0"
        data-track-index="1" style="z-index: 30"></video>
      <video id="dz-s3c-s4a" class="clip media" src="assets/transitions/s3c-s4a.mp4" muted playsinline
        data-start="27.2" data-duration="1.6" data-media-start="0"
        data-track-index="1" style="z-index: 30"></video>
      <video id="dz-s4c-s5a" class="clip media" src="assets/transitions/s4c-s5a.mp4" muted playsinline
        data-start="37.2" data-duration="1.6" data-media-start="0"
        data-track-index="1" style="z-index: 30"></video>
      <video id="dz-s5c-s6a" class="clip media" src="assets/transitions/s5c-s6a.mp4" muted playsinline
        data-start="49.2" data-duration="1.6" data-media-start="0"
        data-track-index="1" style="z-index: 30"></video>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 60);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
