<template>
  <script src="vendor/gsap.min.js"></script>
  <style>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const blurIn = (sel, t, d = 0.2) =>
        tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power4.out" }, t);
      const stamp = (sel, t) =>

      blurIn("#s5-hd", 0);
      tl.fromTo("#s5-hd .mk", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 0.1);

      // uniform rotation: the same 180°/s from first frame to last
      gsap.set("#s5-rot", { svgOrigin: "540 530" });
      tl.fromTo("#s5-rot", { rotation: 0 }, { rotation: -1980, duration: 11, ease: "none" }, 0);
      tl.fromTo("#s5-rot", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.15);

      // one turn = T

      tl.fromTo("#s5-turn", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 2.8);
      blurIn("#s5-tour", 4.85);
      tl.fromTo("#s5-turn", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 6.0);

      stamp("#s5-pT", 5.0);
      blurIn("#s5-u-t", 5.25);
      stamp("#s5-pf", 6.0);
      blurIn("#s5-u-f", 6.25);
      blurIn("#s5-imp", 7.0);
      stamp("#s5-pw", 7.2);
      blurIn("#s5-u-w", 7.45);

      // exit: whip up into the graph

      window.__timelines = window.__timelines || {};
      window.__timelines["s5"] = tl;
    })();
