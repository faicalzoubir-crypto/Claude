  <script>

      // M and N turn together: 55°/s counter-clockwise, then a 1 s stop at +20°

      tl.fromTo(".s4-up", { rotation: -300.5, transformOrigin: "50% 50%" }, { rotation: -47.5, duration: 4.6, ease: "none" }, 0);
      tl.to(".s4-up", { rotation: -20, duration: 1.0, ease: "power2.out" }, 4.6);

      // the velocity vectors: tangent, longer for the point further from the axis
      tl.fromTo("#s4-vm", { attr: { y2: 620 }, opacity: 0 }, { attr: { y2: 520 }, opacity: 1, duration: 0.4, ease: "expo.out" }, 3.4);
      tl.fromTo("#s4-vn", { attr: { y2: 620 }, opacity: 0 }, { attr: { y2: 407.5 }, opacity: 1, duration: 0.5, ease: "expo.out" }, 3.5);
      blurIn(".s4-lv", 3.75);
      tl.to("#s4-trails", { opacity: 0, duration: 0.3, ease: "power2.in" }, 6.0);

      tl.fromTo("#s4-pill", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.6)" }, 6.8);
      blurIn("#s4-u-v", 7.05);
      blurIn("#s4-u-w", 7.2);
      blurIn("#s4-u-r", 7.35);

      // V is tangent: the right angle between OM and V at N

        { opacity: 1, filter: "blur(0px)" },

        11.55,
      );
