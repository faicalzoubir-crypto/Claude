<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <script>
      // Candlelight: a seeded, finite, irregular exposure pulse (no Math.random, no timers).
      window.LXVI = {
        rng(seed) {
          let s = seed | 0;
          return () => {
            s = (s + 0x6d2b79f5) | 0;
            let t = Math.imul(s ^ (s >>> 15), 1 | s);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        },
        // tween --hf-color-grading-exposure on `sel` around `base` (±amp) from t0 to t1, 0.45–0.8 s segments
        flicker(tl, sel, t0, t1, base, amp, seed) {
          const r = this.rng(seed);
          let t = t0;
          while (t < t1 - 0.35) {
            const d = Math.min(0.45 + r() * 0.35, t1 - 0.3 - t);
            const v = base + (r() * 2 - 1) * amp;
            tl.to(sel, { "--hf-color-grading-exposure": v, duration: d, ease: "sine.inOut" }, t);
            t += d;
          }
          tl.to(sel, { "--hf-color-grading-exposure": base, duration: 0.3, ease: "sine.inOut" }, t1 - 0.3);
        },
      };
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- « La clé » — Louis XVI, 90 s. See SPEC.md. Intro 0–22.845 (the reference's edit, one word per beat), then the
         film on Viva La Vida's downbeats: 22.845 / 36.765 / 50.685 / 64.605 / 78.515. Each later scene dissolves in over
         1.5 s on top of the one it replaces. The King is one layer above the scenes; the intro's last word rides on top. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="90" data-width="1080" data-height="1920">
      <div id="intro" class="clip scene" style="z-index: 20" data-track-kind="graphics" data-track-index="3"
        data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="23.3" data-width="1080" data-height="1920"></div>
      <div id="v1" class="clip scene" style="z-index: 1" data-track-kind="graphics" data-track-index="0"
        data-composition-id="v1" data-composition-src="compositions/v1.html"
        data-start="22.845" data-duration="15.42" data-width="1080" data-height="1920"></div>
      <div id="r1" class="clip scene" style="z-index: 2" data-track-kind="graphics" data-track-index="1"
        data-composition-id="r1" data-composition-src="compositions/r1.html"
        data-start="36.765" data-duration="15.42" data-width="1080" data-height="1920"></div>
      <div id="v2" class="clip scene" style="z-index: 3" data-track-kind="graphics" data-track-index="0"
        data-composition-id="v2" data-composition-src="compositions/v2.html"
        data-start="50.685" data-duration="15.42" data-width="1080" data-height="1920"></div>
      <div id="fr" class="clip scene" style="z-index: 4" data-track-kind="graphics" data-track-index="1"
        data-composition-id="fr" data-composition-src="compositions/fr.html"
        data-start="64.605" data-duration="15.41" data-width="1080" data-height="1920"></div>
      <div id="outro" class="clip scene" style="z-index: 5" data-track-kind="graphics" data-track-index="0"
        data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="78.515" data-duration="11.485" data-width="1080" data-height="1920"></div>
      <div id="king" class="clip scene" style="z-index: 10" data-track-kind="graphics" data-track-index="2"
        data-composition-id="king" data-composition-src="compositions/king.html"
        data-start="22.845" data-duration="67.155" data-width="1080" data-height="1920"></div>
      <!-- soundtrack (tools/bande.sh): the reference clip 0–22.845, then Viva La Vida cut on downbeats -->
      <audio id="bande" src="assets/audio/bande.wav" data-start="0" data-duration="90" data-volume="1" data-track-index="4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
