    (function () {
      const tl = gsap.timeline({ paused: true });

      // local time: 0 = 22.845 s (his entrance on "One minute I held the key"). Sections, 13.92 s each (8 bars at 138 BPM):
      // verse 1 0–13.92 · refrain 1 13.92–27.84 · verse 2 27.84–41.76 · final refrain 41.76–55.67 · outro 55.67–67.155

      // camera (sine.inOut throughout): push, hold, slower push, hold, pull back
      tl.fromTo("#king-cam", { scale: 1.0 }, { scale: 1.07, duration: 13.92, ease: "sine.inOut" }, 0);
      tl.to("#king-cam", { scale: 1.09, duration: 13.92, ease: "sine.inOut" }, 13.92);
      tl.to("#king-cam", { scale: 1.12, duration: 13.92, ease: "sine.inOut" }, 27.84);
      tl.to("#king-cam", { scale: 1.13, duration: 15.41, ease: "sine.inOut" }, 41.76);
      tl.to("#king-cam", { scale: 0.96, duration: 9.985, ease: "sine.inOut" }, 57.17);

      // candlelight on his face: verse 1 at full, verse 2 a little dimmer
      LXVI.flicker(tl, "#king-royal-warm-img", 0, 14.5, 0, 0.03, 11);
      tl.to("#king-royal-warm-img", { "--hf-color-grading-exposure": -0.12, duration: 1.5, ease: "sine.inOut" }, 26.3);
      LXVI.flicker(tl, "#king-royal-warm-img", 27.84, 42.3, -0.12, 0.03, 23);

      // refrain 1: grey dawn takes the candle away; a shadow crosses half his face (confidence → understanding)
      tl.fromTo("#king-royal-cold", { opacity: 0 }, { opacity: 1, duration: 2.6, ease: "sine.inOut" }, 13.92);
      tl.fromTo("#king-royal-shade", { opacity: 0 }, { opacity: 0.8, duration: 6, ease: "sine.inOut" }, 17.5);
      // verse 2: back to the candle
      tl.to(["#king-royal-cold", "#king-royal-shade"], { opacity: 0, duration: 1.5, ease: "sine.inOut" }, 27.84);

      // final refrain: the King of January 1793 (same eyes, same place), cold dawn
      tl.fromTo("#king-1793", { opacity: 0 }, { opacity: 1, duration: 1.5, ease: "sine.inOut" }, 41.76);
      tl.to("#king-royal-warm", { opacity: 0, duration: 1.5, ease: "sine.inOut" }, 41.76);

      // the key: held (a slow breath), lowered on "Just a puppet on a lonely string",
      // slips on "I know Saint Peter won't call my name"
      tl.fromTo("#king-key", { y: 0, rotation: 62 }, { y: -2, rotation: 58, duration: 4.35, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
      tl.to("#king-key", { y: 110, rotation: 70, duration: 3.5, ease: "power1.inOut" }, 34.8);
      tl.to("#king-key", { y: 104, rotation: 67, duration: 0.13, ease: "sine.out" }, 47.415);
      tl.to("#king-key", { y: 1000, rotation: 140, duration: 0.85, ease: "power2.in" }, 47.545);

      // the end: black at 90 s, the King last
      tl.fromTo("#king-black", { opacity: 0 }, { opacity: 1, duration: 2.5, ease: "sine.in" }, 64.655);

      window.__timelines["king"] = tl;
    })();
