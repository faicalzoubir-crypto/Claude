<!doctype html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: #000; }
      .part { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: contain; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- The Last King (Darija). The person's three clips joined in their order, with six Arabic lines. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="85.739" data-fps="30"
      data-width="1080" data-height="1920">
      <div id="ground"></div>

      <video id="part-1" class="clip part" src="assets/clips/part-1.mov" playsinline data-has-audio="true"
        data-start="0" data-duration="30.015" data-track-index="0"></video>
      <video id="part-2" class="clip part" src="assets/clips/part-2.mov" playsinline data-has-audio="true"
        data-start="30.015" data-duration="29.985" data-track-index="0"></video>
      <video id="part-3" class="clip part" src="assets/clips/part-3.mov" playsinline data-has-audio="true"
        data-start="60" data-duration="25.739" data-track-index="0"></video>

      <div id="el-captions" class="scene" data-track-kind="captions" data-composition-id="captions"
        data-composition-src="compositions/captions.html" data-start="0" data-duration="85.739"
        data-track-index="1" style="z-index: 20"></div>

      <div id="el-progress" class="scene" data-track-kind="graphics" data-composition-id="progress"
        data-composition-src="compositions/progress.html" data-start="0" data-duration="85.739"
        data-track-index="2" style="z-index: 30"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 85.739);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
